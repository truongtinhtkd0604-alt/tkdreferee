<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEAMY TKD 7.1 - FIX UPLOAD</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --red: #f43f5e; --blue: #3b82f6; --gold: #f59e0b; --bg: #020617; --card: #1e293b; --text: #f8fafc; --border: #334155; --success: #10b981; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); margin: 0; color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 340px; background: #0f172a; border-right: 1px solid var(--border); padding: 15px; overflow-y: auto; }
        .main { flex: 1; padding: 20px; overflow-y: auto; }
        .tab-btn { padding: 8px; font-size: 11px; cursor: pointer; background: var(--card); color: white; border: 1px solid var(--border); border-radius: 4px; }
        .tab-btn.active { background: var(--blue); }
        .panel { display: none; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; margin-top: 10px; }
        .panel.active { display: block; }
        input, select { width: 100%; padding: 10px; margin-bottom: 8px; background: #000; color: white; border: 1px solid var(--border); border-radius: 6px; }
        .btn { padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; width: 100%; color: white; }
        .court-card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 15px; border-top: 4px solid var(--gold); }
        .match-item { background: #0a0f1e; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }
        .log-msg { font-size: 11px; padding: 5px; border-radius: 4px; margin-top: 5px; }
        .error { background: rgba(244, 63, 94, 0.2); color: #fda4af; }
        .ok { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    </style>
</head>
<body>

<aside class="sidebar">
    <h2 style="color:var(--gold); text-align:center;">HỆ THỐNG TEAMY 7.1</h2>
    
    <div id="auth-box">
        <input type="password" id="pass" placeholder="Mật khẩu Admin">
        <button class="btn" style="background:var(--red)" onclick="login()">ĐĂNG NHẬP</button>
    </div>

    <div id="admin-ui" style="display:none">
        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:4px">
            <button class="tab-btn active" onclick="tab(0)">FILE</button>
            <button class="tab-btn" onclick="tab(1)">VĐV</button>
            <button class="tab-btn" onclick="tab(2)">TRẬN</button>
            <button class="tab-btn" onclick="tab(3)">TT</button>
        </div>

        <div class="panel active">
            <h4 style="margin:0 0 10px 0">NHẬP DỮ LIỆU</h4>
            <div style="border: 1px dashed var(--border); padding: 10px; border-radius: 8px;">
                <label><small>1. Tải VĐV (Excel/CSV)</small></label>
                <input type="file" id="file-vdv" accept=".xlsx, .xls, .csv">
                <div id="log-vdv"></div>
                <button class="btn" style="background:var(--success); margin-top:5px" onclick="upload('vdv')">TẢI VẬN ĐỘNG VIÊN</button>
            </div>
            <div style="border: 1px dashed var(--border); padding: 10px; border-radius: 8px; margin-top:10px">
                <label><small>2. Tải Trọng Tài</small></label>
                <input type="file" id="file-ref" accept=".xlsx, .xls, .csv">
                <div id="log-ref"></div>
                <button class="btn" style="background:var(--blue); margin-top:5px" onclick="upload('ref')">TẢI TRỌNG TÀI</button>
            </div>
            <button class="btn" style="background:#444; margin-top:20px" onclick="clearData()">XÓA DỮ LIỆU CŨ</button>
        </div>

        <div class="panel">
            <h4 id="count-vdv">VĐV: 0</h4>
            <div id="vdv-list" style="max-height:300px; overflow-y:auto; font-size:11px"></div>
        </div>

        <div class="panel">
            <select id="m-court"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select>
            <input type="number" id="m-code" placeholder="Trận số">
            <input type="text" id="m-title" placeholder="Hạng cân">
            <select id="m-teamA" onchange="filterV(1)"></select>
            <select id="m-vA"></select>
            <select id="m-teamB" onchange="filterV(2)"></select>
            <select id="m-vB"></select>
            <button class="btn" style="background:var(--red)" onclick="addMatch()">TẠO TRẬN ĐẤU</button>
        </div>

        <div class="panel">
            <select id="assign-m" onchange="prepAssign()"></select>
            <div id="ref-slots"></div>
            <button id="btn-save-ref" class="btn" style="background:var(--success); display:none" onclick="saveRef()">GÁN TRỌNG TÀI</button>
        </div>
        
        <button class="btn" style="background:#1e293b; margin-top:20px" onclick="logout()">ĐĂNG XUẤT</button>
    </div>
</aside>

<main class="main">
    <div style="display:flex; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:10px">
        <h2 id="tour-name" style="color:var(--gold); margin:0">TAEKWONDO SYSTEM</h2>
        <div id="clock" style="font-family:monospace">00:00:00</div>
    </div>
    <div id="grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:15px; margin-top:20px"></div>
</main>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", 
    authDomain: "tkdreferee-4fbcc.firebaseapp.com",
    databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tkdreferee-4fbcc",
    appId: "1:17831183248:web:b3400d10be9ff017236915"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let data = { athletes: {}, refs: {}, matches: {}, teams: [] };
const master = localStorage.getItem('tkd_master') === 'true';
if(master) { document.getElementById('auth-box').style.display='none'; document.getElementById('admin-ui').style.display='block'; }

db.ref('tkd_online_data').on('value', snap => {
    data = snap.val() || { athletes: {}, refs: {}, matches: {}, teams: [] };
    render();
    if(master) uiUpdate();
});

function upload(type) {
    const file = document.getElementById(type === 'vdv' ? 'file-vdv' : 'file-ref').files[0];
    const log = document.getElementById(type === 'vdv' ? 'log-vdv' : 'log-ref');
    if(!file) return alert("Chọn file trước!");

    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(sheet);
            
            if(json.length === 0) { log.innerHTML = '<div class="log-msg error">File rỗng!</div>'; return; }

            // Kiểm tra cột thông minh
            const keys = Object.keys(json[0]);
            log.innerHTML = `<div class="log-msg ok">Đã đọc: ${keys.join(', ')}</div>`;

            if(type === 'vdv') {
                let ups = {}, ts = new Set(data.teams || []);
                json.forEach(r => {
                    const n = r['Họ và Tên VĐV'] || r['Họ tên'] || r['Tên VĐV'] || r['VĐV'];
                    const d = r['Tên Đơn Vị'] || r['Đơn vị'] || r['CLB'] || r['Đoàn'];
                    if(n && d) {
                        const id = "V" + Math.random().toString(36).substr(2, 5);
                        ups[id] = { name: String(n).trim(), team: String(d).trim(), cat: String(r['Nội Dung Thi Đấu'] || '').trim() };
                        ts.add(String(d).trim());
                    }
                });
                db.ref('tkd_online_data/athletes').update(ups);
                db.ref('tkd_online_data/teams').set(Array.from(ts));
            } else {
                let ups = {};
                json.forEach(r => {
                    const n = r['Tên Trọng Tài'] || r['Họ tên'] || r['Trọng tài'];
                    const d = r['Đơn vị'] || r['Tên Đơn Vị'] || r['CLB'];
                    if(n && d) {
                        const id = "R" + Math.random().toString(36).substr(2, 5);
                        ups[id] = { name: String(n).trim(), team: String(d).trim() };
                    }
                });
                db.ref('tkd_online_data/refs').update(ups);
            }
            alert("Tải lên thành công!");
        } catch(err) { log.innerHTML = `<div class="log-msg error">Lỗi: ${err.message}</div>`; }
    };
    reader.readAsArrayBuffer(file);
}

function render() {
    const grid = document.getElementById('grid'); grid.innerHTML = '';
    ["1", "2", "3"].forEach(c => {
        const ms = Object.entries(data.matches || {}).filter(([k,m]) => m.court == c);
        let h = `<div class="court-card"><h3>SÂN ${c}</h3>`;
        ms.sort((a,b) => a[1].code - b[1].code).forEach(([k,m]) => {
            const isLive = m.status === 'LIVE';
            h += `<div class="match-item" style="${isLive?'border-color:var(--success)':''}">
                <div style="display:flex; justify-content:space-between"><b>T.${m.code}</b> <small>${m.title}</small></div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin:10px 0">
                    <div style="color:var(--red); width:40%"><b>${m.athleteA}</b><br><small>${m.teamA}</small></div>
                    <div style="font-size:20px; font-weight:bold; color:var(--gold)">${m.score1}-${m.score2}</div>
                    <div style="color:var(--blue); width:40%; text-align:right"><b>${m.athleteB}</b><br><small>${m.teamB}</small></div>
                </div>
                <div style="font-size:9px; color:#777; border-top:1px solid #222; padding-top:4px">${m.assigned || 'Chưa có TT'}</div>
                ${master ? `<div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-top:8px">
                    ${isLive ? `<button onclick="score('${k}',1,1)" style="background:var(--red); border:none; color:white; border-radius:3px">+</button>
                                <button onclick="score('${k}',2,1)" style="background:var(--blue); border:none; color:white; border-radius:3px">+</button>
                                <button onclick="stt('${k}','FINISHED')" style="grid-column:span 2; background:#555; color:white; border:none; margin-top:3px">KẾT THÚC</button>` : 
                                `<button onclick="stt('${k}','LIVE')" style="grid-column:span 2; background:var(--success); color:white; border:none">BẮT ĐẦU</button>`}
                </div>` : ''}
            </div>`;
        });
        grid.innerHTML += h + '</div>';
    });
}

function uiUpdate() {
    const ts = (data.teams || []).sort();
    const optT = `<option value="">-- Chọn Đơn vị --</option>` + ts.map(t => `<option value="${t}">${t}</option>`).join('');
    ['m-teamA', 'm-teamB'].forEach(id => { if(!document.getElementById(id).value) document.getElementById(id).innerHTML = optT; });
    
    document.getElementById('count-vdv').innerText = `VĐV: ${Object.keys(data.athletes || {}).length}`;
    document.getElementById('assign-m').innerHTML = `<option value="">-- Chọn trận gán TT --</option>` + 
        Object.entries(data.matches || {}).filter(([k,m])=>!m.assigned).map(([k,m]) => `<option value="${k}">T.${m.code} - ${m.title}</option>`).join('');
}

function filterV(s) {
    const t = document.getElementById(s===1?'m-teamA':'m-teamB').value;
    const vs = Object.values(data.athletes || {}).filter(a => a.team === t);
    document.getElementById(s===1?'m-vA':'m-vB').innerHTML = vs.map(a => `<option value="${a.name}">${a.name} (${a.cat})</option>`).join('');
}

function addMatch() {
    const m = {
        court: document.getElementById('m-court').value, code: document.getElementById('m-code').value,
        title: document.getElementById('m-title').value, teamA: document.getElementById('m-teamA').value,
        teamB: document.getElementById('m-teamB').value, athleteA: document.getElementById('m-vA').value,
        athleteB: document.getElementById('m-vB').value, score1: 0, score2: 0, status: 'WAITING'
    };
    db.ref('tkd_online_data/matches').push(m);
}

function prepAssign() {
    const mid = document.getElementById('assign-m').value; if(!mid) return;
    const m = data.matches[mid];
    const neutral = Object.values(data.refs || {}).filter(r => r.team !== m.teamA && r.team !== m.teamB);
    let h = `<small>TT trung lập (${neutral.length})</small>`;
    for(let i=1; i<=3; i++) {
        h += `<select id="s-${i}"><option value="">TT ${i}</option>${neutral.map(r=>`<option value="${r.name}">${r.name} (${r.team})</option>`).join('')}</select>`;
    }
    document.getElementById('ref-slots').innerHTML = h;
    document.getElementById('btn-save-ref').style.display = 'block';
}

function saveRef() {
    const mid = document.getElementById('assign-m').value;
    const names = [1,2,3].map(i => document.getElementById('s-'+i).value).filter(n => n);
    if(names.length < 3) return alert("Chọn đủ 3 trọng tài!");
    db.ref(`tkd_online_data/matches/${mid}/assigned`).set("TT: " + names.join(", "));
}

function score(k, t, v) { const f = t===1?'score1':'score2'; db.ref(`tkd_online_data/matches/${k}/${f}`).set((data.matches[k][f]||0)+v); }
function stt(k, s) { db.ref(`tkd_online_data/matches/${k}/status`).set(s); }
function login() { if(document.getElementById('pass').value === '123') { localStorage.setItem('tkd_master','true'); location.reload(); } }
function logout() { localStorage.removeItem('tkd_master'); location.reload(); }
function tab(i) { document.querySelectorAll('.tab-btn, .panel').forEach((el, idx) => { el.classList.toggle('active', i === idx % 4); }); }
function clearData() { if(confirm("Xóa hết?")) db.ref('tkd_online_data').set({tournamentName: "TAEKWONDO"}); }
setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('vi-VN'); }, 1000);
</script>
</body>
</html>
