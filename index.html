<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý TST Professional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0033A0; --secondary: #C8102E; --success: #28a745; --warning: #ffc107; --info: #17a2b8; --dark: #1a1a1a; --light: #f8f9fa; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #eef2f7; margin: 0; padding: 10px; color: var(--dark); }
        
        #loginOverlay { position: fixed; inset: 0; background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }

        .app-container { max-width: 1100px; margin: auto; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: none; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-box { padding: 20px; border-radius: 12px; color: white; position: relative; overflow: hidden; }
        .stat-box h3 { margin: 0; font-size: 0.85rem; text-transform: uppercase; opacity: 0.8; }
        .stat-box p { margin: 10px 0 0; font-size: 1.6rem; font-weight: 800; }

        .section-title { font-size: 1rem; font-weight: 700; color: var(--primary); margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; background: var(--light); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        input, select { border: 1px solid #ddd; padding: 12px; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; box-sizing: border-box; width: 100%; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,51,160,0.1); }

        .btn { padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: #856404; font-weight: 700; }
        .btn-zalo { background: #0068ff; color: white; padding: 6px 12px; font-size: 0.85rem; text-decoration: none; border-radius: 6px; }
        .btn-zalo:hover { background: #0056d2; }

        .table-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; background: white; min-width: 800px; }
        th { background: #fcfcfc; color: #666; font-size: 0.8rem; text-transform: uppercase; padding: 15px; text-align: left; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #f0f0f0; font-size: 0.95rem; }
        .name-link { color: var(--primary); font-weight: 700; cursor: pointer; text-decoration: underline; }
        .badge-new { background: var(--success); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-right: 5px; font-weight: normal; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; padding: 20px; }
        .modal-content { background: white; max-width: 500px; margin: 50px auto; border-radius: 16px; padding: 25px; position: relative; }
        .close-modal { position: absolute; right: 20px; top: 20px; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="color:var(--primary)">HỆ THỐNG TST</h2>
        <input type="password" id="passInput" placeholder="Mật khẩu" style="margin-bottom:1rem;">
        <button class="btn btn-primary" onclick="checkLogin()" style="width:100%">ĐĂNG NHẬP</button>
    </div>
</div>

<div class="app-container" id="mainApp">
    <div class="header">
        <h2 style="margin:0; color:var(--primary)">CLUB TAEKWONDO TST</h2>
        <button class="btn btn-success" id="exportBtn">📥 XUẤT EXCEL</button>
    </div>

    <div class="stats-grid">
        <div class="stat-box" style="background: var(--success);"><h3>Tổng thu tháng</h3><p id="totalIncome">0 ₫</p></div>
        <div class="stat-box" style="background: var(--secondary);"><h3>Tổng chi tháng</h3><p id="totalExpense">0 ₫</p></div>
        <div class="stat-box" style="background: var(--warning); color:#856404;"><h3>Võ sinh nợ phí</h3><p id="debtCount">0 Bạn</p></div>
        <div class="stat-box" style="background: var(--info);"><h3>Võ sinh mới</h3><p id="newStudentCount">0 Bạn</p></div>
    </div>

    <div class="section-title">🔍 BỘ LỌC & TÌM KIẾM</div>
    <div class="grid-form">
        <input type="month" id="filterMonth">
        <select id="filterBranch">
            <option value="all">Tất cả cơ sở</option>
            <option value="CS1">CS1: 66 Huỳnh Tấn Phát</option>
            <option value="CS2">CS2: Sân vận động</option>
        </select>
        <input type="text" id="searchInput" placeholder="Nhập tên võ sinh...">
        <button class="btn btn-warning" id="showDebtBtn">LỌC VÕ SINH NỢ PHÍ</button>
    </div>

    <div class="section-title">📝 NHẬP GIAO DỊCH MỚI</div>
    <form id="transactionForm" class="grid-form">
        <select id="branch"><option value="CS1">CS1</option><option value="CS2">CS2</option></select>
        <select id="type"><option value="Học phí">Học phí</option><option value="Võ phục">Võ phục</option><option value="Chi phí vận hành">Chi phí</option></select>
        
        <input type="text" id="description" list="studentList" placeholder="Tên võ sinh / Nội dung" autocomplete="off" required>
        <datalist id="studentList"></datalist>

        <input type="text" id="amountDisplay" placeholder="Số tiền" required>
        <input type="hidden" id="amountActual">
        <input type="date" id="date" required>
        <button type="submit" class="btn btn-primary" style="grid-column: 1 / -1; max-width: 250px; justify-self: center;">LƯU HỆ THỐNG</button>
    </form>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr><th>Ngày</th><th>Cơ sở</th><th>Võ sinh</th><th>Loại giao dịch</th><th>Số tiền</th><th>Thao tác</th></tr>
            </thead>
            <tbody id="transactionList"></tbody>
        </table>
    </div>
</div>

<div id="profileModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h3 id="m_name" style="color:var(--primary); margin-top:0;"></h3>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
            <div>
                <label style="font-size:0.8rem; color:#666;">Trạng thái tập luyện:</label>
                <select id="m_status" style="margin-top:5px;">
                    <option value="active">Đang tập luyện</option>
                    <option value="quit">Đã nghỉ tập</option>
                </select>
            </div>
            <div>
                <label style="font-size:0.8rem; color:#666;">Cơ sở tập luyện:</label>
                <select id="m_branch" style="margin-top:5px;">
                    <option value="CS1">CS1: Huỳnh Tấn Phát</option>
                    <option value="CS2">CS2: Sân vận động</option>
                </select>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:20px;">
            <div>
                <label style="font-size:0.8rem; color:#666;">Mức học phí (VNĐ):</label>
                <input type="number" id="m_tuitionFee" placeholder="VD: 500000" style="margin-top:5px;">
            </div>
            <div>
                <label style="font-size:0.8rem; color:#666;">SĐT Liên hệ:</label>
                <input type="tel" id="m_phone" placeholder="SĐT phụ huynh" style="margin-top:5px;">
            </div>
        </div>

        <button class="btn btn-primary" onclick="updateProfile()" style="width:100%">CẬP NHẬT THÔNG TIN</button>
        <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
        <h4 style="margin-bottom:10px;">Lịch sử đóng phí gần nhất:</h4>
        <div id="m_history" style="font-size:0.9rem; max-height:150px; overflow-y:auto;"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, setDoc, getDoc } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfxbFrMabJHbARXpAqStIrSFlSAcCxgGY",
      authDomain: "quanly-tst.firebaseapp.com",
      projectId: "quanly-tst",
      storageBucket: "quanly-tst.firebasestorage.app",
      messagingSenderId: "981970279440",
      appId: "1:981970279440:web:8ac137ec4f72a39faa7e95"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "tst_transactions");
    const profRef = collection(db, "tst_profiles");

    window.checkLogin = () => {
        if(document.getElementById('passInput').value === "Tinhts64") {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        } else alert("Sai mật khẩu!");
    };

    // Hàm chuẩn hóa tên: Viết hoa chữ cái đầu, xóa khoảng trắng thừa
    function formatName(str) {
        return str.trim().replace(/\s+/g, ' ').split(' ')
                  .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
                  .join(' ');
    }

    const amtDisp = document.getElementById('amountDisplay');
    const amtAct = document.getElementById('amountActual');
    amtDisp.oninput = (e) => {
        let v = e.target.value.replace(/\D/g, '');
        amtAct.value = v;
        e.target.value = v ? parseInt(v).toLocaleString('vi-VN') : '';
    };

    let allTransactions = [];
    let allProfiles = {};

    onSnapshot(profRef, (snap) => {
        const dataList = document.getElementById('studentList');
        dataList.innerHTML = ''; 
        snap.forEach(d => {
            allProfiles[d.id] = d.data();
            dataList.innerHTML += `<option value="${d.id}">`; 
        });
        renderApp();
    });

    onSnapshot(query(colRef, orderBy("date", "desc")), (snap) => {
        allTransactions = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderApp();
    });

    // Auto-fill thông tin khi chọn Võ sinh
    document.getElementById('description').addEventListener('change', (e) => {
        if(document.getElementById('type').value === 'Chi phí vận hành') return;
        const name = formatName(e.target.value);
        e.target.value = name; // Cập nhật lại khung nhập cho đẹp
        
        const p = allProfiles[name];
        if (p) {
            if (p.branch) document.getElementById('branch').value = p.branch;
            if (document.getElementById('type').value === 'Học phí' && p.tuitionFee) {
                amtAct.value = p.tuitionFee;
                amtDisp.value = parseInt(p.tuitionFee).toLocaleString('vi-VN');
            }
        }
    });

    document.getElementById('filterMonth').addEventListener('input', () => renderApp());
    document.getElementById('filterBranch').addEventListener('change', () => renderApp());
    document.getElementById('searchInput').addEventListener('input', () => renderApp());

    function renderApp(debtMode = false) {
        const list = document.getElementById('transactionList');
        const selMonth = document.getElementById('filterMonth').value;
        const selBranch = document.getElementById('filterBranch').value;
        const search = document.getElementById('searchInput').value.toLowerCase();
        
        list.innerHTML = '';
        let inc = 0, exp = 0, newStudentsThisMonth = 0;

        // Tính nợ chính xác
        const activeStudents = Object.keys(allProfiles).filter(name => {
            const p = allProfiles[name];
            if(p.status !== 'active') return false;
            // Ràng buộc cơ sở
            if(selBranch !== 'all' && p.branch !== selBranch) return false;
            // Bỏ qua nếu võ sinh mới tạo hồ sơ SAU tháng đang lọc
            if(p.createdAt && selMonth && p.createdAt.substring(0,7) > selMonth) return false;
            return true;
        });

        const paidThisMonth = allTransactions
            .filter(t => t.date.startsWith(selMonth) && t.type === 'Học phí')
            .map(t => t.description);
            
        const debtStudents = activeStudents.filter(name => !paidThisMonth.includes(name));
        document.getElementById('debtCount').innerText = debtStudents.length + " Bạn";

        Object.values(allProfiles).forEach(p => {
            if (p.createdAt && selMonth && p.createdAt.startsWith(selMonth)) {
                newStudentsThisMonth++;
            }
        });
        document.getElementById('newStudentCount').innerText = newStudentsThisMonth + " Bạn";

        if(debtMode) {
            debtStudents.forEach(name => {
                const profile = allProfiles[name] || {};
                const branch = profile.branch || '---';
                const phone = profile.phone || "";
                const msg = `Xin chào phụ huynh võ sinh ${name}, CLUB TAEKWONDO TST gửi thông báo học phí tháng ${selMonth.split('-')[1]} của bé vẫn chưa được hoàn thành. Nhờ anh/chị kiểm tra và đóng học phí cho bé ạ. Trân trọng!`;
                const zaloLink = phone ? `https://zalo.me/${phone}` : `https://zalo.me/s/search/?q=${encodeURIComponent(name)}`;

                list.innerHTML += `<tr style="background:#fff9e6">
                    <td>---</td><td>${branch}</td>
                    <td class="name-link" onclick="openProfile('${name}')">${name}</td>
                    <td><span style="color:#856404; font-weight:bold;">Chưa đóng học phí</span></td>
                    <td style="color:red">Nợ</td>
                    <td><a href="${zaloLink}" target="_blank" class="btn-zalo" onclick="copyToClipboard('${msg}')">💬 Nhắc Zalo</a></td>
                </tr>`;
            });
            return;
        }

        allTransactions.forEach(t => {
            if(selMonth && !t.date.startsWith(selMonth)) return;
            if(selBranch !== 'all' && t.branch !== selBranch) return;
            if(search && !t.description.toLowerCase().includes(search)) return;

            const isInc = t.type !== 'Chi phí vận hành';
            isInc ? (inc += t.amount) : (exp += t.amount);

            // Gắn badge "Mới" nếu học viên đăng ký trong tháng
            const p = allProfiles[t.description];
            const isNew = (p && p.createdAt && p.createdAt.startsWith(selMonth)) ? `<span class="badge-new">Mới</span>` : '';

            list.innerHTML += `<tr>
                <td>${t.date.split('-').reverse().join('/')}</td>
                <td>${t.branch}</td>
                <td class="name-link" onclick="openProfile('${t.description}')">${isNew}${t.description}</td>
                <td>${t.type}</td>
                <td style="font-weight:700; color:${isInc?'var(--success)':'var(--secondary)'}">${isInc?'+':'-'}${t.amount.toLocaleString()} ₫</td>
                <td><button onclick="deleteTx('${t.id}')" style="color:red; border:none; background:none; cursor:pointer;">Xóa</button></td>
            </tr>`;
        });

        document.getElementById('totalIncome').innerText = inc.toLocaleString() + " ₫";
        document.getElementById('totalExpense').innerText = exp.toLocaleString() + " ₫";
    }

    window.copyToClipboard = (text) => { navigator.clipboard.writeText(text); alert("Đã copy tin nhắn nhắc nợ!"); };

    window.openProfile = async (name) => {
        document.getElementById('m_name').innerText = name;
        const p = allProfiles[name] || { status: 'active', branch: 'CS1', tuitionFee: '', phone: '' };
        
        document.getElementById('m_status').value = p.status;
        document.getElementById('m_branch').value = p.branch || 'CS1';
        document.getElementById('m_tuitionFee').value = p.tuitionFee || '';
        document.getElementById('m_phone').value = p.phone || '';

        const history = allTransactions.filter(t => t.description === name).slice(0, 5);
        document.getElementById('m_history').innerHTML = history.length 
            ? history.map(h => `<div style="padding:8px 0; border-bottom:1px solid #f9f9f9">${h.date.split('-').reverse().join('/')}: ${h.type} <strong style="color:var(--success)">(${h.amount.toLocaleString()}đ)</strong></div>`).join('')
            : 'Chưa có lịch sử giao dịch.';

        document.getElementById('profileModal').style.display = 'block';
    };

    window.updateProfile = async () => {
        const name = document.getElementById('m_name').innerText;
        const currentData = allProfiles[name] || {};
        await setDoc(doc(db, "tst_profiles", name), {
            ...currentData,
            status: document.getElementById('m_status').value,
            branch: document.getElementById('m_branch').value,
            tuitionFee: document.getElementById('m_tuitionFee').value,
            phone: document.getElementById('m_phone').value
        });
        alert("Đã cập nhật hồ sơ!");
        closeModal();
    };

    window.closeModal = () => document.getElementById('profileModal').style.display = 'none';

    document.getElementById('transactionForm').onsubmit = async (e) => {
        e.preventDefault();
        const type = document.getElementById('type').value;
        let rawName = document.getElementById('description').value;
        
        // Luôn chuẩn hóa tên trước khi lưu
        const name = (type === 'Chi phí vận hành') ? rawName : formatName(rawName);
        
        const txDate = document.getElementById('date').value;
        const selectedBranch = document.getElementById('branch').value;

        // Chống lộn cơ sở
        const existingProfile = allProfiles[name];
        if (existingProfile && existingProfile.branch && type !== 'Chi phí vận hành') {
            if (existingProfile.branch !== selectedBranch) {
                alert(`❌ LỖI SAI CƠ SỞ!\nVõ sinh "${name}" đang thuộc ${existingProfile.branch}.\nHãy chuyển đúng cơ sở trước khi nhập!`);
                return;
            }
        }

        await addDoc(colRef, {
            branch: selectedBranch,
            type: type,
            description: name,
            amount: Number(amtAct.value),
            date: txDate
        });
        
        if (!existingProfile && type !== 'Chi phí vận hành') {
            await setDoc(doc(db, "tst_profiles", name), { 
                status: 'active', 
                branch: selectedBranch, 
                tuitionFee: amtAct.value, // Lấy luôn số tiền lần đầu làm học phí mặc định
                phone: '',
                createdAt: txDate 
            });
        }

        e.target.reset();
        document.getElementById('date').valueAsDate = new Date();
    };

    document.getElementById('showDebtBtn').onclick = function() {
        const isDebt = this.innerText.includes("NỢ");
        this.innerText = isDebt ? "HIỆN TẤT CẢ" : "LỌC VÕ SINH NỢ PHÍ";
        renderApp(isDebt);
    };

    window.deleteTx = (id) => confirm("Xóa giao dịch này?") && deleteDoc(doc(db, "tst_transactions", id));

    document.getElementById('filterMonth').value = new Date().toISOString().substring(0, 7);
    document.getElementById('date').valueAsDate = new Date();
</script>
</body>
</html>
