<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEAMY TKD 6.2 - ULTIMATE IMPORT</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { 
            --red: #f43f5e; --blue: #3b82f6; --gold: #f59e0b; 
            --bg: #020617; --card: #1e293b; --sidebar: #0f172a;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
            --success: #10b981;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); margin: 0; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 320px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; z-index: 200; overflow-y: auto; }
        .main-display { flex: 1; padding: 20px; overflow-y: auto; }
        header { background: rgba(30, 41, 59, 0.5); padding: 12px 20px; border-radius: 12px; border-bottom: 2px solid var(--red); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .courts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 15px; }
        .court-card { background: var(--card); border-radius: 15px; padding: 15px; border: 1px solid var(--border); }
        .match-item { background: #0f172a; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid var(--border); position: relative; }
        .score-display { background: #000; padding: 4px 12px; border-radius: 6px; color: var(--gold); font-family: monospace; font-size: 1.2em; font-weight: bold; }
        .btn-sm { padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; width: 100%; margin-top: 5px; }
        input, select { padding: 10px; background: #020617; color: white; border: 1px solid var(--border); border-radius: 6px; width: 100%; margin-bottom: 10px; }
        .tab-content { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-top: 10px; }
        .hidden { display: none !important; }
        .import-box { border: 1px dashed var(--border); padding: 10px; margin-bottom: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="color:var(--gold); text-align:center;">QUẢN LÝ GIẢI</h2>
        <div id="auth-section">
            <input type="text" id="admin-user" placeholder="Tài khoản">
            <input type="password" id="admin-pass" placeholder="Mật khẩu">
            <button class="btn-sm" style="background:var(--red);" onclick="checkAdmin()">ĐĂNG NHẬP</button>
        </div>

        <div id="admin-menu" class="hidden">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                <button class="btn-sm" style="background:var(--blue)" onclick="openTab('tab-import')">NHẬP DATA</button>
                <button class="btn-sm" style="background:var(--blue)" onclick="openTab('tab-match')">TRẬN ĐẤU</button>
            </div>

            <div id="tab-import" class="tab-content">
                <div class="import-box">
                    <small style="color:var(--gold)">1. FILE VẬN ĐỘNG VIÊN</small>
                    <input type="file" id="file-vdv" accept=".xlsx, .xls, .csv">
                    <button class="btn-sm" style="background:var(--success)" onclick="importData('vdv')">TẢI VĐV</button>
                </div>
                <div class="import-box">
                    <small style="color:var(--gold)">2. FILE TRỌNG TÀI</small>
                    <input type="file" id="file-ref" accept=".xlsx, .xls, .csv">
                    <button class="btn-sm" style="background:var(--success)" onclick="importData('ref')">TẢI TRỌNG TÀI</button>
                </div>
                <button class="btn-sm" style="background:var(--red)" onclick="clearAllData()">XÓA HẾT DỮ LIỆU CŨ</button>
            </div>

            <div id="tab-match" class="tab-content hidden">
                <select id="m-court"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select>
                <input type="number" id="m-code" placeholder="Số trận">
                <input type="text" id="m-title" placeholder="Hạng cân">
                <p><small>GIÁP ĐỎ:</small></p>
                <select id="m-teamA" onchange="filterAthletes('A')"></select>
                <select id="m-athleteA"></select>
                <p><small>GIÁP XANH:</small></p>
                <select id="m-teamB" onchange="filterAthletes('B')"></select>
                <select id="m-athleteB"></select>
                <button class="btn-sm" style="background:var(--red)" onclick="addMatch()">TẠO TRẬN ĐẤU</button>
            </div>
            
            <button class="btn-sm" style="background:#334155; margin-top:20px" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </aside>

    <main class="main-display">
        <header>
            <h1 id="tournament-name">HỆ THỐNG THI ĐẤU</h1>
            <div id="clock">00:00:00</div>
        </header>
        <div class="courts-grid" id="courts-display"></div>
    </main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", 
        authDomain: "tkdreferee-4fbcc.firebaseapp.com",
        databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tkdreferee-4fbcc",
        appId: "1:17831183248:web:b3400d10be9ff017236915"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let localData = { teams: [], athletes: {}, referees: {}, matches: {} };
    const isAdmin = localStorage.getItem('tkd_admin_login');

    if(isAdmin) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('admin-menu').classList.remove('hidden');
    }

    db.ref('tkd_online_data').on('value', snap => {
        localData = snap.val() || { teams: [], athletes: {}, referees: {}, matches: {} };
        renderDisplay();
        if(isAdmin) updateAdminUI();
    });

    function importData(type) {
        const fileInput = document.getElementById(type === 'vdv' ? 'file-vdv' : 'file-ref');
        const file = fileInput.files[0];
        if(!file) return alert("Vui lòng chọn file!");

        const reader = new FileReader();
        reader.onload = function(e) {
            const workbook = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
            
            if(type === 'vdv') {
                let athletes = {}, teams = new Set(localData.teams || []);
                rows.forEach(r => {
                    const ten = r['Họ và Tên VĐV'] || r['Họ tên'] || r['Tên VĐV'];
                    const dv = r['Tên Đơn Vị'] || r['Đơn vị'];
                    if(ten && dv) {
                        const id = "VDV_" + Math.random().toString(36).substr(2, 9);
                        athletes[id] = { name: ten.trim(), team: dv.trim(), cat: r['Nội Dung Thi Đấu'] || '' };
                        teams.add(dv.trim());
                    }
                });
                db.ref('tkd_online_data/athletes').update(athletes);
                db.ref('tkd_online_data/teams').set(Array.from(teams));
            } else {
                let refs = {};
                rows.forEach(r => {
                    const ten = r['Tên Trọng Tài'] || r['Họ tên'] || r['Trọng tài'];
                    const dv = r['Đơn vị'] || r['Tên Đơn Vị'];
                    if(ten && dv) {
                        const id = "REF_" + Math.random().toString(36).substr(2, 9);
                        refs[id] = { name: ten.trim(), team: dv.trim() };
                    }
                });
                db.ref('tkd_online_data/referees').update(refs);
            }
            alert("Đã nhập dữ liệu thành công!");
            fileInput.value = "";
        };
        reader.readAsArrayBuffer(file);
    }

    function filterAthletes(side) {
        const team = document.getElementById('m-team' + side).value;
        const box = document.getElementById('m-athlete' + side);
        const filtered = Object.values(localData.athletes || {}).filter(a => a.team === team);
        box.innerHTML = `<option value="">-- Chọn VĐV --</option>` + filtered.map(a => `<option value="${a.name}">${a.name} (${a.cat})</option>`).join('');
    }

    function updateAdminUI() {
        const teamOpts = `<option value="">-- Chọn Đơn vị --</option>` + (localData.teams || []).sort().map(t => `<option value="${t}">${t}</option>`).join('');
        ['m-teamA', 'm-teamB'].forEach(id => {
            const el = document.getElementById(id);
            if(!el.value) el.innerHTML = teamOpts;
        });
    }

    function renderDisplay() {
        const grid = document.getElementById('courts-display'); grid.innerHTML = '';
        ["1", "2", "3"].forEach(cNum => {
            const matches = Object.entries(localData.matches || {}).filter(([k,m]) => m.court == cNum);
            let h = `<div class="court-card"><h3>SÂN ${cNum}</h3>`;
            matches.forEach(([k, m]) => {
                h += `<div class="match-item ${m.status === 'LIVE' ? 'match-live' : ''}">
                    <div style="display:flex; justify-content:space-between"><b>T.${m.code}</b> <small>${m.title}</small></div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin:10px 0">
                        <div style="color:var(--red)">${m.athleteA}<br><small>${m.teamA}</small></div>
                        <div class="score-display">${m.score1} - ${m.score2}</div>
                        <div style="color:var(--blue); text-align:right">${m.athleteB}<br><small>${m.teamB}</small></div>
                    </div>
                    ${isAdmin ? `<button class="btn-sm" style="background:var(--success)" onclick="setStatus('${k}','LIVE')">START</button>` : ''}
                </div>`;
            });
            grid.innerHTML += h + '</div>';
        });
    }

    function addMatch() {
        const m = {
            court: document.getElementById('m-court').value, code: document.getElementById('m-code').value,
            title: document.getElementById('m-title').value, teamA: document.getElementById('m-teamA').value,
            teamB: document.getElementById('m-teamB').value, athleteA: document.getElementById('m-athleteA').value,
            athleteB: document.getElementById('m-athleteB').value, status: 'WAITING', score1: 0, score2: 0
        };
        db.ref('tkd_online_data/matches').push(m);
    }

    function checkAdmin() {
        const u = document.getElementById('admin-user').value, p = document.getElementById('admin-pass').value;
        db.ref(`tkd_online_data/accounts/${u}`).once('value', snap => {
            if(snap.val() && String(snap.val().password) === p) { localStorage.setItem('tkd_admin_login', 'true'); location.reload(); }
            else alert("Sai mật khẩu!");
        });
    }
    function clearAllData() { if(confirm("Xóa sạch VĐV và Trọng tài?")) { db.ref('tkd_online_data/athletes').remove(); db.ref('tkd_online_data/referees').remove(); db.ref('tkd_online_data/teams').remove(); } }
    function openTab(id) { document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    function logout() { localStorage.removeItem('tkd_admin_login'); location.reload(); }
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('vi-VN'); }, 1000);
</script>
</body>
</html>
