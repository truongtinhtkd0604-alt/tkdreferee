<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEAMY TKD 9.5 - FINAL STABLE</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --red: #f43f5e; --blue: #3b82f6; --gold: #f59e0b; --bg: #020617; --card: #1e293b; --text: #f8fafc; --border: #334155; --success: #10b981; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: var(--bg); margin: 0; color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 350px; background: #0f172a; border-right: 1px solid var(--border); padding: 15px; overflow-y: auto; }
        .main { flex: 1; padding: 20px; overflow-y: auto; background: radial-gradient(circle at top right, #111827, #020617); }
        
        .panel { display: none; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-top: 10px; }
        .panel.active { display: block; }
        
        .tab-btn { padding: 8px 4px; font-size: 10px; cursor: pointer; background: var(--card); color: white; border: 1px solid var(--border); border-radius: 4px; font-weight: bold; flex: 1; }
        .tab-btn.active { background: var(--blue); border-color: var(--blue); }
        
        input, select { width: 100%; padding: 10px; margin-bottom: 8px; background: #000; color: white; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        .btn { padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; width: 100%; color: white; transition: 0.2s; margin-bottom: 5px; }
        
        .court-card { background: var(--card); border-radius: 15px; padding: 15px; border-top: 5px solid var(--gold); margin-bottom: 20px; }
        .match-item { background: #0a0f1e; padding: 12px; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); }
        
        .log-area { font-size: 11px; margin-top: 5px; padding: 8px; border-radius: 4px; background: rgba(0,0,0,0.5); min-height: 20px; color: #94a3b8; border-left: 3px solid var(--blue); }
        #preview-list { color: #cbd5e1; line-height: 1.6; }
    </style>
</head>
<body>

<aside class="sidebar">
    <h2 style="color:var(--gold); text-align:center; margin-bottom:20px;">HỆ THỐNG TEAMY</h2>
    
    <div id="auth-box">
        <input type="password" id="pass" placeholder="Nhập mã PIN">
        <button class="btn" style="background:var(--red)" onclick="login()">ĐĂNG NHẬP</button>
    </div>

    <div id="admin-ui" style="display:none">
        <div style="display:flex; gap:4px; margin-bottom:15px">
            <button class="tab-btn active" onclick="showTab(0)">FILE</button>
            <button class="tab-btn" onclick="showTab(1)">D.SÁCH</button>
            <button class="tab-btn" onclick="showTab(2)">TRẬN ĐẤU</button>
            <button class="tab-btn" onclick="showTab(3)">THOÁT</button>
        </div>

        <div class="panel active">
            <div style="margin-bottom:20px">
                <label><small><b>TẢI VẬN ĐỘNG VIÊN (.xlsx, .csv)</b></small></label>
                <input type="file" id="file-vdv">
                <button class="btn" style="background:var(--success)" onclick="processUpload('vdv')">CẬP NHẬT VĐV</button>
                <div id="log-vdv" class="log-area">Chưa có dữ liệu...</div>
            </div>

            <div style="margin-bottom:20px">
                <label><small><b>TẢI TRỌNG TÀI (.xlsx, .csv)</b></small></label>
                <input type="file" id="file-ref">
                <button class="btn" style="background:var(--blue)" onclick="processUpload('ref')">CẬP NHẬT TRỌNG TÀI</button>
                <div id="log-ref" class="log-area">Chưa có dữ liệu...</div>
            </div>
            
            <button class="btn" style="background:#334155; margin-top:10px; font-size:11px" onclick="clearDb()">XÓA TOÀN BỘ DỮ LIỆU CŨ</button>
        </div>

        <div class="panel">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px">
                <span id="stat-vdv" style="font-size:10px; background:var(--success); padding:3px 8px; border-radius:4px">VĐV: 0</span>
                <span id="stat-ref" style="font-size:10px; background:var(--blue); padding:3px 8px; border-radius:4px">TT: 0</span>
            </div>
            <div id="preview-list" style="font-size:11px; max-height:450px; overflow-y:auto; background:#000; padding:10px; border-radius:8px"></div>
        </div>

        <div class="panel">
            <select id="m-court"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select>
            <input type="number" id="m-code" placeholder="Số thứ tự trận">
            <input type="text" id="m-title" placeholder="Nội dung/Hạng cân">
            <select id="m-teamA" onchange="syncPlayers(1)"></select>
            <select id="m-vA"></select>
            <select id="m-teamB" onchange="syncPlayers(2)"></select>
            <select id="m-vB"></select>
            <button class="btn" style="background:var(--red)" onclick="saveMatch()">LƯU TRẬN ĐẤU</button>
        </div>
    </div>
</aside>

<main class="main">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px">
        <h2 style="color:var(--gold); margin:0">BẢNG ĐIỀU HÀNH THI ĐẤU</h2>
        <div id="clock" style="font-family:monospace; font-size:1.2em">00:00:00</div>
    </div>
    <div id="grid-system" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap:15px; margin-top:15px"></div>
</main>

<script>
// --- CẤU HÌNH ---
const firebaseConfig = {
    apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", 
    authDomain: "tkdreferee-4fbcc.firebaseapp.com",
    databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tkdreferee-4fbcc",
    appId: "1:17831183248:web:b3400d10be9ff017236915"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let state = { athletes: {}, refs: {}, matches: {}, teams: [] };
const isAdmin = localStorage.getItem('tkd_admin') === 'true';

if(isAdmin) {
    document.getElementById('auth-box').style.display = 'none';
    document.getElementById('admin-ui').style.display = 'block';
}

// --- ĐỒNG BỘ DỮ LIỆU ---
db.ref('tkd_online_data').on('value', snap => {
    const v = snap.val() || {};
    state.athletes = v.athletes || {};
    state.refs = v.refs || {};
    state.matches = v.matches || {};
    
    // FIX TRIỆT ĐỂ LỖI ITERABLE: Ép kiểu mảng cho teams
    const rawTeams = v.teams || [];
    state.teams = Array.isArray(rawTeams) ? rawTeams : Object.values(rawTeams);

    renderBoard();
    if(isAdmin) updateAdmin();
});

// --- XỬ LÝ CHUỖI ---
function normalize(s) {
    if(!s) return "";
    return s.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "");
}

// --- TẢI FILE ---
function processUpload(type) {
    const input = document.getElementById(type === 'vdv' ? 'file-vdv' : 'file-ref');
    const log = document.getElementById(type === 'vdv' ? 'log-vdv' : 'log-ref');
    const file = input.files[0];
    if(!file) return alert("Vui lòng chọn file!");

    log.innerHTML = "Đang xử lý...";
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
            const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]) || [];
            
            if(type === 'vdv') {
                let up = {}, tSet = new Set(state.teams);
                data.forEach(r => {
                    let n, t, c;
                    for(let k in r) {
                        let nk = normalize(k);
                        // Khớp với tiêu đề file: "Họ và Tên VĐV", "Tên Đơn Vị"
                        if(nk.includes("hovaten") || nk.includes("tenvdv")) n = r[k];
                        if(nk.includes("donvi") || nk.includes("clb") || nk.includes("tendonvi")) t = r[k];
                        if(nk.includes("noidung") || nk.includes("hangcan") || nk.includes("luatuoi")) c = r[k];
                    }
                    if(n && t) {
                        const id = "V" + Math.random().toString(36).substr(2, 7);
                        up[id] = { name: String(n).trim(), team: String(t).trim(), cat: String(c || '').trim() };
                        tSet.add(String(t).trim());
                    }
                });
                db.ref('tkd_online_data/athletes').update(up);
                db.ref('tkd_online_data/teams').set(Array.from(tSet));
                log.innerHTML = `<b style="color:var(--success)">Thành công: +${Object.keys(up).length} VĐV</b>`;
            } else {
                let up = {};
                data.forEach(r => {
                    let n, t;
                    for(let k in r) {
                        let nk = normalize(k);
                        if(nk.includes("trongtai") || nk.includes("hoten")) n = r[k];
                        if(nk.includes("donvi") || nk.includes("clb")) t = r[k];
                    }
                    if(n && t) {
                        const id = "R" + Math.random().toString(36).substr(2, 7);
                        up[id] = { name: String(n).trim(), team: String(t).trim() };
                    }
                });
                db.ref('tkd_online_data/refs').update(up);
                log.innerHTML = `<b style="color:var(--success)">Thành công: +${Object.keys(up).length} Trọng tài</b>`;
            }
        } catch(err) { log.innerHTML = `<span style="color:var(--red)">Lỗi: ${err.message}</span>`; }
    };
    reader.readAsArrayBuffer(file);
}

// --- HIỂN THỊ ---
function renderBoard() {
    const grid = document.getElementById('grid-system'); grid.innerHTML = '';
    ["1", "2", "3"].forEach(sn => {
        const ms = Object.entries(state.matches || {}).filter(([k,m]) => m.court == sn);
        let h = `<div class="court-card"><h3 style="text-align:center;color:var(--gold);margin:0">SÂN ${sn}</h3>`;
        
        ms.sort((a,b) => a[1].code - b[1].code).forEach(([k,m]) => {
            const isLive = m.status === 'LIVE';
            h += `<div class="match-item" style="${isLive ? 'border-color:var(--success); border-width:2px' : ''}">
                <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:8px">
                    <b style="background:var(--gold); color:black; padding:2px 5px; border-radius:3px">TRẬN ${m.code}</b>
                    <span>${m.title}</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <div style="width:38%; color:var(--red); font-weight:bold; line-height:1.2; font-size:14px">${m.athleteA}<br><small style="color:white; font-weight:normal">${m.teamA}</small></div>
                    <div style="font-size:26px; font-weight:bold; color:var(--gold); font-family:monospace">${m.score1}-${m.score2}</div>
                    <div style="width:38%; color:var(--blue); text-align:right; font-weight:bold; line-height:1.2; font-size:14px">${m.athleteB}<br><small style="color:white; font-weight:normal">${m.teamB}</small></div>
                </div>
                ${isAdmin ? `
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:10px">
                    ${isLive ? `
                        <button onclick="upS('${k}',1,1)" style="background:var(--red); border:none; color:white; border-radius:4px; height:30px; font-weight:bold">+</button>
                        <button onclick="upS('${k}',2,1)" style="background:var(--blue); border:none; color:white; border-radius:4px; height:30px; font-weight:bold">+</button>
                        <button class="btn" style="grid-column:span 2; background:#444; font-size:10px" onclick="setS('${k}','DONE')">KẾT THÚC TRẬN</button>
                    ` : `<button class="btn" style="background:var(--success); grid-column:span 2; font-size:10px" onclick="setS('${k}','LIVE')">BẮT ĐẦU THI ĐẤU</button>`}
                    <button style="grid-column:span 2; background:transparent; border:none; color:#555; font-size:9px" onclick="delM('${k}')">XÓA TRẬN</button>
                </div>` : ''}
            </div>`;
        });
        grid.innerHTML += h + `</div>`;
    });
}

// --- ADMIN CONTROL ---
function updateAdmin() {
    const tH = `<option value="">-- Đơn vị --</option>` + state.teams.sort().map(t => `<option value="${t}">${t}</option>`).join('');
    if(!document.getElementById('m-teamA').value) document.getElementById('m-teamA').innerHTML = tH;
    if(!document.getElementById('m-teamB').value) document.getElementById('m-teamB').innerHTML = tH;
    
    document.getElementById('stat-vdv').innerText = `VĐV: ${Object.keys(state.athletes).length}`;
    document.getElementById('stat-ref').innerText = `TT: ${Object.keys(state.refs).length}`;
    
    let pList = "<b>DANH SÁCH ĐƠN VỊ ĐÃ NẠP:</b><br>";
    state.teams.sort().forEach(t => pList += `<div style="padding:2px 0; border-bottom:1px solid #333">- ${t}</div>`);
    document.getElementById('preview-list').innerHTML = pList;
}

function syncPlayers(side) {
    const t = document.getElementById(side === 1 ? 'm-teamA' : 'm-teamB').value;
    const l = Object.values(state.athletes).filter(a => a.team === t);
    document.getElementById(side === 1 ? 'm-vA' : 'm-vB').innerHTML = l.map(a => `<option value="${a.name}">${a.name} (${a.cat})</option>`).join('');
}

function saveMatch() {
    const m = {
        court: document.getElementById('m-court').value, code: document.getElementById('m-code').value,
        title: document.getElementById('m-title').value, teamA: document.getElementById('m-teamA').value,
        teamB: document.getElementById('m-teamB').value, athleteA: document.getElementById('m-vA').value,
        athleteB: document.getElementById('m-vB').value, score1: 0, score2: 0, status: 'WAIT'
    };
    if(!m.code || !m.athleteA || !m.athleteB) return alert("Vui lòng điền đủ thông tin trận đấu!");
    db.ref('tkd_online_data/matches').push(m).then(() => {
        document.getElementById('m-code').value = parseInt(m.code) + 1;
        alert("Đã tạo trận đấu!");
    });
}

function upS(k, t, v) { const f = t === 1 ? 'score1' : 'score2'; db.ref(`tkd_online_data/matches/${k}/${f}`).set((state.matches[k][f] || 0) + v); }
function setS(k, s) { db.ref(`tkd_online_data/matches/${k}/status`).set(s); }
function delM(k) { if(confirm("Xóa trận này?")) db.ref(`tkd_online_data/matches/${k}`).remove(); }
function clearDb() { if(confirm("CẢNH BÁO: Xóa sạch toàn bộ dữ liệu giải đấu?")) db.ref('tkd_online_data').set({tName: "TST"}); }
function login() { if(document.getElementById('pass').value === '123') { localStorage.setItem('tkd_admin', 'true'); location.reload(); } }
function showTab(i) { 
    if(i === 3) { localStorage.removeItem('tkd_admin'); location.reload(); }
    document.querySelectorAll('.tab-btn, .panel').forEach((el, idx) => el.classList.toggle('active', i === idx % 4)); 
}
setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('vi-VN'); }, 1000);
</script>
</body>
</html>
