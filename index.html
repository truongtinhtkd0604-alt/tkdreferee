<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEAMY TKD 13 - TOTAL CONTROL</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --red: #e11d48; --blue: #2563eb; --gold: #f59e0b; --bg: #020617; --card: #1e293b; --text: #f8fafc; --border: #334155; --success: #10b981; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); margin: 0; color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 380px; background: #0f172a; border-right: 1px solid var(--border); padding: 15px; overflow-y: auto; }
        .main { flex: 1; padding: 20px; overflow-y: auto; background: radial-gradient(circle at top right, #1e293b, #020617); }
        .panel { display: none; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
        .panel.active { display: block; }
        .tab-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .tab-btn { padding: 8px 0; font-size: 9px; cursor: pointer; background: var(--card); color: white; border: 1px solid var(--border); border-radius: 4px; font-weight: bold; }
        .tab-btn.active { background: var(--blue); border-color: var(--blue); }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 8px; background: #000; color: white; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
        .btn { padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; width: 100%; color: white; margin-bottom: 5px; }
        .court-card { background: rgba(30, 41, 59, 0.5); border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid var(--border); }
        .match-live { border: 2px solid var(--success); background: #064e3b; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); padding: 15px; border-radius: 10px; margin-bottom: 10px; animation: pulse 2s infinite; }
        .match-wait { background: #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 5px; border-left: 4px solid var(--gold); opacity: 0.9; }
        .match-done { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 5px; border-left: 4px solid #64748b; opacity: 0.6; font-size: 0.9em; }
        @keyframes pulse { 0% { border-color: var(--success); } 50% { border-color: #fff; } 100% { border-color: var(--success); } }
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; text-transform: uppercase; }
        .data-list { font-size: 12px; max-height: 400px; overflow-y: auto; border: 1px solid var(--border); padding: 5px; }
        .data-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #334155; }
    </style>
</head>
<body>

<aside class="sidebar">
    <h3 style="color:var(--gold); text-align:center; margin-top:0">ĐIỀU HÀNH THI ĐẤU V13</h3>
    
    <div id="auth-box">
        <input type="password" id="pass" placeholder="Mã PIN">
        <button class="btn" style="background:var(--red)" onclick="login()">ĐĂNG NHẬP</button>
    </div>

    <div id="admin-ui" style="display:none">
        <div class="tab-grid">
            <button class="tab-btn active" onclick="showTab(0)">NHẬP</button>
            <button class="tab-btn" onclick="showTab(1)">TRẬN</button>
            <button class="tab-btn" onclick="showTab(2)">TRỌNG TÀI</button>
            <button class="tab-btn" onclick="showTab(3)">DỮ LIỆU</button>
            <button class="tab-btn" onclick="showTab(4)">HỆ THỐNG</button>
        </div>

        <div class="panel active">
            <select id="man-v-team" class="team-selects"><option value="">-- Chọn Đơn vị --</option></select>
            <input type="text" id="man-v-name" placeholder="Tên VĐV">
            <input type="text" id="man-v-cat" placeholder="Nội dung/Hạng cân">
            <button class="btn" style="background:var(--success)" onclick="addManVdv()">LƯU VĐV</button>
            <hr border="0" style="border-top:1px solid #334155; margin:15px 0">
            <input type="text" id="man-r-name" placeholder="Tên Trọng tài">
            <select id="man-r-team" class="team-selects"></select>
            <button class="btn" style="background:var(--blue)" onclick="addManRef()">LƯU TRỌNG TÀI</button>
        </div>

        <div class="panel">
            <div style="display:flex; gap:5px">
                <select id="m-court" style="flex:1"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select>
                <input type="number" id="m-code" placeholder="Số trận" style="flex:1">
            </div>
            <label style="font-size:11px; color:var(--gold)">1. CHỌN NỘI DUNG:</label>
            <select id="m-title-select" onchange="syncPlayers(1); syncPlayers(2);"><option value="">-- Chọn nội dung --</option></select>
            
            <label style="font-size:11px; color:var(--red)">2. GIÁP ĐỎ:</label>
            <select id="m-teamA" class="team-selects" onchange="syncPlayers(1)"></select>
            <select id="m-vA"><option value="">-- VĐV Đỏ --</option></select>
            
            <label style="font-size:11px; color:var(--blue)">3. GIÁP XANH:</label>
            <select id="m-teamB" class="team-selects" onchange="syncPlayers(2)"></select>
            <select id="m-vB"><option value="">-- VĐV Xanh --</option></select>
            
            <button class="btn" style="background:var(--red); margin-top:10px" onclick="saveMatch()">TẠO TRẬN ĐẤU</button>
        </div>

        <div class="panel">
            <select id="assign-m" onchange="prepAssign()"></select>
            <button id="btn-auto-ref" class="btn" style="background:var(--blue); display:none" onclick="autoAssignRef()">⚡ TỰ ĐỘNG BỐC THĂM (TRUNG LẬP)</button>
            <div id="ref-slots"></div>
            <button id="btn-save-ref" class="btn" style="background:var(--success); display:none" onclick="saveAssign()">XÁC NHẬN PHÂN CÔNG</button>
            
            <div style="margin-top:20px">
                <div style="font-size:11px; color:var(--gold); font-weight:bold; margin-bottom:5px">TT ĐANG LÀM NHIỆM VỤ:</div>
                <div id="active-refs-list" style="font-size:12px; color:#94a3b8"></div>
            </div>
        </div>

        <div class="panel">
            <div class="section-title">DANH SÁCH VĐV</div>
            <div id="list-vdv" class="data-list"></div>
            <div class="section-title" style="margin-top:15px">DANH SÁCH TRỌNG TÀI</div>
            <div id="list-ref" class="data-list"></div>
        </div>

        <div class="panel">
             <button class="btn" style="background:var(--red)" onclick="factoryReset()">XÓA TRẮNG DỮ LIỆU GIẢI</button>
             <button class="btn" style="background:#334155; margin-top:20px" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </div>
</aside>

<main class="main">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px">
        <h2 style="color:var(--gold); margin:0">GIÁM SÁT THI ĐẤU</h2>
        <div id="clock" style="font-family:monospace; font-size:1.2em">00:00:00</div>
    </div>
    <div id="grid-system" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap:20px; margin-top:15px"></div>
</main>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", 
    authDomain: "tkdreferee-4fbcc.firebaseapp.com",
    databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tkdreferee-4fbcc",
    appId: "1:17831183248:web:b3400d10be9ff017236915"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let st = { athletes: {}, refs: {}, matches: {}, teams: [] };
const isLogged = localStorage.getItem('tkd_admin') === 'true';

if(isLogged) {
    document.getElementById('auth-box').style.display = 'none';
    document.getElementById('admin-ui').style.display = 'block';
}

db.ref('tkd_online_data').on('value', snap => {
    const v = snap.val() || {};
    st.athletes = v.athletes || {};
    st.refs = v.refs || {};
    st.matches = v.matches || {};
    st.teams = Array.isArray(v.teams) ? v.teams : Object.values(v.teams || {});

    renderBoard();
    if(isLogged) { updateUI(); renderDataList(); }
});

function updateUI() {
    const opts = `<option value="">-- Chọn Đơn vị --</option>` + st.teams.sort().map(t=>`<option value="${t}">${t}</option>`).join('');
    document.querySelectorAll('.team-selects').forEach(el => { if(!el.value) el.innerHTML = opts; });
    
    const cats = new Set();
    Object.values(st.athletes).forEach(a => { if(a.cat) cats.add(a.cat); });
    const catHtml = `<option value="">-- Nội dung --</option>` + Array.from(cats).sort().map(c => `<option value="${c}">${c}</option>`).join('');
    const curCat = document.getElementById('m-title-select').value;
    document.getElementById('m-title-select').innerHTML = catHtml;
    if(curCat) document.getElementById('m-title-select').value = curCat;

    const unassigned = Object.entries(st.matches).filter(([k,m]) => !m.assigned && m.status !== 'DONE');
    document.getElementById('assign-m').innerHTML = `<option value="">-- Chọn trận phân công --</option>` + 
        unassigned.map(([k,m]) => `<option value="${k}">Trận ${m.code} (${m.title})</option>`).join('');

    // Danh sách TT đang làm việc
    let activeRefs = [];
    Object.values(st.matches).forEach(m => {
        if(m.status === 'LIVE' && m.assigned) activeRefs.push(`Sân ${m.court}: ${m.assigned}`);
    });
    document.getElementById('active-refs-list').innerHTML = activeRefs.length > 0 ? activeRefs.join('<br>') : 'Không có trận đang đấu';
}

// TỰ ĐỘNG CHỌN VĐV KHI CÓ 1 KẾT QUẢ
function syncPlayers(side) {
    const team = document.getElementById(side===1?'m-teamA':'m-teamB').value;
    const cat = document.getElementById('m-title-select').value;
    let list = Object.values(st.athletes).filter(a => a.team === team && (!cat || a.cat === cat));
    
    const selectEl = document.getElementById(side===1?'m-vA':'m-vB');
    selectEl.innerHTML = `<option value="">-- Chọn VĐV --</option>` + list.map(a=>`<option value="${a.name}">${a.name}</option>`).join('');
    
    // Nếu chỉ có 1 VĐV thỏa mãn, tự động chọn luôn
    if(list.length === 1) {
        selectEl.value = list[0].name;
    }
}

// RENDER DANH SÁCH ĐỂ SỬA/XÓA
function renderDataList() {
    const vList = document.getElementById('list-vdv');
    vList.innerHTML = Object.entries(st.athletes).map(([k,v]) => `
        <div class="data-item">
            <span><b>${v.name}</b> (${v.team}) - ${v.cat}</span>
            <div>
                <button onclick="editData('athletes','${k}')" style="color:var(--gold);background:none;border:none;cursor:pointer">Sửa</button>
                <button onclick="deleteData('athletes','${k}')" style="color:var(--red);background:none;border:none;cursor:pointer">Xóa</button>
            </div>
        </div>
    `).join('');

    const rList = document.getElementById('list-ref');
    rList.innerHTML = Object.entries(st.refs).map(([k,v]) => `
        <div class="data-item">
            <span><b>${v.name}</b> (${v.team})</span>
            <div>
                <button onclick="editData('refs','${k}')" style="color:var(--gold);background:none;border:none;cursor:pointer">Sửa</button>
                <button onclick="deleteData('refs','${k}')" style="color:var(--red);background:none;border:none;cursor:pointer">Xóa</button>
            </div>
        </div>
    `).join('');
}

function editData(type, id) {
    const item = st[type][id];
    const newName = prompt("Nhập tên mới:", item.name);
    if(newName) {
        db.ref(`tkd_online_data/${type}/${id}/name`).set(newName);
        if(type === 'athletes') {
            const newCat = prompt("Nhập nội dung mới:", item.cat);
            if(newCat) db.ref(`tkd_online_data/${type}/${id}/cat`).set(newCat);
        }
    }
}
function deleteData(type, id) { if(confirm("Xóa vĩnh viễn dữ liệu này?")) db.ref(`tkd_online_data/${type}/${id}`).remove(); }

// GIAO DIỆN HIỂN THỊ TRẬN ĐẤU (3 PHÂN ĐOẠN)
function renderBoard() {
    const grid = document.getElementById('grid-system'); grid.innerHTML = '';
    ["1","2","3"].forEach(sn => {
        const ms = Object.entries(st.matches).filter(([k,m]) => m.court == sn);
        let html = `<div class="court-card"><h2 style="text-align:center;color:var(--gold);margin-top:0">SÂN ${sn}</h2>`;
        
        // 1. TRẬN ĐANG ĐẤU (LIVE)
        const liveMatch = ms.find(([k,m]) => m.status === 'LIVE');
        if(liveMatch) {
            const [k,m] = liveMatch;
            html += `<div class="match-live">
                <div style="text-align:center"><span class="tag" style="background:var(--red)">ĐANG THI ĐẤU</span></div>
                <div style="font-size:12px; text-align:center; margin:5px 0; color:var(--gold)">Trận ${m.code}: ${m.title}</div>
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <div style="width:40%; text-align:center">
                        <div style="font-weight:bold; font-size:16px">${m.teamA}</div>
                        <div style="font-size:12px">${m.athleteA}</div>
                    </div>
                    <div style="font-size:32px; font-weight:900; color:#fff">${m.score1} - ${m.score2}</div>
                    <div style="width:40%; text-align:center">
                        <div style="font-weight:bold; font-size:16px">${m.teamB}</div>
                        <div style="font-size:12px">${m.athleteB}</div>
                    </div>
                </div>
                ${isLogged?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px">
                    <button class="btn" style="background:var(--red)" onclick="upS('${k}',1,1)">+ ĐỎ</button>
                    <button class="btn" style="background:var(--blue)" onclick="upS('${k}',2,1)">+ XANH</button>
                    <button class="btn" style="grid-column:span 2; background:#444" onclick="setS('${k}','DONE')">KẾT THÚC TRẬN</button>
                </div>`:''}
            </div>`;
        } else {
            html += `<div style="text-align:center; padding:20px; color:#475569; border:1px dashed #334155; border-radius:10px; margin-bottom:10px">SÂN TRỐNG</div>`;
        }

        // 2. TRẬN CHỜ (WAITING) - Lấy 2 trận
        const waiting = ms.filter(([k,m]) => m.status === 'WAIT').sort((a,b)=>a[1].code - b[1].code).slice(0,2);
        if(waiting.length > 0) {
            html += `<div style="font-size:11px; color:var(--gold); margin:10px 0 5px 0">TIẾP THEO:</div>`;
            waiting.forEach(([k,m]) => {
                html += `<div class="match-wait">
                    <div style="display:flex; justify-content:space-between; font-size:11px">
                        <b>Trận ${m.code}</b> <span>${m.title}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-weight:bold; margin-top:3px">
                        <span style="color:var(--red)">${m.athleteA}</span> vs <span style="color:var(--blue)">${m.athleteB}</span>
                    </div>
                    ${isLogged?`<button class="btn" style="background:var(--success); margin-top:5px; font-size:10px; padding:4px" onclick="setS('${k}','LIVE')">BẮT ĐẦU TRẬN</button>`:''}
                </div>`;
            });
        }

        // 3. VỪA KẾT THÚC (DONE) - Lấy 2 trận
        const done = ms.filter(([k,m]) => m.status === 'DONE').sort((a,b)=>b[1].code - a[1].code).slice(0,2);
        if(done.length > 0) {
            html += `<div style="font-size:11px; color:#64748b; margin:10px 0 5px 0">VỪA XONG:</div>`;
            done.forEach(([k,m]) => {
                html += `<div class="match-done">
                    <span>Trận ${m.code}: ${m.athleteA} (${m.score1}) - (${m.score2}) ${m.athleteB}</span>
                </div>`;
            });
        }

        grid.innerHTML += html + `</div>`;
    });
}

// HÀM CƠ BẢN
function addManVdv() {
    const team = document.getElementById('man-v-team').value, name = document.getElementById('man-v-name').value.trim(), cat = document.getElementById('man-v-cat').value.trim();
    if(team && name) db.ref('tkd_online_data/athletes').push({ team, name, cat }).then(()=> { document.getElementById('man-v-name').value=''; alert("Xong!"); });
}
function addManRef() {
    const name = document.getElementById('man-r-name').value.trim(), team = document.getElementById('man-r-team').value;
    if(name && team) db.ref('tkd_online_data/refs').push({ name, team }).then(()=> { document.getElementById('man-r-name').value=''; alert("Xong!"); });
}
function saveMatch() {
    const m = { court: document.getElementById('m-court').value, code: document.getElementById('m-code').value, title: document.getElementById('m-title-select').value, teamA: document.getElementById('m-teamA').value, teamB: document.getElementById('m-teamB').value, athleteA: document.getElementById('m-vA').value, athleteB: document.getElementById('m-vB').value, score1:0, score2:0, status:'WAIT' };
    if(!m.code || !m.athleteA || !m.athleteB) return alert("Thiếu thông tin!");
    db.ref('tkd_online_data/matches').push(m).then(()=> { document.getElementById('m-code').value++; alert("Đã tạo!"); });
}
function upS(k,t,v) { const f = t===1?'score1':'score2'; db.ref(`tkd_online_data/matches/${k}/${f}`).set((st.matches[k][f]||0)+v); }
function setS(k,s) { db.ref(`tkd_online_data/matches/${k}/status`).set(s); }
function login() { if(document.getElementById('pass').value==='123') { localStorage.setItem('tkd_admin','true'); location.reload(); } }
function logout() { localStorage.removeItem('tkd_admin'); location.reload(); }
function showTab(i) { document.querySelectorAll('.tab-btn, .panel').forEach((el, idx) => el.classList.toggle('active', i === idx % 5)); }
function prepAssign() {
    const mid = document.getElementById('assign-m').value;
    if(!mid) return;
    const m = st.matches[mid];
    const neutralRefs = Object.entries(st.refs).filter(([k,r]) => r.team !== m.teamA && r.team !== m.teamB);
    const opts = `<option value="">-- Chọn TT --</option>` + neutralRefs.map(([k,r]) => `<option value="${r.name}">${r.name} (${r.team})</option>`).join('');
    let html = ''; for(let i=1; i<=4; i++) html += `<select id="s-ref-${i}">${opts}</select>`;
    document.getElementById('ref-slots').innerHTML = html;
    document.getElementById('btn-save-ref').style.display = 'block';
    document.getElementById('btn-auto-ref').style.display = 'block';
}
function autoAssignRef() {
    const mid = document.getElementById('assign-m').value;
    const m = st.matches[mid];
    let neutralRefs = Object.entries(st.refs).filter(([k,r]) => r.team !== m.teamA && r.team !== m.teamB).sort(() => 0.5 - Math.random());
    if(neutralRefs.length < 4) return alert("Không đủ trọng tài trung lập!");
    for(let i=1; i<=4; i++) document.getElementById(`s-ref-${i}`).value = neutralRefs[i-1][1].name;
}
function saveAssign() {
    const mid = document.getElementById('assign-m').value;
    const names = [1,2,3,4].map(i => document.getElementById(`s-ref-${i}`).value).filter(n => n);
    db.ref(`tkd_online_data/matches/${mid}/assigned`).set(names.join(", "));
    alert("Xong!"); document.getElementById('assign-m').value = ''; prepAssign();
}
setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('vi-VN'); }, 1000);
</script>
</body>
</html>
