<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEAMY TKD 7.0 - PRO SYSTEM</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { 
            --red: #f43f5e; --blue: #3b82f6; --gold: #f59e0b; 
            --bg: #020617; --card: #1e293b; --sidebar: #0f172a;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
            --success: #10b981;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); margin: 0; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar & Layout */
        .sidebar { width: 340px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; z-index: 100; }
        .main-content { flex: 1; padding: 20px; overflow-y: auto; background: radial-gradient(circle at top right, #1e293b, #020617); }
        
        /* Tabs */
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 20px; }
        .tab-btn { padding: 8px 2px; font-size: 10px; font-weight: bold; background: var(--card); color: white; border: 1px solid var(--border); cursor: pointer; border-radius: 4px; }
        .tab-btn.active { background: var(--blue); border-color: var(--blue); }
        .tab-panel { display: none; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
        .tab-panel.active { display: block; }

        /* Court Display */
        .courts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; }
        .court-card { background: var(--card); border-radius: 15px; padding: 15px; border-top: 4px solid var(--gold); }
        .match-item { background: #0f172a; padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid var(--border); }
        .match-live { border: 1px solid var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        
        /* UI Components */
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; background: #000; color: white; border: 1px solid var(--border); border-radius: 6px; }
        .btn { padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; color: white; }
        .score-box { background: #000; padding: 10px; border-radius: 8px; font-size: 1.5em; font-weight: bold; color: var(--gold); min-width: 70px; text-align: center; }
        
        /* Utility */
        .hidden { display: none; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .vdv-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
        .vdv-info { flex: 1; }
        .name-big { font-weight: 900; font-size: 1.1em; text-transform: uppercase; }
        .sub-info { font-size: 0.75em; color: var(--text-muted); }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="color:var(--gold); text-align:center; margin-top:0">TEAMY TKD 7.0</h2>
        
        <div id="auth-box">
            <input type="password" id="admin-pass" placeholder="Mật khẩu Admin">
            <button class="btn" style="background:var(--red)" onclick="login()">ĐĂNG NHẬP</button>
        </div>

        <div id="admin-ui" class="hidden">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab(0)">CÀI ĐẶT</button>
                <button class="tab-btn" onclick="showTab(1)">VĐV</button>
                <button class="tab-btn" onclick="showTab(2)">TRẬN</button>
                <button class="tab-btn" onclick="showTab(3)">TRỌNG TÀI</button>
            </div>

            <div class="tab-panel active">
                <label><small>Tên giải đấu:</small></label>
                <input type="text" id="set-tour-name" placeholder="Ví dụ: GIẢI VÔ ĐỊCH TRẺ">
                <button class="btn" style="background:var(--blue)" onclick="saveTourName()">CẬP NHẬT TÊN GIẢI</button>
                <hr style="border:0; border-top:1px solid var(--border); margin:15px 0">
                <button class="btn" style="background:#475569" onclick="clearData()">XÓA DỮ LIỆU CŨ</button>
            </div>

            <div class="tab-panel">
                <div style="background:rgba(16, 185, 129, 0.1); padding:10px; border-radius:6px; border:1px solid var(--success)">
                    <small style="color:var(--success)"><b>NHẬP EXCEL VĐV</b></small>
                    <input type="file" id="file-vdv" accept=".xlsx, .xls, .csv" style="margin-top:10px">
                    <button class="btn" style="background:var(--success)" onclick="handleImport('vdv')">TẢI DANH SÁCH</button>
                </div>
                <div id="vdv-stats" style="margin-top:10px; font-size:12px"></div>
            </div>

            <div class="tab-panel">
                <div style="display:flex; gap:5px">
                    <select id="m-court" style="flex:1"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select>
                    <input type="number" id="m-code" placeholder="Trận" style="flex:1">
                </div>
                <input type="text" id="m-title" placeholder="Hạng cân / Lứa tuổi">
                <label><small>GIÁP ĐỎ:</small></label>
                <select id="m-teamA" onchange="loadAthletes('A')"></select>
                <select id="m-athleteA"></select>
                <label><small>GIÁP XANH:</small></label>
                <select id="m-teamB" onchange="loadAthletes('B')"></select>
                <select id="m-athleteB"></select>
                <button class="btn" style="background:var(--red)" onclick="createMatch()">TẠO TRẬN ĐẤU</button>
            </div>

            <div class="tab-panel">
                <div style="background:rgba(59, 130, 246, 0.1); padding:10px; border-radius:6px; border:1px solid var(--blue); margin-bottom:10px">
                    <small style="color:var(--blue)"><b>NHẬP EXCEL TRỌNG TÀI</b></small>
                    <input type="file" id="file-ref" accept=".xlsx, .xls, .csv" style="margin-top:10px">
                    <button class="btn" style="background:var(--blue)" onclick="handleImport('ref')">TẢI DANH SÁCH</button>
                </div>
                <div id="ref-assign-zone">
                    <select id="assign-m-id" onchange="prepAssign()"></select>
                    <div id="assign-slots"></div>
                    <button id="btn-do-assign" class="btn hidden" style="background:var(--success); margin-top:10px" onclick="saveAssignment()">XÁC NHẬN GÁN TT</button>
                </div>
            </div>

            <button class="btn" style="background:#334155; margin-top:30px" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="flex-between" style="margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px">
            <h1 id="draw-tour-name" style="margin:0; font-size:1.5em; color:var(--gold)">HỆ THỐNG ĐIỀU HÀNH</h1>
            <div id="digital-clock" style="font-family:monospace; font-size:1.2em">00:00:00</div>
        </header>
        <div class="courts-grid" id="main-grid"></div>
    </main>

<script>
    // --- CẤU HÌNH ---
    const firebaseConfig = {
        apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", 
        authDomain: "tkdreferee-4fbcc.firebaseapp.com",
        databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tkdreferee-4fbcc",
        appId: "1:17831183248:web:b3400d10be9ff017236915"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = { teams: [], athletes: {}, referees: {}, matches: {}, tournamentName: "" };
    const isMaster = localStorage.getItem('tkd_master') === 'true';

    if(isMaster) { document.getElementById('auth-box').remove(); document.getElementById('admin-ui').classList.remove('hidden'); }

    // --- LẮNG NGHE DỮ LIỆU ---
    db.ref('tkd_online_data').on('value', snap => {
        state = snap.val() || { teams: [], athletes: {}, referees: {}, matches: {}, tournamentName: "" };
        document.getElementById('draw-tour-name').innerText = state.tournamentName || "TAEKWONDO TOURNAMENT";
        renderBoard();
        if(isMaster) updateAdminControls();
    });

    // --- XỬ LÝ IMPORT (TỐI ƯU CHO FILE CỦA BẠN) ---
    function handleImport(mode) {
        const file = document.getElementById(mode === 'vdv' ? 'file-vdv' : 'file-ref').files[0];
        if(!file) return alert("Chưa chọn file!");

        const reader = new FileReader();
        reader.onload = (e) => {
            const wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array'});
            const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
            
            if(mode === 'vdv') {
                let newAthletes = {}, newTeams = new Set(state.teams || []);
                data.forEach(row => {
                    // Thuật toán tìm cột thông minh:
                    const find = (keywords) => {
                        const key = Object.keys(row).find(k => keywords.some(kw => k.toLowerCase().replace(/\s/g,'').includes(kw)));
                        return key ? row[key] : null;
                    };
                    
                    const name = find(['hovaten', 'tenvdv', 'hoten', 'hovatenvdv']);
                    const team = find(['tendonvi', 'donvi', 'clb', 'doan']);
                    const cat = find(['noidung', 'hangcan']);
                    const age = find(['luatuoi', 'tuoi']);

                    if(name && team) {
                        const id = "V_" + Math.random().toString(36).substr(2, 7);
                        newAthletes[id] = { name: String(name).trim(), team: String(team).trim(), cat: String(cat||'').trim(), age: String(age||'').trim() };
                        newTeams.add(String(team).trim());
                    }
                });
                db.ref('tkd_online_data/athletes').update(newAthletes);
                db.ref('tkd_online_data/teams').set(Array.from(newTeams));
                alert(`Đã tải lên ${Object.keys(newAthletes).length} vận động viên!`);
            } else {
                let newRefs = {};
                data.forEach(row => {
                    const find = (keywords) => {
                        const key = Object.keys(row).find(k => keywords.some(kw => k.toLowerCase().replace(/\s/g,'').includes(kw)));
                        return key ? row[key] : null;
                    };
                    const name = find(['tentrongtai', 'hoten', 'trongtai']);
                    const team = find(['donvi', 'tendonvi', 'clb']);
                    if(name && team) {
                        const id = "R_" + Math.random().toString(36).substr(2, 7);
                        newRefs[id] = { name: String(name).trim(), team: String(team).trim() };
                    }
                });
                db.ref('tkd_online_data/referees').update(newRefs);
                alert(`Đã tải lên ${Object.keys(newRefs).length} trọng tài!`);
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // --- LOGIC TRẬN ĐẤU ---
    function loadAthletes(side) {
        const team = document.getElementById('m-team' + side).value;
        const athletes = Object.values(state.athletes || {}).filter(a => a.team === team);
        const html = `<option value="">-- Chọn VĐV --</option>` + athletes.map(a => `<option value="${a.name}">${a.name} (${a.cat})</option>`).join('');
        document.getElementById('m-athlete' + side).innerHTML = html;
    }

    function createMatch() {
        const m = {
            court: document.getElementById('m-court').value,
            code: document.getElementById('m-code').value,
            title: document.getElementById('m-title').value,
            teamA: document.getElementById('m-teamA').value,
            teamB: document.getElementById('m-teamB').value,
            athleteA: document.getElementById('m-athleteA').value,
            athleteB: document.getElementById('m-athleteB').value,
            score1: 0, score2: 0, status: 'WAITING', assigned: ""
        };
        if(!m.code || !m.teamA || !m.teamB) return alert("Vui lòng nhập đủ thông tin trận!");
        db.ref('tkd_online_data/matches').push(m).then(() => alert("Đã tạo trận!"));
    }

    // --- HIỂN THỊ MÀN HÌNH CHÍNH ---
    function renderBoard() {
        const grid = document.getElementById('main-grid');
        grid.innerHTML = '';
        
        ["1", "2", "3"].forEach(cNum => {
            const matches = Object.entries(state.matches || {}).filter(([k,m]) => m.court == cNum);
            let html = `<div class="court-card"><h2 style="text-align:center; color:var(--gold); margin:0 0 15px 0">SÂN ${cNum}</h2>`;
            
            const live = matches.filter(([k,m]) => m.status === 'LIVE');
            const wait = matches.filter(([k,m]) => m.status === 'WAITING').sort((a,b) => a[1].code - b[1].code);
            const done = matches.filter(([k,m]) => m.status === 'FINISHED').sort((a,b) => b[1].code - a[1].code).slice(0, 2);

            if(live.length) html += `<small style="color:var(--success)">● ĐANG ĐẤU</small>` + live.map(([k,m]) => renderMatchItem(k,m,true)).join('');
            if(wait.length) html += `<small style="color:var(--text-muted)">○ TIẾP THEO</small>` + wait.map(([k,m]) => renderMatchItem(k,m,false)).join('');
            if(done.length) html += `<small style="color:var(--text-muted)">✓ VỪA XONG</small>` + done.map(([k,m]) => renderMatchItem(k,m,false,true)).join('');

            grid.innerHTML += html + '</div>';
        });
    }

    function renderMatchItem(key, m, isLive, isDone=false) {
        return `
            <div class="match-item ${isLive ? 'match-live' : ''} ${isDone ? 'done' : ''}" style="${isDone?'opacity:0.6':''}">
                <div class="flex-between">
                    <span style="background:var(--gold); color:#000; padding:2px 8px; border-radius:4px; font-weight:bold">T.${m.code}</span>
                    <small style="font-weight:bold">${m.title}</small>
                </div>
                <div class="vdv-row">
                    <div class="vdv-info" style="color:var(--red)">
                        <div class="name-big">${m.athleteA || 'CHƯA CHỌN'}</div>
                        <div class="sub-info">${m.teamA}</div>
                    </div>
                    <div class="score-box">${m.score1} - ${m.score2}</div>
                    <div class="vdv-info" style="color:var(--blue); text-align:right">
                        <div class="name-big">${m.athleteB || 'CHƯA CHỌN'}</div>
                        <div class="sub-info">${m.teamB}</div>
                    </div>
                </div>
                <div style="font-size:10px; color:var(--text-muted); border-top:1px solid #334155; padding-top:5px">
                    ${m.assigned || 'Chưa phân công trọng tài'}
                </div>
                ${isMaster ? `
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:10px">
                        ${m.status === 'LIVE' ? `
                            <button class="tab-btn" style="background:var(--red)" onclick="upScore('${key}',1,1)">ĐỎ +</button>
                            <button class="tab-btn" style="background:var(--blue)" onclick="upScore('${key}',2,1)">XANH +</button>
                            <button class="btn" style="grid-column:span 2; background:#475569" onclick="setStatus('${key}','FINISHED')">KẾT THÚC</button>
                        ` : (m.status === 'WAITING' ? `
                            <button class="btn" style="grid-column:span 2; background:var(--success)" onclick="setStatus('${key}','LIVE')">BẮT ĐẦU</button>
                        ` : `
                            <button class="btn" style="grid-column:span 2; background:var(--blue)" onclick="setStatus('${key}','WAITING')">ĐẤU LẠI / SỬA</button>
                        `)}
                        <button class="btn" style="grid-column:span 2; background:transparent; color:red; font-size:10px" onclick="if(confirm('Xóa trận?')) db.ref('tkd_online_data/matches/${key}').remove()">XÓA TRẬN</button>
                    </div>
                ` : ''}
            </div>
        `;
    }

    // --- QUẢN LÝ TRỌNG TÀI TRUNG LẬP ---
    function prepAssign() {
        const mId = document.getElementById('assign-m-id').value;
        if(!mId) return;
        const m = state.matches[mId];
        // Lọc trọng tài không thuộc TeamA và không thuộc TeamB
        const neutralRefs = Object.entries(state.referees || {}).filter(([id, r]) => r.team !== m.teamA && r.team !== m.teamB);
        
        let options = `<option value="">-- Chọn TT trung lập --</option>` + neutralRefs.map(([id, r]) => `<option value="${id}">${r.name} (${r.team})</option>`).join('');
        
        let html = '<p><small>Yêu cầu trọng tài trung lập (không thuộc '+m.teamA+' & '+m.teamB+')</small></p>';
        for(let i=1; i<=4; i++) {
            html += `<label><small>Trọng tài ${i}:</small></label><select id="slot-${i}">${options}</select>`;
        }
        document.getElementById('assign-slots').innerHTML = html;
        document.getElementById('btn-do-assign').classList.remove('hidden');
    }

    function saveAssignment() {
        const mId = document.getElementById('assign-m-id').value;
        let names = [];
        for(let i=1; i<=4; i++) {
            const rId = document.getElementById('slot-'+i).value;
            if(!rId) return alert("Vui lòng chọn đủ 4 trọng tài!");
            names.push(state.referees[rId].name);
        }
        db.ref(`tkd_online_data/matches/${mId}/assigned`).set("TT: " + names.join(", "));
        alert("Đã gán trọng tài!");
    }

    // --- HELPER FUNCTIONS ---
    function updateAdminControls() {
        const teamOpts = `<option value="">-- Chọn Đơn vị --</option>` + (state.teams || []).sort().map(t => `<option value="${t}">${t}</option>`).join('');
        ['m-teamA', 'm-teamB'].forEach(id => {
            const el = document.getElementById(id);
            if(!el.value) el.innerHTML = teamOpts;
        });

        const mOpts = `<option value="">-- Chọn trận cần gán --</option>` + Object.entries(state.matches || {}).filter(([k,m])=>!m.assigned).map(([k,m]) => `<option value="${k}">Trận ${m.code} - ${m.title}</option>`).join('');
        document.getElementById('assign-m-id').innerHTML = mOpts;
    }

    function upScore(k, team, val) {
        const field = team === 1 ? 'score1' : 'score2';
        const current = state.matches[k][field] || 0;
        db.ref(`tkd_online_data/matches/${k}/${field}`).set(Math.max(0, current + val));
    }

    function setStatus(k, s) { db.ref(`tkd_online_data/matches/${k}/status`).set(s); }
    function login() { if(document.getElementById('admin-pass').value === '123') { localStorage.setItem('tkd_master', 'true'); location.reload(); } else alert("Sai!"); }
    function logout() { localStorage.removeItem('tkd_master'); location.reload(); }
    function showTab(i) {
        document.querySelectorAll('.tab-btn').forEach((b, idx) => b.classList.toggle('active', i === idx));
        document.querySelectorAll('.tab-panel').forEach((p, idx) => p.classList.toggle('active', i === idx));
    }
    function saveTourName() { db.ref('tkd_online_data/tournamentName').set(document.getElementById('set-tour-name').value); }
    function clearData() { if(confirm("Xóa toàn bộ VĐV, Trọng tài và Đơn vị?")) db.ref('tkd_online_data').update({athletes:{}, referees:{}, teams:[]}); }
    
    setInterval(() => { document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('vi-VN'); }, 1000);
</script>
</body>
</html>
