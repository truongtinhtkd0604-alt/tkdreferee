<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG GIẢI THI ĐẤU TAEKWONDO</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --red: #e11d48; --blue: #2563eb; --gold: #fbbf24; --bg: #020617; --card: #111827; --sidebar: #0f172a; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); margin: 0; color: white; overflow: hidden; display: flex; height: 100vh; }
        
        /* SIDEBAR QUẢN TRỊ (BÊN TRÁI) */
        .sidebar { 
            width: 320px; background: var(--sidebar); border-right: 1px solid #1e293b; 
            padding: 20px; display: flex; flex-direction: column; overflow-y: auto;
        }
        .login-box { background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155; margin-top: 10px; }
        .login-input { width: 100%; padding: 10px; margin-bottom: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; box-sizing: border-box; }
        
        .tab-btn { width: 100%; padding: 12px; margin-bottom: 5px; border: none; background: transparent; color: #94a3b8; text-align: left; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9em; }
        .tab-btn.active { background: var(--red); color: white; }
        .admin-panel { margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px; }

        /* MÀN HÌNH HIỂN THỊ (BÊN PHẢI) */
        .main-display { flex: 1; padding: 25px; overflow-y: auto; background: linear-gradient(135deg, #020617 0%, #0f172a 100%); }
        header { background: rgba(0,0,0,0.3); padding: 15px 25px; border-radius: 12px; border-bottom: 2px solid var(--red); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        
        .courts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px; }
        .court-card { background: var(--card); border-radius: 16px; padding: 15px; border: 1px solid #1e293b; position: relative; }
        .court-card h3 { text-align: center; color: var(--gold); margin: 0 0 15px 0; font-size: 1.6em; letter-spacing: 2px; }
        
        /* Match Styling */
        .match-item { background: #1e293b; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 6px solid #475569; position: relative; }
        .match-live { border-left-color: #10b981; background: #064e3b; animation: glow 2s infinite; }
        .match-finished { opacity: 0.3; filter: grayscale(0.8); }

        .team-box { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1.3em; margin: 10px 0; }
        .score { background: #000; padding: 4px 12px; border-radius: 6px; min-width: 50px; text-align: center; border: 1px solid var(--gold); }
        
        .ref-info { font-size: 0.75em; color: #94a3b8; border-top: 1px solid #334155; padding-top: 8px; margin-top: 5px; font-style: italic; }

        /* Status Tags */
        .tag { font-size: 0.65em; padding: 2px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .tag-live { background: #10b981; color: #000; }
        .tag-waiting { background: #475569; color: #fff; }

        /* UI Helpers */
        .hidden { display: none !important; }
        .btn-sm { padding: 8px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        input, select { padding: 8px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; width: 100%; margin-bottom: 8px; }
        
        @keyframes glow { 0% { box-shadow: 0 0 5px rgba(16, 185, 129, 0.2); } 50% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); } 100% { box-shadow: 0 0 5px rgba(16, 185, 129, 0.2); } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="color:var(--gold); margin-top:0;">TEAMY TKD 5.0</h2>
        
        <div id="auth-section">
            <div class="login-box">
                <input type="text" id="admin-user" class="login-input" placeholder="Tài khoản">
                <input type="password" id="admin-pass" class="login-input" placeholder="Mật khẩu">
                <button class="btn-sm" style="background:var(--red); width:100%" onclick="checkAdmin()">ĐĂNG NHẬP ADMIN</button>
            </div>
        </div>

        <div id="admin-menu" class="hidden">
            <div style="color:#10b981; margin-bottom:15px; font-weight:bold;">● QUẢN TRỊ VIÊN ĐANG TRỰC</div>
            <button class="tab-btn active" onclick="openTab(event, 'tab-setup')">⚙️ THIẾT LẬP GIẢI</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-refs')">⚖️ TRỌNG TÀI</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-matches')">🥋 TRẬN ĐẤU</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-assign')">📋 PHÂN CÔNG</button>

            <div class="admin-panel">
                <div id="tab-setup" class="tab-content">
                    <input type="text" id="input-tournament-name" placeholder="Tên giải đấu">
                    <button class="btn-sm" style="background:#10b981; width:100%" onclick="updateTournamentName()">LƯU TÊN GIẢI</button>
                    <hr style="border-color:#334155; margin:15px 0;">
                    <input type="text" id="team-name" placeholder="Tên CLB mới">
                    <button class="btn-sm" style="background:var(--blue); width:100%" onclick="addTeam()">THÊM ĐƠN VỊ</button>
                </div>

                <div id="tab-refs" class="tab-content hidden">
                    <input type="text" id="ref-name" placeholder="Tên Trọng tài">
                    <select id="ref-team-select"></select>
                    <button class="btn-sm" style="background:var(--blue); width:100%" onclick="addRef()">LƯU TRỌNG TÀI</button>
                </div>

                <div id="tab-matches" class="tab-content hidden">
                    <select id="m-court"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select>
                    <input type="number" id="m-code" placeholder="Trận số">
                    <select id="m-teamA"></select>
                    <select id="m-teamB"></select>
                    <button class="btn-sm" style="background:var(--red); width:100%" onclick="addMatch()">TẠO TRẬN ĐẤU</button>
                </div>

                <div id="tab-assign" class="tab-content hidden">
                    <select id="assign-match-select" onchange="setupAssignUI()"></select>
                    <div id="manual-selectors"></div>
                    <button id="btn-confirm-assign" class="btn-sm hidden" style="background:#10b981; width:100%; margin-top:10px;" onclick="executeAssign()">XÁC NHẬN PHÂN CÔNG</button>
                </div>
            </div>

            <button class="btn-sm" style="background:#334155; margin-top:40px; width:100%" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </aside>

    <main class="main-display">
        <header>
            <h1 id="display-tournament-name" style="margin:0;">ĐANG CẬP NHẬT...</h1>
            <div style="text-align:right">
                <div id="clock" style="font-weight:bold; font-size:1.2em; color:var(--gold);">00:00:00</div>
                <small style="color:#64748b">LIVE DATA SYSTEM</small>
            </div>
        </header>

        <div class="courts-grid" id="courts-display"></div>
    </main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", 
        authDomain: "tkdreferee-4fbcc.firebaseapp.com",
        databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tkdreferee-4fbcc",
        appId: "1:17831183248:web:b3400d10be9ff017236915"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let localTeams = {}; let localRefs = {}; let localMatches = {};
    const isAdmin = localStorage.getItem('tkd_admin_login');

    if(isAdmin) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('admin-menu').classList.remove('hidden');
    }

    db.ref('tkd_online_data').on('value', snap => {
        const data = snap.val() || {};
        localTeams = data.teams || {};
        localRefs = data.referees || {};
        localMatches = data.matches || {};
        document.getElementById('display-tournament-name').innerText = data.tournamentName || "GIẢI VÔ ĐỊCH TAEKWONDO";
        renderDisplay();
        if(isAdmin) updateAdminUI();
    });

    function renderDisplay() {
        const grid = document.getElementById('courts-display');
        grid.innerHTML = '';
        const orderWeight = { 'LIVE': 1, 'WAITING': 2, 'FINISHED': 3 };

        ["1", "2", "3"].forEach(cNum => {
            const matches = Object.entries(localMatches)
                .filter(([k,m]) => m.court == cNum)
                .sort((a,b) => orderWeight[a[1].status] - orderWeight[b[1].status] || a[1].code - b[1].code)
                .slice(0, 3); // GIỚI HẠN 3 TRẬN GẦN NHẤT

            let html = `<div class="court-card"><h3>SÂN ${cNum}</h3>`;
            html += matches.map(([key, m]) => `
                <div class="match-item ${m.status==='LIVE' ? 'match-live' : (m.status==='FINISHED' ? 'match-finished' : '')}">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="tag ${m.status==='LIVE' ? 'tag-live' : 'tag-waiting'}">${m.status==='LIVE' ? 'ĐANG ĐẤU' : 'CHỜ ĐẤU'}</span>
                        <b style="color:var(--gold)">TRẬN #${m.code}</b>
                    </div>
                    <div class="team-box">
                        <span style="color:var(--red); width:35%; text-align:left;">${m.teamA}</span>
                        <div class="score">${m.score1||0} - ${m.score2||0}</div>
                        <span style="color:var(--blue); width:35%; text-align:right;">${m.teamB}</span>
                    </div>
                    <div class="ref-info">${m.assigned || '⚠️ Đang chờ phân công trọng tài'}</div>
                    
                    ${isAdmin && m.status !== 'FINISHED' ? `
                        <div style="margin-top:10px; display:flex; gap:5px;">
                            ${m.status==='WAITING' ? `<button class="btn-sm" style="background:#10b981; flex:1" onclick="setStatus('${key}','LIVE')">▶ BẮT ĐẦU</button>` : ''}
                            ${m.status==='LIVE' ? `<button class="btn-sm" style="background:#475569; flex:1" onclick="setStatus('${key}','FINISHED')">⏹ XONG</button>` : ''}
                        </div>
                    `:''}
                </div>
            `).join('') || '<div style="text-align:center; padding:40px; color:#334155;">TRỐNG</div>';
            grid.innerHTML += html + '</div>';
        });
    }

    // HÀM ADMIN
    function checkAdmin() {
        const u = document.getElementById('admin-user').value;
        const p = document.getElementById('admin-pass').value;
        db.ref(`tkd_online_data/accounts/${u}`).once('value', snap => {
            if(snap.val() && String(snap.val().password) === p) {
                localStorage.setItem('tkd_admin_login', 'true');
                location.reload();
            } else alert("Sai thông tin quản trị!");
        });
    }
    function logout() { localStorage.removeItem('tkd_admin_login'); location.reload(); }
    
    function openTab(e, id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.remove('hidden');
        e.currentTarget.classList.add('active');
    }

    function setupAssignUI() {
        const mId = document.getElementById('assign-match-select').value;
        if(!mId) { document.getElementById('manual-selectors').innerHTML = ''; return; }
        const m = localMatches[mId];
        const neutral = Object.entries(localRefs).filter(([id, r]) => r.team !== m.teamA && r.team !== m.teamB);
        let opts = `<option value="">-- Chọn TT --</option>` + neutral.map(([id, r]) => `<option value="${id}">${r.name}</option>`).join('');
        
        document.getElementById('manual-selectors').innerHTML = `
            <small>TT Chính:</small><select id="pos-0">${opts}</select>
            <small>Giám định 1:</small><select id="pos-1">${opts}</select>
            <small>Giám định 2:</small><select id="pos-2">${opts}</select>
        `;
        document.getElementById('btn-confirm-assign').classList.remove('hidden');
    }

    function executeAssign() {
        const mId = document.getElementById('assign-match-select').value;
        let names = [];
        for(let i=0; i<3; i++) {
            const val = document.getElementById(`pos-${i}`).value;
            if(!val) return alert("Chưa chọn đủ TT trung lập!");
            names.push(localRefs[val].name);
        }
        db.ref(`tkd_online_data/matches/${mId}/assigned`).set(`TTC: ${names[0]} | GĐ: ${names[1]}, ${names[2]}`).then(()=>alert("Đã chốt!"));
    }

    function setStatus(key, s) { 
        if(s==='LIVE') {
            const court = localMatches[key].court;
            if(Object.values(localMatches).some(m => m.court==court && m.status==='LIVE')) return alert("Sân đang có trận đang đấu!");
        }
        db.ref(`tkd_online_data/matches/${key}/status`).set(s); 
    }

    function updateAdminUI() {
        const tOpts = Object.values(localTeams).map(t => `<option value="${t}">${t}</option>`).join('');
        document.getElementById('ref-team-select').innerHTML = tOpts;
        document.getElementById('m-teamA').innerHTML = tOpts;
        document.getElementById('m-teamB').innerHTML = tOpts;
        document.getElementById('assign-match-select').innerHTML = '<option value="">-- Chọn trận --</option>' + 
            Object.entries(localMatches).filter(([k,m]) => !m.assigned && m.status!=='FINISHED').map(([k,m]) => `<option value="${k}">Trận ${m.code} (Sân ${m.court})</option>`).join('');
    }

    function updateTournamentName() { db.ref('tkd_online_data/tournamentName').set(document.getElementById('input-tournament-name').value); }
    function addTeam() { db.ref('tkd_online_data/teams').push(document.getElementById('team-name').value); document.getElementById('team-name').value=''; }
    function addRef() { db.ref('tkd_online_data/referees').push({name:document.getElementById('ref-name').value, team:document.getElementById('ref-team-select').value}); document.getElementById('ref-name').value=''; }
    function addMatch() {
        const m = {
            court: document.getElementById('m-court').value, code: document.getElementById('m-code').value,
            teamA: document.getElementById('m-teamA').value, teamB: document.getElementById('m-teamB').value,
            status: 'WAITING', assigned: "", score1: 0, score2: 0
        };
        db.ref('tkd_online_data/matches').push(m);
    }
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('vi-VN'); }, 1000);
</script>
</body>
</html>
