<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý TST - Tối Ưu Cơ Sở</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0033A0; --secondary: #C8102E; --success: #28a745; --warning: #ffc107; --info: #17a2b8; --dark: #1a1a1a; --light: #f8f9fa; }
        body { font-family: 'Inter', sans-serif; background: #eef2f7; margin: 0; padding: 10px; }
        
        #loginOverlay { position: fixed; inset: 0; background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-card { background: white; padding: 2rem; border-radius: 1rem; width: 350px; text-align: center; }
        .login-card img { width: 150px; margin-bottom: 1rem; }

        .app-container { max-width: 1100px; margin: auto; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; margin-bottom: 20px; padding-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .header-left img { height: 65px; object-fit: contain; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-box { padding: 20px; border-radius: 12px; color: white; }
        .stat-box h3 { margin: 0; font-size: 0.85rem; text-transform: uppercase; opacity: 0.9; }
        .stat-box p { margin: 10px 0 0; font-size: 1.6rem; font-weight: 800; }

        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; background: var(--light); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        input, select { border: 1px solid #ddd; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; }

        .btn { padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-warning { background: var(--warning); color: #856404; }
        .btn-zalo { background: #0068ff; color: white; padding: 6px 12px; font-size: 0.85rem; text-decoration: none; border-radius: 6px; }
        
        .table-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #fcfcfc; color: #666; font-size: 0.8rem; padding: 15px; text-align: left; border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #f0f0f0; }
        .name-link { color: var(--primary); font-weight: 700; cursor: pointer; text-decoration: underline; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; }
        .modal-content { background: white; max-width: 500px; margin: 50px auto; border-radius: 16px; padding: 25px; position: relative; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <img src="CLB TST - XÓA NỀN.jpg" alt="Logo TST" onerror="this.src='https://via.placeholder.com/150?text=TST+LOGO'">
        <h2 style="color:var(--primary)">HỆ THỐNG TST</h2>
        <input type="password" id="passInput" placeholder="Mật khẩu" style="margin: 1rem 0;">
        <button class="btn btn-primary" onclick="checkLogin()" style="width:100%">ĐĂNG NHẬP</button>
    </div>
</div>

<div class="app-container" id="mainApp">
    <div class="header">
        <div class="header-left">
            <img src="CLB TST - XÓA NỀN.jpg" alt="TST Logo" onerror="this.style.display='none'">
            <h2 style="margin:0; color:var(--primary)">CLUB TAEKWONDO TST</h2>
        </div>
        <button class="btn btn-primary" style="background:#28a745" id="exportBtn">📥 XUẤT EXCEL</button>
    </div>

    <div class="stats-grid">
        <div class="stat-box" style="background: var(--success);"><h3>Tổng thu tháng</h3><p id="totalIncome">0 ₫</p></div>
        <div class="stat-box" style="background: var(--secondary);"><h3>Tổng chi tháng</h3><p id="totalExpense">0 ₫</p></div>
        <div class="stat-box" style="background: var(--warning); color:#856404;"><h3>Võ sinh nợ phí</h3><p id="debtCount">0 Bạn</p></div>
        <div class="stat-box" style="background: var(--info);"><h3>Võ sinh mới</h3><p id="newStudentCount">0 Bạn</p></div>
    </div>

    <div class="grid-form">
        <input type="month" id="filterMonth">
        <select id="filterBranch">
            <option value="all">Tất cả cơ sở</option>
            <option value="CS1">CS1: Huỳnh Tấn Phát</option>
            <option value="CS2">CS2: Sân vận động</option>
        </select>
        <input type="text" id="searchInput" placeholder="Tìm tên võ sinh...">
        <button class="btn btn-warning" id="showDebtBtn">LỌC DANH SÁCH NỢ</button>
    </div>

    <form id="transactionForm" class="grid-form">
        <select id="branch"><option value="CS1">CS1</option><option value="CS2">CS2</option></select>
        <select id="type"><option value="Học phí">Học phí</option><option value="Võ phục">Võ phục</option><option value="Chi phí">Chi phí</option></select>
        <input type="text" id="description" list="studentList" placeholder="Tên võ sinh / Nội dung" required>
        <datalist id="studentList"></datalist>
        <input type="text" id="amountDisplay" placeholder="Số tiền">
        <input type="hidden" id="amountActual">
        <input type="date" id="date" required>
        <button type="submit" class="btn btn-primary" style="grid-column: 1 / -1; width: 220px; justify-self: center;">LƯU HỆ THỐNG</button>
    </form>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr><th>Ngày</th><th>Cơ sở</th><th>Võ sinh</th><th>Loại</th><th>Số tiền</th><th>Thao tác</th></tr>
            </thead>
            <tbody id="transactionList"></tbody>
        </table>
    </div>
</div>

<div id="profileModal" class="modal">
    <div class="modal-content">
        <h3 id="m_name" style="color:var(--primary); margin-top:0;"></h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <select id="m_status"><option value="active">Đang tập luyện</option><option value="quit">Nghỉ tập</option></select>
            <select id="m_branch"><option value="CS1">CS1</option><option value="CS2">CS2</option></select>
            <input type="tel" id="m_phone" placeholder="SĐT Phụ huynh">
            <input type="number" id="m_fee" placeholder="Mức phí">
        </div>
        <button class="btn btn-primary" onclick="updateProfile()" style="width:100%; margin-top:15px;">CẬP NHẬT</button>
        <button class="btn" onclick="closeModal()" style="width:100%; margin-top:5px;">ĐÓNG</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfxbFrMabJHbARXpAqStIrSFlSAcCxgGY",
      authDomain: "quanly-tst.firebaseapp.com",
      projectId: "quanly-tst",
      storageBucket: "quanly-tst.firebasestorage.app",
      messagingSenderId: "981970279440",
      appId: "1:981970279440:web:8ac137ec4f72a39faa7e95"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "tst_transactions");
    const profRef = collection(db, "tst_profiles");

    window.checkLogin = () => {
        if(document.getElementById('passInput').value === "Tinhts64") {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        } else alert("Sai mật khẩu!");
    };

    const amtDisp = document.getElementById('amountDisplay');
    const amtAct = document.getElementById('amountActual');
    amtDisp.oninput = (e) => {
        let v = e.target.value.replace(/\D/g, '');
        amtAct.value = v;
        e.target.value = v ? parseInt(v).toLocaleString('vi-VN') : '';
    };

    let allTransactions = [];
    let allProfiles = {};

    onSnapshot(profRef, (snap) => {
        allProfiles = {};
        const dataList = document.getElementById('studentList');
        dataList.innerHTML = '';
        snap.forEach(d => {
            allProfiles[d.id] = d.data();
            dataList.innerHTML += `<option value="${d.id}">`;
        });
        renderApp();
    });

    onSnapshot(query(colRef, orderBy("date", "desc")), (snap) => {
        allTransactions = snap.docs.map(d => ({id: d.id, ...d.data()}));
        renderApp();
    });

    function renderApp(debtMode = false) {
        const list = document.getElementById('transactionList');
        const selMonth = document.getElementById('filterMonth').value;
        const selBranch = document.getElementById('filterBranch').value;
        const search = document.getElementById('searchInput').value.toLowerCase();
        
        list.innerHTML = '';
        let inc = 0, exp = 0, newCount = 0;

        // 1. Lọc danh sách võ sinh đang tập đúng cơ sở
        const activeNames = Object.keys(allProfiles).filter(name => {
            const p = allProfiles[name];
            const matchBranch = (selBranch === 'all' || p.branch === selBranch);
            const isActive = (p.status === 'active');
            const dateValid = (!p.createdAt || p.createdAt.substring(0,7) <= selMonth);
            return isActive && matchBranch && dateValid;
        });

        // 2. Lấy danh sách đã đóng học phí
        const paidNames = allTransactions
            .filter(t => t.date.startsWith(selMonth) && t.type === 'Học phí')
            .map(t => t.description);

        const debtNames = activeNames.filter(name => !paidNames.includes(name));
        document.getElementById('debtCount').innerText = debtNames.length + " Bạn";

        // Thống kê võ sinh mới
        Object.values(allProfiles).forEach(p => {
            if(p.createdAt && p.createdAt.startsWith(selMonth)) newCount++;
        });
        document.getElementById('newStudentCount').innerText = newCount + " Bạn";

        if(debtMode) {
            if(debtNames.length === 0) {
                list.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:50px; color:#999;">Không có võ sinh nợ phí.</td></tr>';
                return;
            }
            debtNames.forEach(name => {
                const p = allProfiles[name];
                const msg = `Thông báo học phí tháng ${selMonth.split('-')[1]} của võ sinh ${name} chưa được ghi nhận. Phụ huynh vui lòng kiểm tra giúp CLB nhé.`;
                const zaloUrl = p.phone ? `https://zalo.me/${p.phone}` : `https://zalo.me/s/search/?q=${encodeURIComponent(name)}`;
                
                list.innerHTML += `<tr style="background:#fff4f4">
                    <td>---</td><td>${p.branch}</td>
                    <td class="name-link" onclick="openProfile('${name}')">${name}</td>
                    <td style="color:red; font-weight:bold;">NỢ HỌC PHÍ</td>
                    <td>0 ₫</td>
                    <td><a href="${zaloUrl}" target="_blank" class="btn-zalo" onclick="copyMsg('${msg}')">Nhắc phí</a></td>
                </tr>`;
            });
            return;
        }

        allTransactions.forEach(t => {
            if(selMonth && !t.date.startsWith(selMonth)) return;
            if(selBranch !== 'all' && t.branch !== selBranch) return;
            if(search && !t.description.toLowerCase().includes(search)) return;

            const isInc = t.type !== 'Chi phí';
            isInc ? (inc += t.amount) : (exp += t.amount);
            
            list.innerHTML += `<tr>
                <td>${t.date.split('-').reverse().join('/')}</td>
                <td>${t.branch}</td>
                <td class="name-link" onclick="openProfile('${t.description}')">${t.description}</td>
                <td>${t.type}</td>
                <td style="font-weight:bold; color:${isInc?'green':'red'}">${isInc?'+':'-'}${t.amount.toLocaleString()}</td>
                <td><button onclick="deleteTx('${t.id}')" style="color:red; border:none; background:none; cursor:pointer;">Xóa</button></td>
            </tr>`;
        });

        document.getElementById('totalIncome').innerText = inc.toLocaleString() + " ₫";
        document.getElementById('totalExpense').innerText = exp.toLocaleString() + " ₫";
    }

    window.copyMsg = (txt) => { navigator.clipboard.writeText(txt); alert("Đã copy lời nhắc Zalo!"); };

    window.openProfile = (name) => {
        const p = allProfiles[name];
        document.getElementById('m_name').innerText = name;
        document.getElementById('m_status').value = p.status || 'active';
        document.getElementById('m_branch').value = p.branch || 'CS1';
        document.getElementById('m_phone').value = p.phone || '';
        document.getElementById('m_fee').value = p.tuitionFee || '';
        document.getElementById('profileModal').style.display = 'block';
    };

    window.updateProfile = async () => {
        const name = document.getElementById('m_name').innerText;
        await setDoc(doc(db, "tst_profiles", name), {
            status: document.getElementById('m_status').value,
            branch: document.getElementById('m_branch').value,
            phone: document.getElementById('m_phone').value,
            tuitionFee: document.getElementById('m_fee').value
        }, { merge: true });
        closeModal();
    };

    window.closeModal = () => document.getElementById('profileModal').style.display = 'none';

    document.getElementById('transactionForm').onsubmit = async (e) => {
        e.preventDefault();
        const name = document.getElementById('description').value;
        const branch = document.getElementById('branch').value;
        const txDate = document.getElementById('date').value;
        
        await addDoc(colRef, {
            branch: branch,
            type: document.getElementById('type').value,
            description: name,
            amount: Number(amtAct.value),
            date: txDate
        });

        if(!allProfiles[name]) {
            await setDoc(doc(db, "tst_profiles", name), {
                status: 'active', branch: branch, createdAt: txDate
            });
        }
        e.target.reset();
        document.getElementById('date').valueAsDate = new Date();
    };

    window.deleteTx = (id) => confirm("Xóa giao dịch?") && deleteDoc(doc(db, "tst_transactions", id));

    document.getElementById('showDebtBtn').onclick = function() {
        const isDebt = this.innerText.includes("NỢ");
        this.innerText = isDebt ? "HIỆN TẤT CẢ" : "LỌC DANH SÁCH NỢ";
        renderApp(isDebt);
    };

    document.getElementById('filterMonth').onchange = () => renderApp();
    document.getElementById('filterBranch').onchange = () => renderApp();
    document.getElementById('searchInput').oninput = () => renderApp();

    document.getElementById('filterMonth').value = new Date().toISOString().substring(0, 7);
    document.getElementById('date').valueAsDate = new Date();
</script>
</body>
</html>
