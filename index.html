<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ĐIỀU HÀNH THI ĐẤU TAEKWONDO</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #e11d48; --blue: #2563eb; --gold: #f59e0b; --bg: #020617; --card: #1e293b; --text: #f8fafc; --border: #334155; --success: #10b981; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); margin: 0; color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 380px; background: #0f172a; border-right: 1px solid var(--border); padding: 15px; overflow-y: auto; transition: left 0.3s ease; z-index: 1000; }
        .main { flex: 1; padding: 15px; overflow-y: auto; background: radial-gradient(circle at top right, #1e293b, #020617); position: relative; }
        .menu-toggle { display: none; position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--blue); color: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1100; font-size: 24px; cursor: pointer; }

        @media (max-width: 850px) {
            .sidebar { position: fixed; left: -100%; height: 100%; width: 90%; max-width: 400px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            .sidebar.active { left: 0; }
            .menu-toggle { display: block; }
            .main { padding: 10px; padding-bottom: 90px; }
        }

        .header-center { text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
        .header-center h2 { font-family: 'Oswald', sans-serif; font-size: 28px; color: var(--gold); margin: 0; text-transform: uppercase; }
        .header-center p { font-size: 14px; color: #cbd5e1; margin: 5px 0 0; letter-spacing: 2px; }

        .panel { display: none; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
        .panel.active { display: block; }
        .tab-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 10px; }
        .tab-btn { padding: 12px 0; font-size: 11px; cursor: pointer; background: var(--card); color: white; border: 1px solid var(--border); border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .tab-btn.active { background: var(--blue); border-color: var(--blue); }
        
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 8px; background: #000; color: white; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        .btn { padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; width: 100%; color: white; margin-bottom: 5px; }

        .court-card { background: rgba(15, 23, 42, 0.8); border-radius: 12px; padding: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        .match-box { border-radius: 10px; padding: 10px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .match-live { border: 2px solid var(--success); background: linear-gradient(145deg, #064e3b, #022c22); }
        .match-wait { border-left: 6px solid var(--gold); background: #1e293b; }
        .match-done { border-left: 6px solid #475569; background: #0f172a; opacity: 0.8; }
        
        .match-actions { position: absolute; top: 5px; right: 5px; display: flex; gap: 4px; z-index: 10; }
        .btn-sm { padding: 6px 12px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; color: white; }
        
        .live-grid { display: grid; grid-template-columns: 1fr 80px 1fr; gap: 10px; align-items: center; text-align: center; }
        .btn-point { padding: 0; font-size: 18px; border-radius: 6px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; }
        .match-grid { display: grid; grid-template-columns: 1fr 60px 1fr; align-items: center; text-align: center; }
        .team-name { font-size: 20px; font-weight: 900; text-transform: uppercase; display: block; word-wrap: break-word; line-height: 1.3;}
        .score-box { font-size: 24px; font-weight: 900; color: var(--gold); background: rgba(0,0,0,0.4); border-radius: 6px; padding: 5px 0; }
        
        .ref-display-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 10px; border-top: 1px dashed #444; padding-top: 10px; }
        .ref-tag { font-size: 10px; color: #cbd5e1; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 4px; line-height: 1.3; }
        .ref-unit { color: #a78bfa; font-size: 9px; font-weight: bold; }
        .badge { position: absolute; top: 5px; left: 10px; font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        
        .data-list { max-height: 350px; overflow-y: auto; background: #000; padding: 5px; border-radius: 6px;}
        .data-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #334155; font-size: 12px; gap: 10px;}
        .data-info { flex: 1; }
        .data-actions { display: flex; gap: 5px; }
        .btn-edit, .btn-del { border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; }
        .btn-edit { background: var(--gold); color: black; }
        .btn-del { background: var(--red); color: white; }

        /* --- CSS SƠ ĐỒ BỐC THĂM VÀ CÂY SƠ ĐỒ --- */
        .draw-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top:10px; color: white; }
        .draw-table th, .draw-table td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        .draw-table th { background: var(--blue); color: white; font-weight: bold; }
        .draw-table tr:nth-child(even) { background: rgba(255,255,255,0.05); }

        .bracket-wrapper { display: flex; flex-direction: row; gap: 40px; padding: 20px; overflow-x: auto; background: rgba(15, 23, 42, 0.6); border-radius: 8px; border: 1px solid var(--border); min-height: 500px; align-items: center;}
        .bracket-round { display: flex; flex-direction: column; justify-content: space-around; gap: 20px; height: 100%; min-width: 220px; }
        .bracket-node { background: #1e293b; border: 1px solid #334155; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.4); position: relative; display: flex; flex-direction: column; }
        .bracket-player { padding: 8px 12px; border-bottom: 1px solid #334155; display: flex; align-items: center; font-size: 13px; font-weight: bold; min-height: 45px;}
        .bracket-player:last-child { border-bottom: none; }
        .bracket-seed { color: var(--gold); font-weight: 900; font-size: 12px; margin-right: 8px; min-width: 15px; text-align: center;}
        .bracket-team { color: #94a3b8; font-size: 10px; font-weight: normal; margin-left: auto; text-align: right;}
        
        /* Đường nối cây sơ đồ */
        .bracket-node::after { content: ''; position: absolute; right: -20px; top: 50%; width: 20px; height: 2px; background: #475569; }
        .bracket-round:last-child .bracket-node::after { display: none; }
    </style>
</head>
<body>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<aside class="sidebar" id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center">
        <h3 style="color:var(--gold); margin:0">HỆ THỐNG ĐIỀU HÀNH - By Trương Tình</h3>
        <button id="btn-logout" style="display:none; background:transparent; border:1px solid var(--red); color:var(--red); padding:4px 8px; border-radius:4px; cursor:pointer" onclick="logout()">Thoát</button>
    </div>
    
    <div id="auth-box" style="margin-top:20px">
        <input type="password" id="pass" placeholder="Mật khẩu">
        <button class="btn" style="background:var(--red)" onclick="login()">VÀO HỆ THỐNG</button>
    </div>
    
    <div id="admin-ui" style="display:none">
        <div class="tab-grid" id="main-tabs">
            <button id="tab-btn-0" class="tab-btn active" onclick="showTab(0)">NHẬP</button>
            <button id="tab-btn-1" class="tab-btn" onclick="showTab(1)">TRẬN</button>
            <button id="tab-btn-2" class="tab-btn" onclick="showTab(2)">SƠ ĐỒ</button>
            <button id="tab-btn-3" class="tab-btn" onclick="showTab(3)">TTÀI</button>
            <button id="tab-btn-4" class="tab-btn" onclick="showTab(4)">DATA</button>
        </div>

        <div class="panel active">
            <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #444">
                <input type="text" id="info-name" placeholder="Tên giải đấu">
                <input type="text" id="info-date" placeholder="Thời gian (Tháng/Năm)">
                <button class="btn" style="background:#475569" onclick="saveInfo()">CẬP NHẬT TIÊU ĐỀ GIẢI</button>
            </div>
            <textarea id="bulk-vdv" rows="4" placeholder="Đơn vị [Tab] Tên [Tab] Nội dung [Tab] Tuổi"></textarea>
            <button class="btn" style="background:var(--success)" onclick="processBulk('vdv')">LƯU VĐV & CLB</button>
            <textarea id="bulk-ref" rows="3" style="margin-top:10px" placeholder="Đơn vị [Tab] Tên"></textarea>
            <button class="btn" style="background:var(--blue)" onclick="processBulk('ref')">LƯU TRỌNG TÀI</button>
        </div>

        <div class="panel">
            <h4 style="color:white; margin:0 0 10px 0; border-bottom:1px solid #444; padding-bottom:5px">TẠO / SỬA TRẬN ĐẤU</h4>
            <div style="display:flex; gap:5px">
                <select id="m-court" style="flex:1"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select>
                <input type="text" id="m-code" placeholder="Mã (VD: 001)" style="flex:1" value="001">
            </div>
            <select id="m-type" onchange="updateCategoryFilter()">
                <option value="Đối kháng">Nội dung: ĐỐI KHÁNG</option>
                <option value="Quyền">Nội dung: QUYỀN (Poomsae)</option>
            </select>
            <select id="m-title-select" onchange="syncPlayers(1); syncPlayers(2);"></select>
            <select id="m-age-select" onchange="syncPlayers(1); syncPlayers(2);"></select>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
                <div style="border: 1px solid var(--red); padding: 5px; border-radius: 5px">
                    <label style="font-size:10px; color:var(--red); font-weight:bold">BÊN ĐỎ (CLB):</label>
                    <select id="m-teamA" onchange="syncPlayers(1)"></select>
                    <select id="m-vA"></select>
                </div>
                <div style="border: 1px solid var(--blue); padding: 5px; border-radius: 5px">
                    <label style="font-size:10px; color:var(--blue); font-weight:bold">BÊN XANH (CLB):</label>
                    <select id="m-teamB" onchange="syncPlayers(2)"></select>
                    <select id="m-vB"></select>
                </div>
            </div>
            <button id="btn-save-match" class="btn" style="background:var(--red); margin-top:10px" onclick="saveMatch()">TẠO TRẬN ĐẤU MỚI</button>
            <button id="btn-cancel-edit" class="btn" style="background:#475569; margin-top:5px; display:none;" onclick="resetMatchForm()">HỦY CHỈNH SỬA</button>
        </div>

        <div class="panel">
            <h4 style="color:white; margin:0 0 10px 0; border-bottom:1px solid #444; padding-bottom:5px">BỐC THĂM VÀ SƠ ĐỒ</h4>
            <select id="draw-type" onchange="updateDrawFilters()">
                <option value="Đối kháng">Nội dung: ĐỐI KHÁNG</option>
                <option value="Quyền">Nội dung: QUYỀN (Poomsae)</option>
            </select>
            <div style="display:flex; gap:5px">
                <select id="draw-title" style="flex:1" onchange="renderDrawTable()"></select>
                <select id="draw-age" style="flex:1" onchange="renderDrawTable()"></select>
            </div>
            <div style="display:flex; gap:5px; margin-top:10px">
                <button class="btn" style="background:var(--success); flex:1" onclick="autoDraw()">⚡ BỐC THĂM T.ĐỘNG</button>
                <button class="btn" style="background:var(--blue); flex:1" onclick="viewBracket()">🌳 XEM SƠ ĐỒ</button>
            </div>
            <div id="draw-list-container" style="max-height: 250px; overflow-y:auto; margin-top:10px">
                </div>
        </div>

        <div class="panel">
            <button class="btn" style="background:var(--red)" onclick="autoAssignAll()">⚡ BỐC THĂM TRỌNG TÀI TỰ ĐỘNG</button>
            <hr style="border-color:#444">
            <label style="font-size:11px">CHỌN TRẬN ĐỂ PHÂN CÔNG TAY:</label>
            <select id="assign-m" onchange="prepAssign()"></select>
            <div id="ref-slots" style="max-height: 250px; overflow-y: auto;"></div>
            <button id="btn-save-ref" class="btn" style="background:var(--success); display:none; margin-top:10px" onclick="saveAssign()">LƯU PHÂN CÔNG</button>
        </div>

        <div class="panel">
            <select id="data-type-select" onchange="renderDataList()">
                <option value="athletes">Vận Động Viên</option>
                <option value="refs">Trọng Tài</option>
            </select>
            <select id="filter-data" onchange="renderDataList()"></select>
            <div id="data-list-container" class="data-list"></div>
            <button class="btn" style="background:#b91c1c; margin-top:20px" onclick="factoryReset()">⚠️ XÓA TRẮNG DỮ LIỆU GIẢI</button>
        </div>
    </div>
</aside>

<main class="main">
    <div class="header-center">
        <h2 id="display-t-name">ĐANG TẢI...</h2>
        <p id="display-t-date">--/--/2026</p>
        
        <div id="view-toggles" style="margin-top:15px; display:flex; justify-content:center; gap:10px">
            <button class="btn-sm" id="btn-view-grid" style="background:var(--blue)" onclick="switchMainView('grid')">SÂN ĐẤU LIVE</button>
            <button class="btn-sm" id="btn-view-bracket" style="background:#475569" onclick="switchMainView('bracket')">SƠ ĐỒ THI ĐẤU</button>
        </div>
    </div>
    
    <div id="grid-system" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap:20px;"></div>
    
    <div id="bracket-system" style="display:none;"></div>
</main>

<script>
const firebaseConfig = { apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", authDomain: "tkdreferee-4fbcc.firebaseapp.com", databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "tkdreferee-4fbcc", appId: "1:17831183248:web:b3400d10be9ff017236915" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let st = { athletes: {}, refs: {}, matches: {}, info: {} };
let editingMatchId = null; 
let currentMainView = 'grid'; // 'grid' hoặc 'bracket'

const userRole = localStorage.getItem('tkd_role');
const isLogged = userRole !== null;

if(isLogged) { 
    document.getElementById('auth-box').style.display = 'none'; 
    document.getElementById('admin-ui').style.display = 'block'; 
    document.getElementById('btn-logout').style.display = 'block'; 
    
    if(userRole === 'sec') {
        document.getElementById('tab-btn-0').style.display = 'none';
        document.getElementById('tab-btn-4').style.display = 'none';
        showTab(1);
    }
}

db.ref('tkd_online_data').on('value', snap => {
    const v = snap.val() || {};
    st.athletes = v.athletes || {}; st.refs = v.refs || {}; st.matches = v.matches || {}; st.info = v.info || { name: "GIẢI VÔ ĐỊCH TAEKWONDO", date: "2026" };
    document.getElementById('display-t-name').innerText = st.info.name; 
    document.getElementById('display-t-date').innerText = st.info.date;
    
    renderBoard(); 
    if(isLogged) { 
        updateUI(); 
        renderDataList(); 
        updateDrawFilters(); 
    }
    
    // Auto update Sơ đồ view nếu đang mở
    if(currentMainView === 'bracket') {
        viewBracket(true);
    }
});

function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }

function login() { 
    const pass = document.getElementById('pass').value;
    if(pass === 'admin123') { 
        localStorage.setItem('tkd_role', 'admin'); location.reload(); 
    } else if(pass === 'tk123') { 
        localStorage.setItem('tkd_role', 'sec'); location.reload(); 
    } else { 
        alert("Sai mật khẩu! Vui lòng thử lại."); 
    }
}

function logout() { localStorage.removeItem('tkd_role'); location.reload(); }
function saveInfo() { db.ref('tkd_online_data/info').set({ name: document.getElementById('info-name').value, date: document.getElementById('info-date').value }); alert("Đã cập nhật!"); }

function updateUI() {
    const athleteTeams = new Set();
    Object.values(st.athletes).forEach(a => athleteTeams.add(a.team));
    const teamOpts = `<option value="">-- Lọc Đơn vị --</option>` + Array.from(athleteTeams).sort().map(t=>`<option value="${t}">${t}</option>`).join('');
    if(!document.getElementById('m-teamA').value) document.getElementById('m-teamA').innerHTML = teamOpts;
    if(!document.getElementById('m-teamB').value) document.getElementById('m-teamB').innerHTML = teamOpts;
    if(!document.getElementById('filter-data').value) document.getElementById('filter-data').innerHTML = teamOpts;

    updateCategoryFilter(); 
    
    const unassigned = Object.entries(st.matches).filter(([k,m]) => m.status !== 'DONE');
    document.getElementById('assign-m').innerHTML = `<option value="">-- Mã trận --</option>` + 
        unassigned.sort((a,b)=>parseInt(a[1].code) - parseInt(b[1].code)).map(([k,m]) => `<option value="${k}">SÂN ${m.court} - TRẬN ${m.code}</option>`).join('');
}

function updateCategoryFilter() {
    const type = document.getElementById('m-type').value;
    const cats = new Set(), ages = new Set();
    Object.values(st.athletes).forEach(a => {
        const isPoomsae = a.cat && (a.cat.toLowerCase().includes("quyền") || a.cat.toLowerCase().includes("poomsae"));
        if(type === "Quyền" && isPoomsae) cats.add(a.cat);
        if(type === "Đối kháng" && !isPoomsae) cats.add(a.cat);
        ages.add(a.age);
    });
    
    // Lưu lại giá trị cũ nếu có
    const curCat = document.getElementById('m-title-select').value;
    const curAge = document.getElementById('m-age-select').value;
    
    document.getElementById('m-title-select').innerHTML = `<option value="">-- Nội dung --</option>` + Array.from(cats).sort().map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById('m-age-select').innerHTML = `<option value="">-- Lứa tuổi --</option>` + Array.from(ages).sort().map(a => `<option value="${a}">${a}</option>`).join('');
    
    if(curCat) document.getElementById('m-title-select').value = curCat;
    if(curAge) document.getElementById('m-age-select').value = curAge;
}

/* --- LOGIC BỐC THĂM VÀ SƠ ĐỒ --- */
function updateDrawFilters() {
    const type = document.getElementById('draw-type').value;
    const cats = new Set(), ages = new Set();
    Object.values(st.athletes).forEach(a => {
        const isPoomsae = a.cat && (a.cat.toLowerCase().includes("quyền") || a.cat.toLowerCase().includes("poomsae"));
        if(type === "Quyền" && isPoomsae) cats.add(a.cat);
        if(type === "Đối kháng" && !isPoomsae) cats.add(a.cat);
        ages.add(a.age);
    });
    
    const curCat = document.getElementById('draw-title').value;
    const curAge = document.getElementById('draw-age').value;

    document.getElementById('draw-title').innerHTML = `<option value="">-- Nội dung --</option>` + Array.from(cats).sort().map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById('draw-age').innerHTML = `<option value="">-- Lứa tuổi --</option>` + Array.from(ages).sort().map(a => `<option value="${a}">${a}</option>`).join('');
    
    if(curCat) document.getElementById('draw-title').value = curCat;
    if(curAge) document.getElementById('draw-age').value = curAge;
    
    renderDrawTable();
}

function renderDrawTable() {
    const cat = document.getElementById('draw-title').value;
    const age = document.getElementById('draw-age').value;
    
    if(!cat || !age) {
        document.getElementById('draw-list-container').innerHTML = '<div style="text-align:center; padding:10px; color:#94a3b8">Vui lòng chọn Nội dung và Lứa tuổi</div>';
        return;
    }

    let list = Object.entries(st.athletes)
        .filter(([k,a]) => a.cat === cat && a.age === age)
        .map(([k,a]) => ({id: k, ...a}));

    // Sắp xếp theo STT Bốc Thăm (nếu có), nếu chưa có thì để cuối
    list.sort((a,b) => (a.drawNum || 9999) - (b.drawNum || 9999));

    let html = `<table class="draw-table"><tr><th>STT</th><th>Họ và Tên</th><th>Đơn vị</th></tr>`;
    list.forEach(a => {
        html += `<tr>
            <td style="color:var(--gold); font-weight:bold; text-align:center">${a.drawNum || '-'}</td>
            <td>${a.name}</td>
            <td style="font-size:10px; color:#94a3b8">${a.team}</td>
        </tr>`;
    });
    html += `</table>`;
    document.getElementById('draw-list-container').innerHTML = html;
}

function autoDraw() {
    const cat = document.getElementById('draw-title').value;
    const age = document.getElementById('draw-age').value;
    if(!cat || !age) return alert("Vui lòng chọn Nội dung và Lứa tuổi để bốc thăm!");

    let list = Object.entries(st.athletes).filter(([k,a]) => a.cat === cat && a.age === age);
    if(list.length === 0) return alert("Không có VĐV nào trong hạng mục này!");

    if(confirm(`Tiến hành bốc thăm tự động cho ${list.length} VĐV?`)) {
        // Thuật toán xáo trộn ngẫu nhiên (Fisher-Yates)
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }

        let updates = {};
        list.forEach((item, index) => {
            updates[`tkd_online_data/athletes/${item[0]}/drawNum`] = index + 1;
        });

        db.ref().update(updates).then(() => {
            alert("Đã bốc thăm thành công!");
        });
    }
}

function switchMainView(view) {
    currentMainView = view;
    document.getElementById('grid-system').style.display = (view === 'grid') ? 'grid' : 'none';
    document.getElementById('bracket-system').style.display = (view === 'bracket') ? 'block' : 'none';
    
    document.getElementById('btn-view-grid').style.background = (view === 'grid') ? 'var(--blue)' : '#475569';
    document.getElementById('btn-view-bracket').style.background = (view === 'bracket') ? 'var(--blue)' : '#475569';
}

function viewBracket(isAutoRefresh = false) {
    const cat = document.getElementById('draw-title').value;
    const age = document.getElementById('draw-age').value;
    
    if(!cat || !age) {
        if(!isAutoRefresh) alert("Vui lòng chọn Nội dung và Lứa tuổi ở Tab SƠ ĐỒ!");
        return;
    }

    if(!isAutoRefresh) switchMainView('bracket');

    let list = Object.values(st.athletes)
        .filter(a => a.cat === cat && a.age === age && a.drawNum)
        .sort((a,b) => a.drawNum - b.drawNum);

    if(list.length === 0) {
        document.getElementById('bracket-system').innerHTML = '<h3 style="text-align:center;color:var(--gold); margin-top:50px">CHƯA CÓ DỮ LIỆU BỐC THĂM CHO HẠNG MỤC NÀY</h3>';
        return;
    }

    // Logic vẽ cây sơ đồ loại trực tiếp (Cơ bản - nhánh luân phiên)
    let size = 2;
    while(size < list.length) size *= 2; // Tìm số mũ của 2 gần nhất (2, 4, 8, 16...)

    let html = `
        <h3 style="text-align:center; color:var(--gold); text-transform:uppercase; margin-bottom: 20px;">
            SƠ ĐỒ: ${cat} - ${age}
        </h3>
        <div class="bracket-wrapper">
    `;

    let rounds = Math.log2(size);
    let currentNodes = [...list];

    for(let r = 0; r <= rounds; r++) {
        html += `<div class="bracket-round">`;
        let numMatches = size / Math.pow(2, r + 1);
        
        if(numMatches < 1 && r === rounds) {
            // Nút Vô Địch
            html += `<div class="bracket-node" style="border-color:var(--gold); background:rgba(245, 158, 11, 0.1)">
                <div class="bracket-player" style="justify-content:center; color:var(--gold); font-size:16px;">🏆 ĐỘI VÔ ĐỊCH</div>
            </div>`;
        } else {
            for(let i = 0; i < numMatches; i++) {
                // Hiển thị vòng 1 tuần tự dựa trên STT bốc thăm
                let p1 = r === 0 ? currentNodes[i*2] : null;
                let p2 = r === 0 ? currentNodes[i*2+1] : null;

                let t1HTML = p1 ? `<span class="bracket-seed">${p1.drawNum}</span> <span style="flex:1">${p1.name}</span> <span class="bracket-team">${p1.team}</span>` : `<span style="color:#64748b; font-style:italic">Vị trí trống...</span>`;
                let t2HTML = p2 ? `<span class="bracket-seed">${p2.drawNum}</span> <span style="flex:1">${p2.name}</span> <span class="bracket-team">${p2.team}</span>` : `<span style="color:#64748b; font-style:italic">Vị trí trống...</span>`;

                html += `
                <div class="bracket-node">
                    <div class="bracket-player" style="border-left: 4px solid var(--red)">${t1HTML}</div>
                    <div class="bracket-player" style="border-left: 4px solid var(--blue)">${t2HTML}</div>
                </div>`;
            }
        }
        html += `</div>`;
    }
    html += `</div>`;
    document.getElementById('bracket-system').innerHTML = html;
}

/* --- CÁC HÀM CŨ ĐÃ CÓ --- */
function syncPlayers(side) {
    const team = document.getElementById(side===1?'m-teamA':'m-teamB').value;
    if(!team) return;
    const cat = document.getElementById('m-title-select').value;
    const age = document.getElementById('m-age-select').value;
    let list = Object.values(st.athletes).filter(a => a.team === team && (!cat || a.cat === cat) && (!age || a.age === age));
    document.getElementById(side===1?'m-vA':'m-vB').innerHTML = list.map(a=>`<option value="${a.name}">${a.name}</option>`).join('');
}

function saveMatch() {
    let codeInput = document.getElementById('m-code');
    const m = { 
        court: document.getElementById('m-court').value, code: codeInput.value, 
        type: document.getElementById('m-type').value, title: document.getElementById('m-title-select').value, 
        age: document.getElementById('m-age-select').value, teamA: document.getElementById('m-teamA').value, 
        teamB: document.getElementById('m-teamB').value, athleteA: document.getElementById('m-vA').value, 
        athleteB: document.getElementById('m-vB').value 
    };
    
    if(!m.code || !m.athleteA) return alert("Vui lòng nhập đủ thông tin (Mã trận, VĐV)!");
    
    if (editingMatchId) {
        db.ref('tkd_online_data/matches/' + editingMatchId).update(m).then(() => {
            alert("Đã cập nhật thông tin trận đấu thành công!");
            resetMatchForm();
        });
    } else {
        m.score1 = 0; m.score2 = 0; m.status = 'WAIT';
        db.ref('tkd_online_data/matches').push(m).then(()=> { 
            codeInput.value = String(parseInt(codeInput.value, 10) + 1).padStart(3, '0');
            alert("Đã tạo trận đấu mới!"); 
        });
    }
}

function loadEditMatch(id) {
    const m = st.matches[id];
    if(!m) return;
    editingMatchId = id;
    showTab(1); // Chuyển sang tab Trận
    
    document.getElementById('m-court').value = m.court;
    document.getElementById('m-code').value = m.code;
    document.getElementById('m-type').value = m.type || 'Đối kháng';
    
    updateCategoryFilter(); 
    
    document.getElementById('m-title-select').value = m.title;
    document.getElementById('m-age-select').value = m.age;
    document.getElementById('m-teamA').value = m.teamA;
    syncPlayers(1);
    document.getElementById('m-vA').value = m.athleteA;
    document.getElementById('m-teamB').value = m.teamB;
    syncPlayers(2);
    document.getElementById('m-vB').value = m.athleteB;
    
    const btn = document.getElementById('btn-save-match');
    btn.innerText = "CẬP NHẬT TRẬN ĐẤU";
    btn.style.background = "var(--gold)";
    btn.style.color = "black";
    document.getElementById('btn-cancel-edit').style.display = "block";
}

function resetMatchForm() {
    editingMatchId = null;
    const btn = document.getElementById('btn-save-match');
    btn.innerText = "TẠO TRẬN ĐẤU MỚI";
    btn.style.background = "var(--red)";
    btn.style.color = "white";
    document.getElementById('btn-cancel-edit').style.display = "none";
}

function delMatch(id) {
    if(confirm("BẠN CÓ CHẮC CHẮN MUỐN XÓA TRẬN ĐẤU NÀY?\nThao tác này không thể hoàn tác!")) {
        db.ref('tkd_online_data/matches/' + id).remove();
        if(editingMatchId === id) resetMatchForm();
    }
}

function renderBoard() {
    const grid = document.getElementById('grid-system'); grid.innerHTML = '';
    ["1","2","3"].forEach(sn => {
        const ms = Object.entries(st.matches).filter(([k,m]) => m.court == sn);
        let html = `<div class="court-card"><div style="background:var(--card);text-align:center;padding:8px;border-radius:6px;margin-bottom:12px;font-weight:bold;font-size:18px;border:1px solid var(--border)">SÂN ${sn}</div>`;
        const live = ms.find(([k,m]) => m.status === 'LIVE');
        
        if(live) {
            const [k,m] = live;
            const adminActions = isLogged ? `<div class="match-actions"><button class="btn-sm" style="background:var(--gold);color:black" onclick="loadEditMatch('${k}')">Sửa</button><button class="btn-sm" style="background:var(--red);" onclick="delMatch('${k}')">Xóa</button></div>` : '';
            html += `<div class="match-box match-live">${adminActions}<span class="badge" style="background:var(--red)">TRẬN ${m.code} - LIVE</span>
                <div style="font-size:14px; font-weight:900; text-align:center; color:#fff; margin-top:15px; text-transform:uppercase; letter-spacing: 0.5px;">${m.type || 'Đ.Kháng'} | ${m.title} - ${m.age}</div>
                <div class="live-grid" style="margin-top:10px">
                    <div>
                        <div class="team-name" style="color:#ff4d4d;">${m.teamA}</div>
                        <div style="font-size:11px; margin-bottom: 8px;">${m.athleteA}</div>
                        ${isLogged ? `<div style="display:flex; justify-content:center; align-items:center; gap:10px;">
                            <button class="btn btn-point" style="background:var(--red); width:32px; height:32px; margin:0;" onclick="upS('${k}',1,1)">+</button>
                            <span style="font-weight:900; font-size:16px; min-width:15px;">1</span>
                            <button class="btn btn-point" style="background:#475569; width:32px; height:32px; margin:0;" onclick="upS('${k}',1,-1)">-</button>
                        </div>` : ''}
                    </div>
                    <div class="score-box">${m.score1}-${m.score2}</div>
                    <div>
                        <div class="team-name" style="color:#4d94ff;">${m.teamB}</div>
                        <div style="font-size:11px; margin-bottom: 8px;">${m.athleteB}</div>
                        ${isLogged ? `<div style="display:flex; justify-content:center; align-items:center; gap:10px;">
                            <button class="btn btn-point" style="background:var(--blue); width:32px; height:32px; margin:0;" onclick="upS('${k}',2,1)">+</button>
                            <span style="font-weight:900; font-size:16px; min-width:15px;">1</span>
                            <button class="btn btn-point" style="background:#475569; width:32px; height:32px; margin:0;" onclick="upS('${k}',2,-1)">-</button>
                        </div>` : ''}
                    </div>
                </div><div class="ref-display-grid">${formatRef(m.assigned)}</div>
                ${isLogged ? `<button class="btn" style="background:#334155; margin-top:10px" onclick="setS('${k}','DONE')">KẾT THÚC TRẬN ĐẤU</button>` : ''}</div>`;
        }
        
        ms.filter(([k,m]) => m.status === 'WAIT').sort((a,b)=>parseInt(a[1].code) - parseInt(b[1].code)).slice(0,2).forEach(([k,m]) => {
            const adminActions = isLogged ? `<div class="match-actions"><button class="btn-sm" style="background:var(--gold);color:black" onclick="loadEditMatch('${k}')">Sửa</button><button class="btn-sm" style="background:var(--red);" onclick="delMatch('${k}')">Xóa</button></div>` : '';
            html += `<div class="match-box match-wait">${adminActions}<span class="badge" style="background:var(--gold); color:black">TRẬN ${m.code} - TIẾP THEO</span>
                <div style="font-size:12px; font-weight:bold; text-align:center; color:#cbd5e1; margin-top:15px; text-transform:uppercase;">${m.type || 'Đ.Kháng'} | ${m.title} - ${m.age}</div>
                <div class="match-grid" style="margin:8px 0"><span class="team-name" style="color:#ff4d4d">${m.teamA}</span><span style="font-weight:900; font-size:14px">VS</span><span class="team-name" style="color:#4d94ff">${m.teamB}</span></div>
                <div class="ref-display-grid">${formatRef(m.assigned)}</div>
                ${isLogged && !live ? `<button class="btn" style="background:var(--success);margin-top:8px" onclick="setS('${k}','LIVE')">BẮT ĐẦU THI ĐẤU</button>` : ''}</div>`;
        });
        
        ms.filter(([k,m]) => m.status === 'DONE').sort((a,b)=>parseInt(b[1].code) - parseInt(a[1].code)).slice(0,2).forEach(([k,m]) => {
            const adminActions = isLogged ? `<div class="match-actions"><button class="btn-sm" style="background:var(--gold);color:black" onclick="loadEditMatch('${k}')">Sửa</button><button class="btn-sm" style="background:var(--red);" onclick="delMatch('${k}')">Xóa</button></div>` : '';
            html += `<div class="match-box match-done">${adminActions}<span class="badge" style="background:#475569">TRẬN ${m.code} - KẾT THÚC</span>
                <div class="match-grid" style="margin-top:12px"><span class="team-name">${m.teamA}</span><span style="color:var(--gold)">${m.score1}-${m.score2}</span><span class="team-name">${m.teamB}</span></div></div>`;
        });
        grid.innerHTML += html + `</div>`;
    });
}

function prepAssign() { const mid = document.getElementById('assign-m').value; if(!mid) return; const m = st.matches[mid]; const nr = Object.entries(st.refs).filter(([k,r]) => r.team !== m.teamA && r.team !== m.teamB); const opts = `<option value="">-- Chọn Trọng Tài --</option>` + nr.map(([k,r]) => `<option value="${r.name}">${r.name} (${r.team})</option>`).join(''); let html = ''; const labels = m.type === "Quyền" ? ["GĐ1", "GĐ2", "GĐ3", "GĐ4", "GĐ5"] : ["TTC", "GĐ1", "GĐ2", "GĐ3"]; labels.forEach((lb, i) => { html += `<label style="font-size:10px;color:var(--gold);margin-top:5px;display:block">${lb}</label><select id="s-ref-${i}" class="ref-sel-box" style="margin-bottom:5px">${opts}</select>`; }); document.getElementById('ref-slots').innerHTML = html; document.getElementById('btn-save-ref').style.display = 'block'; }
function saveAssign() { const mid = document.getElementById('assign-m').value; const m = st.matches[mid]; const labels = m.type === "Quyền" ? ["GĐ1", "GĐ2", "GĐ3", "GĐ4", "GĐ5"] : ["TTC", "GĐ1", "GĐ2", "GĐ3"]; const ass = []; labels.forEach((lb, i) => { const val = document.getElementById(`s-ref-${i}`).value; if(val) ass.push(`${lb}: ${val}`); }); db.ref(`tkd_online_data/matches/${mid}/assigned`).set(ass.join(" | ")); alert("Đã lưu phân công!"); }
async function autoAssignAll() { const un = Object.entries(st.matches).filter(([k,m]) => m.status === 'WAIT' && !m.assigned); for (const [mid, m] of un) { let nr = Object.entries(st.refs).filter(([k,r]) => r.team !== m.teamA && r.team !== m.teamB).sort(()=>Math.random()-0.5); const lb = m.type === "Quyền" ? ["GĐ1", "GĐ2", "GĐ3", "GĐ4", "GĐ5"] : ["TTC", "GĐ1", "GĐ2", "GĐ3"]; if(nr.length >= lb.length) { const ass = nr.slice(0, lb.length).map((r,i) => `${lb[i]}: ${r[1].name}`).join(" | "); await db.ref(`tkd_online_data/matches/${mid}/assigned`).set(ass); } } alert("Đã tự động phân công!"); }
function formatRef(str) { if(!str) return `<div class="ref-tag" style="grid-column:span 2;text-align:center;color:var(--gold)">CHỜ PHÂN CÔNG...</div>`; return str.split(' | ').map(p => { const [r, n] = p.split(': '); const refObj = Object.values(st.refs).find(x => x.name === n); const unit = refObj ? `<br><span class="ref-unit">(${refObj.team})</span>` : ''; return `<div class="ref-tag"><b>${r}:</b> ${n}${unit}</div>`; }).join(''); }
function showTab(i) { 
    document.querySelectorAll('.tab-btn').forEach((el, idx) => el.classList.toggle('active', i === idx));
    document.querySelectorAll('.panel').forEach((el, idx) => el.classList.toggle('active', i === idx));
}
function upS(k,t,v) { const f = t===1?'score1':'score2'; db.ref(`tkd_online_data/matches/${k}/${f}`).set((st.matches[k][f]||0)+v); }
function setS(k,s) { db.ref(`tkd_online_data/matches/${k}/status`).set(s); }
function factoryReset() { if(confirm("Xóa trắng toàn bộ dữ liệu?")) db.ref('tkd_online_data').set({ athletes:{}, refs:{}, matches:{}, info:{name:"GIẢI TAEKWONDO", date:"2026"} }); }
function processBulk(t) { const lines = document.getElementById(t==='vdv'?'bulk-vdv':'bulk-ref').value.split('\n'); lines.forEach(l => { const p = l.split('\t'); if(p.length>=2) db.ref(`tkd_online_data/${t==='vdv'?'athletes':'refs'}`).push({team:p[0].trim(), name:p[1].trim(), cat:p[2]||'', age:p[3]||''}); }); alert("Đã lưu!"); }
function editData(type, id) { const item = st[type][id]; const newName = prompt("Tên:", item.name); if(newName === null) return; const newTeam = prompt("Đơn vị:", item.team); let updateObj = { name: newName, team: newTeam }; if(type === 'athletes') { updateObj.cat = prompt("Nội dung:", item.cat); updateObj.age = prompt("Lứa tuổi:", item.age); } db.ref(`tkd_online_data/${type}/${id}`).update(updateObj); }
function renderDataList() { const type = document.getElementById('data-type-select').value; const filter = document.getElementById('filter-data').value; let html = ''; Object.entries(st[type] || {}).forEach(([k,v]) => { if(!filter || v.team === filter) { html += `<div class="data-item"><div class="data-info"><b>${v.name}</b> (${v.team}) <br><span style="color:#aaa; font-size:10px">${v.cat ? v.cat + ' | ' + v.age : ''}</span></div><div class="data-actions"><button class="btn-edit" onclick="editData('${type}', '${k}')">Sửa</button><button class="btn-del" onclick="if(confirm('Xóa?')) db.ref('tkd_online_data/${type}/${k}').remove()">Xóa</button></div></div>`; } }); document.getElementById('data-list-container').innerHTML = html; }

</script>
