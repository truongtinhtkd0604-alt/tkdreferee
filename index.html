<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEAMY TKD 15 - SYSTEM MASTER</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --red: #e11d48; --blue: #2563eb; --gold: #f59e0b; --bg: #020617; --card: #1e293b; --text: #f8fafc; --border: #334155; --success: #10b981; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); margin: 0; color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 420px; background: #0f172a; border-right: 1px solid var(--border); padding: 15px; overflow-y: auto; }
        .main { flex: 1; padding: 20px; overflow-y: auto; background: radial-gradient(circle at top right, #1e293b, #020617); }
        .panel { display: none; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
        .panel.active { display: block; }
        .tab-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .tab-btn { padding: 8px 0; font-size: 9px; cursor: pointer; background: var(--card); color: white; border: 1px solid var(--border); border-radius: 4px; font-weight: bold; }
        .tab-btn.active { background: var(--blue); border-color: var(--blue); }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 8px; background: #000; color: white; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
        .btn { padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; width: 100%; color: white; margin-bottom: 5px; }
        
        .court-card { background: rgba(30, 41, 59, 0.5); border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid var(--border); }
        .match-live { border: 2px solid var(--success); background: #064e3b; padding: 15px; border-radius: 10px; margin-bottom: 12px; animation: pulse 2s infinite; }
        .match-wait { background: #1e293b; padding: 18px; border-radius: 12px; margin-bottom: 10px; border-left: 8px solid var(--gold); }
        .match-done { background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 8px; border-left: 8px solid #64748b; opacity: 0.8; }
        
        .team-title { font-size: 18px; font-weight: 800; text-transform: uppercase; display: block; }
        .player-name { font-size: 15px; color: #cbd5e1; display: block; margin-top: 4px; }
        .ref-info { font-size: 11px; color: var(--gold); margin-top: 10px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1); }
        
        @keyframes pulse { 0% { border-color: var(--success); } 50% { border-color: #fff; } 100% { border-color: var(--success); } }
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
        .data-list { font-size: 12px; max-height: 500px; overflow-y: auto; border: 1px solid var(--border); padding: 5px; background: #000; }
        .data-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #334155; align-items: center; }
    </style>
</head>
<body>

<aside class="sidebar">
    <h3 style="color:var(--gold); text-align:center; margin-top:0">ĐIỀU HÀNH THI ĐẤU V15</h3>
    
    <div id="auth-box">
        <input type="password" id="pass" placeholder="Mã PIN">
        <button class="btn" style="background:var(--red)" onclick="login()">ĐĂNG NHẬP</button>
    </div>

    <div id="admin-ui" style="display:none">
        <div class="tab-grid">
            <button class="tab-btn active" onclick="showTab(0)">NHẬP NHANH</button>
            <button class="tab-btn" onclick="showTab(1)">TRẬN</button>
            <button class="tab-btn" onclick="showTab(2)">TTÀI</button>
            <button class="tab-btn" onclick="showTab(3)">DỮ LIỆU</button>
            <button class="tab-btn" onclick="showTab(4)">HỆ THỐNG</button>
        </div>

        <div class="panel active">
            <label style="font-size:11px; color:var(--success)">DÁN DANH SÁCH TỪ EXCEL (Đơn vị, Tên, Nội dung, Lứa tuổi):</label>
            <textarea id="bulk-input" rows="12" placeholder="Ví dụ:&#10;CLB TST	Nguyễn Văn A	Đối kháng 45kg	12-14 tuổi&#10;CLB TST	Trần Thị B	Poomsae Cá nhân	15-17 tuổi"></textarea>
            <button class="btn" style="background:var(--success)" onclick="processBulk()">XỬ LÝ & LƯU DANH SÁCH</button>
            <p style="font-size:10px; color:#94a3b8 italic">* Lưu ý: Các cột cách nhau bằng dấu Tab hoặc phẩy.</p>
        </div>

        <div class="panel">
            <div style="display:flex; gap:5px">
                <select id="m-court" style="flex:1"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select>
                <input type="number" id="m-code" placeholder="Số trận" style="flex:1">
            </div>
            <div style="display:flex; gap:5px">
                <select id="m-title-select" onchange="syncPlayers(1); syncPlayers(2);"><option value="">-- Nội dung --</option></select>
                <select id="m-age-select" onchange="syncPlayers(1); syncPlayers(2);"><option value="">-- Lứa tuổi --</option></select>
            </div>
            <label style="font-size:11px; color:var(--red)">GIÁP ĐỎ:</label>
            <select id="m-teamA" class="team-selects" onchange="syncPlayers(1)"></select>
            <select id="m-vA"><option value="">-- VĐV Đỏ --</option></select>
            <label style="font-size:11px; color:var(--blue)">GIÁP XANH:</label>
            <select id="m-teamB" class="team-selects" onchange="syncPlayers(2)"></select>
            <select id="m-vB"><option value="">-- VĐV Xanh --</option></select>
            <button class="btn" style="background:var(--red); margin-top:10px" onclick="saveMatch()">TẠO TRẬN ĐẤU</button>
        </div>

        <div class="panel">
            <select id="assign-m" onchange="prepAssign()"></select>
            <button id="btn-auto-ref" class="btn" style="background:var(--blue); display:none" onclick="autoAssignRef()">⚡ TỰ ĐỘNG BỐC THĂM (TRUNG LẬP)</button>
            <div id="ref-slots"></div>
            <button id="btn-save-ref" class="btn" style="background:var(--success); display:none" onclick="saveAssign()">XÁC NHẬN PHÂN CÔNG</button>
        </div>

        <div class="panel">
            <select id="filter-team-data" onchange="renderDataList()"><option value="">-- Lọc theo CLB --</option></select>
            <div id="list-vdv" class="data-list"></div>
        </div>

        <div class="panel">
             <button class="btn" style="background:var(--red)" onclick="factoryReset()">XÓA TRẮNG DỮ LIỆU GIẢI</button>
             <button class="btn" style="background:#334155; margin-top:20px" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </div>
</aside>

<main class="main">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px">
        <h2 style="color:var(--gold); margin:0">GIÁM SÁT THI ĐẤU</h2>
        <div id="clock" style="font-family:monospace; font-size:1.2em">00:00:00</div>
    </div>
    <div id="grid-system" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap:25px; margin-top:15px"></div>
</main>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", 
    authDomain: "tkdreferee-4fbcc.firebaseapp.com",
    databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tkdreferee-4fbcc",
    appId: "1:17831183248:web:b3400d10be9ff017236915"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let st = { athletes: {}, refs: {}, matches: {}, teams: [] };
const isLogged = localStorage.getItem('tkd_admin') === 'true';

if(isLogged) {
    document.getElementById('auth-box').style.display = 'none';
    document.getElementById('admin-ui').style.display = 'block';
}

db.ref('tkd_online_data').on('value', snap => {
    const v = snap.val() || {};
    st.athletes = v.athletes || {};
    st.refs = v.refs || {};
    st.matches = v.matches || {};
    st.teams = Array.isArray(v.teams) ? v.teams : Object.values(v.teams || []);
    renderBoard();
    if(isLogged) { updateUI(); renderDataList(); }
});

// XỬ LÝ NHẬP NHANH (COPY PASTE)
function processBulk() {
    const raw = document.getElementById('bulk-input').value;
    if(!raw.trim()) return;
    const lines = raw.split('\n');
    let count = 0;
    let newTeams = [...st.teams];

    lines.forEach(line => {
        if(!line.trim()) return;
        const parts = line.split(/\t|,/); // Tách bằng Tab hoặc Phẩy
        if(parts.length >= 2) {
            const team = parts[0].trim();
            const name = parts[1].trim();
            const cat = parts[2] ? parts[2].trim() : "Chưa rõ";
            const age = parts[3] ? parts[3].trim() : "Chưa rõ";
            
            db.ref('tkd_online_data/athletes').push({ team, name, cat, age });
            if(!newTeams.includes(team)) newTeams.push(team);
            count++;
        }
    });
    
    db.ref('tkd_online_data/teams').set(newTeams);
    alert(`Đã thêm thành công ${count} vận động viên!`);
    document.getElementById('bulk-input').value = '';
}

function updateUI() {
    const teamOpts = `<option value="">-- Chọn Đơn vị --</option>` + st.teams.sort().map(t=>`<option value="${t}">${t}</option>`).join('');
    document.querySelectorAll('.team-selects').forEach(el => { if(!el.value) el.innerHTML = teamOpts; });
    document.getElementById('filter-team-data').innerHTML = `<option value="">-- Lọc theo CLB --</option>` + st.teams.sort().map(t=>`<option value="${t}">${t}</option>`).join('');

    const cats = new Set(), ages = new Set();
    Object.values(st.athletes).forEach(a => { if(a.cat) cats.add(a.cat); if(a.age) ages.add(a.age); });
    document.getElementById('m-title-select').innerHTML = `<option value="">-- Nội dung --</option>` + Array.from(cats).sort().map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById('m-age-select').innerHTML = `<option value="">-- Lứa tuổi --</option>` + Array.from(ages).sort().map(a => `<option value="${a}">${a}</option>`).join('');

    const unassigned = Object.entries(st.matches).filter(([k,m]) => m.status !== 'DONE');
    document.getElementById('assign-m').innerHTML = `<option value="">-- Phân công Trọng tài trận... --</option>` + 
        unassigned.map(([k,m]) => `<option value="${k}">Sân ${m.court} - Trận ${m.code} (${m.athleteA} vs ${m.athleteB})</option>`).join('');
}

function syncPlayers(side) {
    const team = document.getElementById(side===1?'m-teamA':'m-teamB').value;
    const cat = document.getElementById('m-title-select').value;
    const age = document.getElementById('m-age-select').value;
    let list = Object.values(st.athletes).filter(a => a.team === team && (!cat || a.cat === cat) && (!age || a.age === age));
    const selectEl = document.getElementById(side===1?'m-vA':'m-vB');
    selectEl.innerHTML = `<option value="">-- Chọn VĐV --</option>` + list.map(a=>`<option value="${a.name}">${a.name}</option>`).join('');
    if(list.length === 1) selectEl.value = list[0].name;
}

function renderBoard() {
    const grid = document.getElementById('grid-system'); grid.innerHTML = '';
    ["1","2","3"].forEach(sn => {
        const ms = Object.entries(st.matches).filter(([k,m]) => m.court == sn);
        let html = `<div class="court-card"><h2 style="text-align:center;color:var(--gold);margin-top:0">SÂN ${sn}</h2>`;
        
        // 1. LIVE
        const liveMatch = ms.find(([k,m]) => m.status === 'LIVE');
        if(liveMatch) {
            const [k,m] = liveMatch;
            html += `<div class="match-live">
                <div style="text-align:center; margin-bottom:10px"><span class="tag" style="background:var(--red)">ĐANG THI ĐẤU</span></div>
                <div style="display:flex; justify-content:space-between; align-items:center">
                    <div style="width:40%; text-align:center"><span class="team-title" style="color:var(--red)">${m.teamA}</span><span class="player-name">${m.athleteA}</span></div>
                    <div style="font-size:42px; font-weight:900">${m.score1} - ${m.score2}</div>
                    <div style="width:40%; text-align:center"><span class="team-title" style="color:var(--blue)">${m.teamB}</span><span class="player-name">${m.athleteB}</span></div>
                </div>
                <div class="ref-info">⚖️ ${m.assigned || 'Chưa phân công trọng tài'}</div>
                ${isLogged?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px">
                    <button class="btn" style="background:var(--red)" onclick="upS('${k}',1,1)">+ ĐỎ</button><button class="btn" style="background:var(--blue)" onclick="upS('${k}',2,1)">+ XANH</button>
                    <button class="btn" style="grid-column:span 2; background:#444" onclick="setS('${k}','DONE')">KẾT THÚC TRẬN</button>
                </div>`:''}
            </div>`;
        }

        // 2. WAITING (Hiện trọng tài)
        const waiting = ms.filter(([k,m]) => m.status === 'WAIT').sort((a,b)=>a[1].code - b[1].code).slice(0,2);
        if(waiting.length > 0) {
            html += `<div style="font-size:12px; color:var(--gold); font-weight:bold; margin-bottom:10px">TRẬN CHỜ KẾ TIẾP:</div>`;
            waiting.forEach(([k,m]) => {
                html += `<div class="match-wait">
                    <div style="display:flex; justify-content:space-between; font-size:11px; color:#94a3b8; margin-bottom:12px">
                        <b>TRẬN ${m.code}</b> <span>${m.title} - ${m.age}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between">
                        <div style="width:45%"><b class="team-title" style="color:var(--red)">${m.teamA}</b><span class="player-name">${m.athleteA}</span></div>
                        <div style="font-weight:bold; color:var(--gold); padding-top:10px">VS</div>
                        <div style="width:45%; text-align:right"><b class="team-title" style="color:var(--blue)">${m.teamB}</b><span class="player-name">${m.athleteB}</span></div>
                    </div>
                    <div class="ref-info" style="color:#94a3b8; border-color:rgba(255,255,255,0.05)">
                        <b>TT NHIỆM VỤ:</b> ${m.assigned || '<span style="color:var(--red)">Đang chờ phân công...</span>'}
                    </div>
                    ${isLogged?`<button class="btn" style="background:var(--success); margin-top:15px" onclick="setS('${k}','LIVE')">BẮT ĐẦU TRẬN ĐẤU</button>`:''}
                </div>`;
            });
        }

        // 3. DONE
        const done = ms.filter(([k,m]) => m.status === 'DONE').sort((a,b)=>b[1].code - a[1].code).slice(0,1);
        if(done.length > 0) {
            done.forEach(([k,m]) => {
                html += `<div class="match-done">
                    <div style="display:flex; justify-content:space-between; align-items:center">
                        <div style="width:40%"><b style="color:var(--red)">${m.teamA}</b><br><small>${m.athleteA}</small></div>
                        <div style="font-size:20px; font-weight:bold">${m.score1}-${m.score2}</div>
                        <div style="width:40%; text-align:right"><b style="color:var(--blue)">${m.teamB}</b><br><small>${m.athleteB}</small></div>
                    </div>
                </div>`;
            });
        }
        grid.innerHTML += html + `</div>`;
    });
}

// HÀM TIỆN ÍCH
function renderDataList() {
    const filter = document.getElementById('filter-team-data').value;
    const vList = document.getElementById('list-vdv');
    vList.innerHTML = Object.entries(st.athletes).filter(([k,v]) => !filter || v.team === filter).map(([k,v]) => `
        <div class="data-item">
            <div><b style="color:var(--gold)">${v.name}</b><br><small>${v.team} | ${v.cat} | ${v.age}</small></div>
            <div style="display:flex; gap:10px">
                <button onclick="editData('${k}')" style="color:var(--success);background:none;border:none;cursor:pointer">Sửa</button>
                <button onclick="deleteData('athletes','${k}')" style="color:var(--red);background:none;border:none;cursor:pointer">Xóa</button>
            </div>
        </div>
    `).join('');
}
function editData(id) {
    const v = st.athletes[id];
    const n = prompt("Tên:", v.name), c = prompt("Nội dung:", v.cat), a = prompt("Lứa tuổi:", v.age);
    if(n) db.ref(`tkd_online_data/athletes/${id}`).update({ name:n, cat:c, age:a });
}
function prepAssign() {
    const mid = document.getElementById('assign-m').value; if(!mid) return;
    const m = st.matches[mid];
    const neutralRefs = Object.entries(st.refs).filter(([k,r]) => r.team !== m.teamA && r.team !== m.teamB);
    const opts = `<option value="">-- Chọn TT --</option>` + neutralRefs.map(([k,r]) => `<option value="${r.name}">${r.name} (${r.team})</option>`).join('');
    const lb = ["Trọng tài chính", "Giám định 1", "Giám định 2", "Giám định 3"];
    let html = ''; for(let i=1; i<=4; i++) html += `<label style="font-size:10px; color:var(--gold)">${lb[i-1]}:</label><select id="s-ref-${i}">${opts}</select>`;
    document.getElementById('ref-slots').innerHTML = html;
    document.getElementById('btn-save-ref').style.display = 'block'; document.getElementById('btn-auto-ref').style.display = 'block';
}
function autoAssignRef() {
    const mid = document.getElementById('assign-m').value; const m = st.matches[mid];
    let nr = Object.entries(st.refs).filter(([k,r]) => r.team !== m.teamA && r.team !== m.teamB).sort(() => 0.5 - Math.random());
    if(nr.length < 4) return alert("Không đủ trọng tài trung lập!");
    for(let i=1; i<=4; i++) document.getElementById(`s-ref-${i}`).value = nr[i-1][1].name;
}
function saveAssign() {
    const mid = document.getElementById('assign-m').value; const lb = ["TTC", "GĐ1", "GĐ2", "GĐ3"]; const ass = [];
    for(let i=1; i<=4; i++) { const n = document.getElementById(`s-ref-${i}`).value; if(n) ass.push(`${lb[i-1]}: ${n}`); }
    db.ref(`tkd_online_data/matches/${mid}/assigned`).set(ass.join(" | "));
    alert("Đã phân công!"); document.getElementById('assign-m').value = ''; prepAssign();
}
function saveMatch() {
    const m = { court: document.getElementById('m-court').value, code: document.getElementById('m-code').value, title: document.getElementById('m-title-select').value, age: document.getElementById('m-age-select').value, teamA: document.getElementById('m-teamA').value, teamB: document.getElementById('m-teamB').value, athleteA: document.getElementById('m-vA').value, athleteB: document.getElementById('m-vB').value, score1:0, score2:0, status:'WAIT' };
    if(!m.code || !m.athleteA || !m.athleteB) return alert("Thiếu thông tin!");
    db.ref('tkd_online_data/matches').push(m).then(()=> { document.getElementById('m-code').value++; alert("Đã tạo!"); });
}
function upS(k,t,v) { const f = t===1?'score1':'score2'; db.ref(`tkd_online_data/matches/${k}/${f}`).set((st.matches[k][f]||0)+v); }
function setS(k,s) { db.ref(`tkd_online_data/matches/${k}/status`).set(s); }
function deleteData(type, id) { if(confirm("Xóa vĩnh viễn?")) db.ref(`tkd_online_data/${type}/${id}`).remove(); }
function login() { if(document.getElementById('pass').value==='123') { localStorage.setItem('tkd_admin','true'); location.reload(); } }
function logout() { localStorage.removeItem('tkd_admin'); location.reload(); }
function showTab(i) { document.querySelectorAll('.tab-btn, .panel').forEach((el, idx) => el.classList.toggle('active', i === idx % 5)); }
function factoryReset() { if(confirm("XÓA SẠCH DỮ LIỆU GIẢI?")) db.ref('tkd_online_data').set({ teams:[], athletes:{}, refs:{}, matches:{} }); }
setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('vi-VN'); }, 1000);
</script>
</body>
</html>
