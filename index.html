<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEAMY TKD V23 - MOBILE OPTIMIZED</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --red: #e11d48; --blue: #2563eb; --gold: #f59e0b; --bg: #020617; --card: #1e293b; --text: #f8fafc; --border: #334155; --success: #10b981; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); margin: 0; color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR TỐI ƯU DI ĐỘNG */
        .sidebar { width: 380px; background: #0f172a; border-right: 1px solid var(--border); padding: 15px; overflow-y: auto; transition: 0.3s; z-index: 1000; }
        .main { flex: 1; padding: 15px; overflow-y: auto; background: radial-gradient(circle at top right, #1e293b, #020617); position: relative; }
        
        /* Nút đóng mở menu trên Mobile */
        .menu-toggle { display: none; position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--blue); color: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1100; font-size: 24px; font-weight: bold; }

        @media (max-width: 850px) {
            .sidebar { position: fixed; left: -100%; height: 100%; width: 90%; }
            .sidebar.active { left: 0; }
            .menu-toggle { display: block; }
            .main { padding: 10px; padding-bottom: 80px; }
            .court-card { margin-bottom: 15px; }
        }

        .panel { display: none; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
        .panel.active { display: block; }
        .tab-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .tab-btn { padding: 12px 0; font-size: 11px; cursor: pointer; background: var(--card); color: white; border: 1px solid var(--border); border-radius: 4px; font-weight: bold; }
        .tab-btn.active { background: var(--blue); border-color: var(--blue); }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 8px; background: #000; color: white; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        .btn { padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; width: 100%; color: white; margin-bottom: 5px; }

        /* GIÁM SÁT TRẬN ĐẤU */
        .court-card { background: rgba(15, 23, 42, 0.8); border-radius: 12px; padding: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        .match-box { border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .match-live { border: 2px solid var(--success); background: #022c22; }
        .match-wait { border-left: 6px solid var(--gold); background: #1e293b; }
        .match-grid { display: grid; grid-template-columns: 1fr 60px 1fr; align-items: center; text-align: center; }
        .team-name { font-size: 16px; font-weight: 800; text-transform: uppercase; display: block; }
        .score-box { font-size: 32px; font-weight: 900; color: var(--gold); }
        .badge { position: absolute; top: 4px; left: 10px; font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
        .ref-display-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 8px; border-top: 1px dashed #444; padding-top: 8px; }
        .ref-tag { font-size: 10px; color: #aaa; background: rgba(0,0,0,0.3); padding: 3px; border-radius: 3px; }
    </style>
</head>
<body>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<aside class="sidebar" id="sidebar">
    <h3 style="color:var(--gold); text-align:center; margin-top:0">ĐIỀU HÀNH TKD V23</h3>
    <div id="auth-box"><input type="password" id="pass" placeholder="PIN"><button class="btn" style="background:var(--red)" onclick="login()">VÀO HỆ THỐNG</button></div>
    
    <div id="admin-ui" style="display:none">
        <div class="tab-grid">
            <button class="tab-btn active" onclick="showTab(0)">VĐV</button>
            <button class="tab-btn" onclick="showTab(1)">TRẬN</button>
            <button class="tab-btn" onclick="showTab(2)">TTÀI</button>
            <button class="tab-btn" onclick="showTab(3)">DATA</button>
        </div>

        <div class="panel active">
            <textarea id="bulk-vdv" rows="4" placeholder="VĐV: Đơn vị [Tab] Tên [Tab] Nội dung [Tab] Tuổi"></textarea>
            <button class="btn" style="background:var(--success)" onclick="processBulk('vdv')">LƯU VĐV & CLB</button>
            <textarea id="bulk-ref" rows="3" style="margin-top:10px" placeholder="TRỌNG TÀI: Đơn vị [Tab] Tên"></textarea>
            <button class="btn" style="background:var(--blue)" onclick="processBulk('ref')">LƯU TRỌNG TÀI</button>
        </div>

        <div class="panel">
            <div style="display:flex; gap:5px"><select id="m-court" style="flex:1"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select><input type="number" id="m-code" placeholder="Trận số" style="flex:1"></div>
            <select id="m-title-select" onchange="syncPlayers(1); syncPlayers(2);"></select>
            <select id="m-age-select" onchange="syncPlayers(1); syncPlayers(2);"></select>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
                <div style="border: 1px solid var(--red); padding: 5px; border-radius: 5px">
                    <label style="font-size:10px; color:var(--red)">ĐỎ (CLB):</label>
                    <select id="m-teamA" onchange="syncPlayers(1)"></select>
                    <select id="m-vA"></select>
                </div>
                <div style="border: 1px solid var(--blue); padding: 5px; border-radius: 5px">
                    <label style="font-size:10px; color:var(--blue)">XANH (CLB):</label>
                    <select id="m-teamB" onchange="syncPlayers(2)"></select>
                    <select id="m-vB"></select>
                </div>
            </div>
            <button class="btn" style="background:var(--red); margin-top:10px" onclick="saveMatch()">TẠO TRẬN ĐẤU</button>
        </div>

        <div class="panel">
            <button class="btn" style="background:var(--red)" onclick="autoAssignAll()">⚡ PHÂN CÔNG TẤT CẢ TRẬN CHỜ</button>
            <hr style="border-color:#444">
            <label style="font-size:11px">CHỌN TRẬN CẦN ĐIỀU CHỈNH:</label>
            <select id="assign-m" onchange="prepAssign()"></select>
            <div id="ref-slots"></div>
            <button id="btn-save-ref" class="btn" style="background:var(--success); display:none" onclick="saveAssign()">LƯU THAY ĐỔI</button>
        </div>

        <div class="panel">
            <select id="filter-data" onchange="renderDataList()"></select>
            <div id="list-vdv" style="max-height: 300px; overflow: auto; background: #000; font-size: 12px"></div>
            <button class="btn" style="background:#334155; margin-top:20px" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </div>
</aside>

<main class="main">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
        <h4 style="color:var(--gold); margin:0">GIÁM SÁT THI ĐẤU</h4>
        <div id="clock" style="font-size:14px; color:var(--success)">00:00:00</div>
    </div>
    <div id="grid-system" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:15px;"></div>
</main>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", 
    authDomain: "tkdreferee-4fbcc.firebaseapp.com",
    databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tkdreferee-4fbcc",
    appId: "1:17831183248:web:b3400d10be9ff017236915"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let st = { athletes: {}, refs: {}, matches: {}, teams: [] };
const isLogged = localStorage.getItem('tkd_admin') === 'true';

if(isLogged) {
    document.getElementById('auth-box').style.display = 'none';
    document.getElementById('admin-ui').style.display = 'block';
}

db.ref('tkd_online_data').on('value', snap => {
    const v = snap.val() || {};
    st.athletes = v.athletes || {}; st.refs = v.refs || {}; st.matches = v.matches || {};
    // Quan trọng: Chỉ lấy CLB có VĐV tham gia
    st.teams = Array.isArray(v.teams) ? v.teams : Object.values(v.teams || []);
    renderBoard();
    if(isLogged) updateUI();
});

function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }

function updateUI() {
    const teamOpts = `<option value="">-- Đơn vị VĐV --</option>` + st.teams.sort().map(t=>`<option value="${t}">${t}</option>`).join('');
    document.getElementById('m-teamA').innerHTML = teamOpts;
    document.getElementById('m-teamB').innerHTML = teamOpts;
    document.getElementById('filter-data').innerHTML = teamOpts;

    const cats = new Set(), ages = new Set();
    Object.values(st.athletes).forEach(a => { if(a.cat) cats.add(a.cat); if(a.age) ages.add(a.age); });
    document.getElementById('m-title-select').innerHTML = `<option value="">-- Nội dung --</option>` + Array.from(cats).sort().map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById('m-age-select').innerHTML = `<option value="">-- Lứa tuổi --</option>` + Array.from(ages).sort().map(a => `<option value="${a}">${a}</option>`).join('');

    // Hiển thị Sân - Trận trong danh sách phân công
    const unassigned = Object.entries(st.matches).filter(([k,m]) => m.status !== 'DONE');
    document.getElementById('assign-m').innerHTML = `<option value="">-- Chọn Trận --</option>` + 
        unassigned.sort((a,b)=>a[1].code - b[1].code).map(([k,m]) => `<option value="${k}">SÂN ${m.court} - Trận ${m.code}: ${m.teamA} vs ${m.teamB}</option>`).join('');
}

function syncPlayers(side) {
    const team = document.getElementById(side===1?'m-teamA':'m-teamB').value;
    const cat = document.getElementById('m-title-select').value;
    const age = document.getElementById('m-age-select').value;
    if(!team) return;
    
    // Tự động tìm VĐV thuộc CLB + Nội dung + Tuổi
    let list = Object.values(st.athletes).filter(a => a.team === team && (!cat || a.cat === cat) && (!age || a.age === age));
    const sel = document.getElementById(side===1?'m-vA':'m-vB');
    sel.innerHTML = `<option value="">-- VĐV --</option>` + list.map(a=>`<option value="${a.name}">${a.name}</option>`).join('');
    if(list.length === 1) sel.value = list[0].name;
}

function renderBoard() {
    const grid = document.getElementById('grid-system'); grid.innerHTML = '';
    ["1","2","3"].forEach(sn => {
        const ms = Object.entries(st.matches).filter(([k,m]) => m.court == sn);
        let html = `<div class="court-card"><div style="background:var(--card);text-align:center;padding:5px;border-radius:5px;margin-bottom:10px;font-weight:bold">SÂN ${sn}</div>`;
        
        const live = ms.find(([k,m]) => m.status === 'LIVE');
        if(live) {
            const [k,m] = live;
            html += `<div class="match-box match-live">
                <span class="badge" style="background:var(--red)">ĐANG ĐẤU - ${m.code}</span>
                <div style="font-size:10px; text-align:center; margin-bottom:5px; color:#aaa">${m.title}</div>
                <div class="match-grid">
                    <span class="team-name" style="color:#ff4d4d">${m.teamA}</span>
                    <span class="score-box">${m.score1}-${m.score2}</span>
                    <span class="team-name" style="color:#4d94ff">${m.teamB}</span>
                </div>
                <div class="ref-display-grid">${formatRef(m.assigned)}</div>
                ${isLogged?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px">
                    <button class="btn" style="background:var(--red);padding:8px" onclick="upS('${k}',1,1)">+ ĐỎ</button>
                    <button class="btn" style="background:var(--blue);padding:8px" onclick="upS('${k}',2,1)">+ XANH</button>
                    <button class="btn" style="grid-column:span 2; background:#334155;padding:8px" onclick="setS('${k}','DONE')">KẾT THÚC</button>
                </div>`:''}
            </div>`;
        }

        ms.filter(([k,m]) => m.status === 'WAIT').sort((a,b)=>a[1].code - b[1].code).slice(0,2).forEach(([k,m]) => {
            html += `<div class="match-box match-wait">
                <span class="badge" style="background:var(--gold); color:black">CHỜ - ${m.code}</span>
                <div class="match-grid" style="margin-top:5px">
                    <span class="team-name" style="color:#ff4d4d">${m.teamA}</span>
                    <span style="font-weight:bold">VS</span>
                    <span class="team-name" style="color:#4d94ff">${m.teamB}</span>
                </div>
                <div class="ref-display-grid">${formatRef(m.assigned)}</div>
                ${isLogged && !live ? `<button class="btn" style="background:var(--success);margin-top:8px;padding:8px" onclick="setS('${k}','LIVE')">BẮT ĐẦU</button>` : ''}
            </div>`;
        });
        grid.innerHTML += html + `</div>`;
    });
}

function formatRef(str) {
    if(!str) return `<div class="ref-tag" style="grid-column:span 2;text-align:center">ĐỢI PHÂN CÔNG</div>`;
    return str.split(' | ').map(p => {
        const [r, n] = p.split(': ');
        return `<div class="ref-tag"><b>${r}:</b> ${n}</div>`;
    }).join('');
}

function processBulk(type) {
    const raw = document.getElementById(type==='vdv'?'bulk-vdv':'bulk-ref').value;
    if(!raw.trim()) return;
    const lines = raw.split('\n');
    let count = 0; let newTeams = [...st.teams];
    lines.forEach(line => {
        const p = line.split(/\t/);
        if(p.length >= 2) {
            const team = p[0].trim(); const name = p[1].trim();
            if(type === 'vdv') {
                if(!newTeams.includes(team)) newTeams.push(team);
                db.ref('tkd_online_data/athletes').push({ team, name, cat: p[2]?.trim() || "N/A", age: p[3]?.trim() || "N/A" });
            } else {
                db.ref('tkd_online_data/refs').push({ team, name });
            }
            count++;
        }
    });
    db.ref('tkd_online_data/teams').set(newTeams);
    alert("Đã lưu thành công!");
}

async function autoAssignAll() {
    const un = Object.entries(st.matches).filter(([k,m]) => m.status === 'WAIT' && !m.assigned);
    if(un.length === 0) return alert("Không còn trận chờ nào trống!");
    for (const [mid, m] of un) {
        let nr = Object.entries(st.refs).filter(([k,r]) => r.team !== m.teamA && r.team !== m.teamB).sort((a,b)=>Math.random()-0.5);
        if(nr.length >= 4) {
            const lb = ["TTC", "GĐ1", "GĐ2", "GĐ3"];
            const ass = nr.slice(0,4).map((r,i) => `${lb[i]}: ${r[1].name}`).join(" | ");
            await db.ref(`tkd_online_data/matches/${mid}/assigned`).set(ass);
        }
    }
}

function prepAssign() {
    const mid = document.getElementById('assign-m').value; if(!mid) return;
    const m = st.matches[mid];
    const nr = Object.entries(st.refs).filter(([k,r]) => r.team !== m.teamA && r.team !== m.teamB);
    const opts = `<option value="">-- Chọn --</option>` + nr.map(([k,r]) => `<option value="${r.name}">${r.name} (${r.team})</option>`).join('');
    let html = ''; const lb = ["TTC", "GĐ1", "GĐ2", "GĐ3"];
    for(let i=1; i<=4; i++) html += `<label style="font-size:10px;color:var(--gold)">${lb[i-1]}</label><select id="s-ref-${i}">${opts}</select>`;
    document.getElementById('ref-slots').innerHTML = html;
    document.getElementById('btn-save-ref').style.display = 'block';
}

function saveAssign() {
    const mid = document.getElementById('assign-m').value; const ass = [];
    const lb = ["TTC", "GĐ1", "GĐ2", "GĐ3"];
    for(let i=1; i<=4; i++) { const n = document.getElementById(`s-ref-${i}`).value; if(n) ass.push(`${lb[i-1]}: ${n}`); }
    db.ref(`tkd_online_data/matches/${mid}/assigned`).set(ass.join(" | ")); alert("Đã lưu!");
}

function saveMatch() {
    const m = { court: document.getElementById('m-court').value, code: document.getElementById('m-code').value, title: document.getElementById('m-title-select').value, age: document.getElementById('m-age-select').value, teamA: document.getElementById('m-teamA').value, teamB: document.getElementById('m-teamB').value, athleteA: document.getElementById('m-vA').value, athleteB: document.getElementById('m-vB').value, score1:0, score2:0, status:'WAIT' };
    if(!m.athleteA || !m.athleteB) return alert("Thiếu vận động viên!");
    db.ref('tkd_online_data/matches').push(m).then(()=> { document.getElementById('m-code').value++; alert("Đã tạo trận!"); });
}

function login() { if(document.getElementById('pass').value==='123') { localStorage.setItem('tkd_admin','true'); location.reload(); } }
function logout() { localStorage.removeItem('tkd_admin'); location.reload(); }
function showTab(i) { document.querySelectorAll('.tab-btn, .panel').forEach((el, idx) => el.classList.toggle('active', i === idx % 4)); }
function upS(k,t,v) { const f = t===1?'score1':'score2'; db.ref(`tkd_online_data/matches/${k}/${f}`).set((st.matches[k][f]||0)+v); }
function setS(k,s) { db.ref(`tkd_online_data/matches/${k}/status`).set(s); }
setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('vi-VN'); }, 1000);
</script>
</body>
</html>
