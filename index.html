<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEAMY TKD 5.6 - MOBILE OPTIMIZED</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --red: #f43f5e; --blue: #3b82f6; --gold: #f59e0b; 
            --bg: #020617; --card: #1e293b; --sidebar: #0f172a;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', system-ui, sans-serif; background: var(--bg); 
            margin: 0; color: var(--text-main); display: flex; height: 100vh; overflow: hidden; 
        }

        /* HEADER MOBILE */
        .mobile-header {
            display: none; position: fixed; top: 0; left: 0; right: 0; height: 50px;
            background: var(--sidebar); z-index: 100; align-items: center; padding: 0 15px;
            justify-content: space-between; border-bottom: 1px solid var(--border);
        }
        .menu-btn { background: var(--red); border: none; color: white; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        /* SIDEBAR (Panel điều khiển) */
        .sidebar { 
            width: 300px; background: var(--sidebar); border-right: 1px solid var(--border); 
            padding: 20px; display: flex; flex-direction: column; z-index: 200;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* MAIN CONTENT */
        .main-display { flex: 1; padding: 20px; overflow-y: auto; position: relative; z-index: 10; }
        
        header { 
            background: rgba(30, 41, 59, 0.5); padding: 12px 20px; border-radius: 12px; 
            border-bottom: 2px solid var(--red); margin-bottom: 20px; 
            display: flex; justify-content: space-between; align-items: center;
        }

        /* COURT GRID */
        .courts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .court-card { background: var(--card); border-radius: 15px; padding: 15px; border: 1px solid var(--border); }
        .court-card h3 { text-align: center; color: var(--gold); margin: 0 0 15px 0; font-size: 1.1em; letter-spacing: 2px; }

        /* MATCH ITEM */
        .match-item { 
            background: #0f172a; padding: 12px; border-radius: 10px; margin-bottom: 10px; 
            border-left: 4px solid var(--border);
        }
        .match-live { border-left-color: #10b981; background: rgba(16, 185, 129, 0.05); border: 1px solid #10b981; }
        .team-row { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.1em; margin: 8px 0; }
        .score-display { background: #000; padding: 4px 12px; border-radius: 6px; color: var(--gold); font-family: monospace; }

        /* ADMIN TOOLS */
        .admin-tools { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .score-btn-group { display: flex; align-items: center; justify-content: space-between; background: #000; border-radius: 5px; padding: 3px; border: 1px solid var(--border); }
        .score-btn-group button { background: #1e293b; color: white; border: none; width: 30px; height: 30px; border-radius: 4px; font-size: 18px; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 150; backdrop-filter: blur(4px); }
        input, select { padding: 10px; background: #020617; color: white; border: 1px solid var(--border); border-radius: 6px; width: 100%; margin-bottom: 10px; }
        .btn-sm { padding: 10px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; width: 100%; }
        .hidden { display: none !important; }

        /* MOBILE OVERRIDE */
        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar { position: fixed; top: 0; bottom: 0; left: 0; transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .overlay.show { display: block; }
            .main-display { padding: 10px; margin-top: 50px; }
            header { flex-direction: column; padding: 10px; margin-bottom: 15px; }
            header h1 { font-size: 1em; margin: 0; }
            #clock { font-size: 1.2em; }
        }
    </style>
</head>
<body>

    <div class="mobile-header">
        <span style="color:var(--gold); font-weight:bold;">TEAMY TKD</span>
        <button class="menu-btn" onclick="toggleMenu()">QUẢN LÝ ☰</button>
    </div>
    
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <h2 style="color:var(--gold); text-align:center; margin-top:0;">MENU</h2>
        
        <div id="auth-section">
            <input type="text" id="admin-user" placeholder="Tài khoản">
            <input type="password" id="admin-pass" placeholder="Mật khẩu">
            <button class="btn-sm" style="background:var(--red);" onclick="checkAdmin()">ĐĂNG NHẬP</button>
        </div>

        <div id="admin-menu" class="hidden">
            <button class="btn-sm" style="background:var(--blue); margin-bottom:5px" onclick="openTab('tab-setup')">CÀI ĐẶT</button>
            <button class="btn-sm" style="background:var(--blue); margin-bottom:5px" onclick="openTab('tab-refs')">TRỌNG TÀI</button>
            <button class="btn-sm" style="background:var(--blue); margin-bottom:5px" onclick="openTab('tab-matches')">TRẬN ĐẤU</button>
            <button class="btn-sm" style="background:var(--blue); margin-bottom:15px" onclick="openTab('tab-assign')">PHÂN CÔNG</button>

            <div id="tab-setup" class="tab-content">
                <input type="text" id="input-tournament-name" placeholder="Tên giải">
                <button class="btn-sm" style="background:#10b981" onclick="updateTournamentName()">LƯU TÊN</button>
                <hr style="border:0; border-top:1px solid #334155; margin:15px 0;">
                <input type="text" id="team-name" placeholder="Tên Đơn vị">
                <button class="btn-sm" style="background:var(--blue)" onclick="addTeam()">+ THÊM ĐƠN VỊ</button>
            </div>

            <div id="tab-refs" class="tab-content hidden">
                <input type="text" id="ref-name" placeholder="Tên Trọng tài">
                <select id="ref-team-select"></select>
                <button class="btn-sm" style="background:var(--blue)" onclick="addRef()">LƯU TT</button>
                <div id="ref-list-manage" style="margin-top:10px; font-size:0.8em"></div>
            </div>

            <div id="tab-matches" class="tab-content hidden">
                <select id="m-court"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select>
                <input type="number" id="m-code" placeholder="Số trận">
                <select id="m-type"><option value="Đối kháng">ĐỐI KHÁNG</option><option value="Quyền">BIỂU DIỄN</option></select>
                <input type="text" id="m-title" placeholder="Hạng cân">
                <select id="m-teamA"></select><select id="m-teamB"></select>
                <button class="btn-sm" style="background:var(--red)" onclick="addMatch()">TẠO TRẬN</button>
            </div>

            <div id="tab-assign" class="tab-content hidden">
                <select id="assign-match-select" onchange="setupAssignUI()"></select>
                <button id="btn-auto-assign" class="btn-sm hidden" style="background:var(--blue); margin-bottom:10px" onclick="autoAssign()">⚡ TỰ ĐỘNG</button>
                <div id="manual-selectors"></div>
                <button id="btn-confirm-assign" class="btn-sm hidden" style="background:#10b981; margin-top:10px" onclick="executeAssign()">XÁC NHẬN</button>
            </div>

            <button class="btn-sm" style="background:#334155; margin-top:30px" onclick="logout()">ĐĂNG XUẤT</button>
        </div>
    </aside>

    <main class="main-display">
        <header>
            <h1 id="display-tournament-name">HỆ THỐNG ĐIỀU HÀNH</h1>
            <div id="clock">00:00:00</div>
        </header>
        <div class="courts-grid" id="courts-display"></div>
    </main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", 
        authDomain: "tkdreferee-4fbcc.firebaseapp.com",
        databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tkdreferee-4fbcc",
        appId: "1:17831183248:web:b3400d10be9ff017236915"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let localTeams = {}; let localRefs = {}; let localMatches = {};
    const isAdmin = localStorage.getItem('tkd_admin_login');

    if(isAdmin) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('admin-menu').classList.remove('hidden');
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('show');
        document.getElementById('overlay').classList.toggle('show');
    }

    db.ref('tkd_online_data').on('value', snap => {
        const data = snap.val() || {};
        localTeams = data.teams || {}; localRefs = data.referees || {}; localMatches = data.matches || {};
        document.getElementById('display-tournament-name').innerText = data.tournamentName || "TAEKWONDO";
        renderDisplay();
        if(isAdmin) updateAdminUI();
    });

    function getRefMatchCount(name) {
        return Object.values(localMatches).filter(m => m.assigned && m.assigned.includes(name)).length;
    }

    function renderDisplay() {
        const grid = document.getElementById('courts-display');
        grid.innerHTML = '';
        ["1", "2", "3"].forEach(cNum => {
            const matches = Object.entries(localMatches)
                .filter(([k,m]) => m.court == cNum && m.status !== 'FINISHED')
                .sort((a,b) => (a[1].status === 'LIVE' ? -1 : 1) || a[1].code - b[1].code);

            let html = `<div class="court-card"><h3>SÂN ${cNum}</h3>`;
            html += matches.map(([key, m]) => `
                <div class="match-item ${m.status==='LIVE' ? 'match-live' : ''}">
                    <div style="font-size:0.75em; display:flex; justify-content:space-between; margin-bottom:5px; color:var(--text-muted)">
                        <span>Trận #${m.code}</span><span>${m.title}</span>
                    </div>
                    <div class="team-row">
                        <span style="color:var(--red); flex:1">${m.teamA}</span>
                        <div class="score-display">${m.score1} - ${m.score2}</div>
                        <span style="color:var(--blue); flex:1; text-align:right">${m.teamB}</span>
                    </div>
                    <div style="font-size:0.7em; color:var(--text-muted); line-height:1.2">
                        ${m.assigned || 'Chờ trọng tài...'}
                    </div>
                    ${isAdmin ? `
                        <div class="admin-tools">
                            ${m.status==='WAITING' ? `
                                <button class="btn-sm" style="background:#10b981; grid-column:span 2" onclick="setStatus('${key}','LIVE')">BẮT ĐẦU</button>
                            ` : `
                                <div class="score-btn-group"><button onclick="upScore('${key}',1,-1)">-</button> RED <button onclick="upScore('${key}',1,1)">+</button></div>
                                <div class="score-btn-group"><button onclick="upScore('${key}',2,-1)">-</button> BLU <button onclick="upScore('${key}',2,1)">+</button></div>
                                <button class="btn-sm" style="background:#475569; grid-column:span 2" onclick="setStatus('${key}','FINISHED')">KẾT THÚC</button>
                            `}
                        </div>
                    `:''}
                </div>
            `).join('') || '<div style="text-align:center; color:#444; font-size:0.8em">Trống</div>';
            grid.innerHTML += html + '</div>';
        });
    }

    function checkAdmin() {
        const u = document.getElementById('admin-user').value;
        const p = document.getElementById('admin-pass').value;
        db.ref(`tkd_online_data/accounts/${u}`).once('value', snap => {
            if(snap.val() && String(snap.val().password) === p) {
                localStorage.setItem('tkd_admin_login', 'true');
                location.reload();
            } else alert("Sai tài khoản!");
        });
    }

    function openTab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function upScore(id, team, val) {
        const field = team === 1 ? 'score1' : 'score2';
        db.ref(`tkd_online_data/matches/${id}/${field}`).set(Math.max(0, (localMatches[id][field]||0) + val));
    }

    function setupAssignUI() {
        const mId = document.getElementById('assign-match-select').value;
        if(!mId) return;
        const m = localMatches[mId];
        const count = m.type === "Đối kháng" ? 4 : 5;
        const neutral = Object.entries(localRefs).filter(([id, r]) => r.team !== m.teamA && r.team !== m.teamB);
        let opts = `<option value="">-- Chọn --</option>` + neutral.map(([id, r]) => `<option value="${id}">${r.name} (${getRefMatchCount(r.name)})</option>`).join('');
        let html = '';
        for(let i=0; i<count; i++) html += `<small>${i==0?'TTC':'GĐ'+i}:</small><select id="pos-${i}">${opts}</select>`;
        document.getElementById('manual-selectors').innerHTML = html;
        document.getElementById('btn-confirm-assign').classList.remove('hidden');
        document.getElementById('btn-auto-assign').classList.remove('hidden');
    }

    function autoAssign() {
        const mId = document.getElementById('assign-match-select').value;
        const m = localMatches[mId];
        const count = m.type === "Đối kháng" ? 4 : 5;
        const ids = Object.keys(localRefs).filter(id => localRefs[id].team !== m.teamA && localRefs[id].team !== m.teamB).sort(()=>0.5-Math.random());
        if(ids.length < count) return alert("Không đủ trọng tài!");
        for(let i=0; i<count; i++) document.getElementById(`pos-${i}`).value = ids[i];
    }

    function executeAssign() {
        const mId = document.getElementById('assign-match-select').value;
        const m = localMatches[mId];
        const count = m.type === "Đối kháng" ? 4 : 5;
        let names = [];
        for(let i=0; i<count; i++) {
            let val = document.getElementById(`pos-${i}`).value;
            if(!val) return alert("Thiếu người!");
            names.push(localRefs[val].name);
        }
        const text = m.type === "Đối kháng" ? `TTC: ${names[0]} | GĐ: ${names[1]}, ${names[2]}, ${names[3]}` : `BGĐ: ${names.join(', ')}`;
        db.ref(`tkd_online_data/matches/${mId}/assigned`).set(text).then(()=>alert("Xong!"));
    }

    function setStatus(k, s) { db.ref(`tkd_online_data/matches/${k}/status`).set(s); }
    function logout() { localStorage.removeItem('tkd_admin_login'); location.reload(); }

    function updateAdminUI() {
        const tOpts = Object.values(localTeams).sort().map(t => `<option value="${t}">${t}</option>`).join('');
        document.getElementById('ref-team-select').innerHTML = tOpts;
        document.getElementById('m-teamA').innerHTML = tOpts;
        document.getElementById('m-teamB').innerHTML = tOpts;
        document.getElementById('assign-match-select').innerHTML = '<option value="">-- Chọn trận --</option>' + 
            Object.entries(localMatches).filter(([k,m]) => !m.assigned && m.status!=='FINISHED').map(([k,m]) => `<option value="${k}">Trận ${m.code}</option>`).join('');
        
        document.getElementById('ref-list-manage').innerHTML = Object.entries(localRefs).map(([k,r]) => `
            <div style="display:flex; justify-content:space-between; margin-bottom:4px; padding:5px; background:#000; border-radius:4px;">
                <span>${r.name} (${getRefMatchCount(r.name)} trận)</span>
                <span style="color:red; cursor:pointer" onclick="db.ref('tkd_online_data/referees/${k}').remove()">X</span>
            </div>
        `).join('');
    }

    function updateTournamentName() { db.ref('tkd_online_data/tournamentName').set(document.getElementById('input-tournament-name').value); }
    function addTeam() { 
        let n = document.getElementById('team-name').value;
        if(n) db.ref('tkd_online_data/teams').push(n).then(()=>document.getElementById('team-name').value=''); 
    }
    function addRef() { 
        let n = document.getElementById('ref-name').value, t = document.getElementById('ref-team-select').value;
        if(n && t) db.ref('tkd_online_data/referees').push({name:n, team:t}).then(()=>document.getElementById('ref-name').value=''); 
    }
    function addMatch() {
        db.ref('tkd_online_data/matches').push({
            court: document.getElementById('m-court').value, code: document.getElementById('m-code').value,
            type: document.getElementById('m-type').value, title: document.getElementById('m-title').value,
            teamA: document.getElementById('m-teamA').value, teamB: document.getElementById('m-teamB').value,
            status: 'WAITING', score1: 0, score2: 0, assigned: ""
        }).then(()=>alert("Đã tạo!"));
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('vi-VN'); }, 1000);
</script>
</body>
</html>
