<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG GIẢI THI ĐẤU TAEKWONDO</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --red: #e11d48; --blue: #2563eb; --gold: #fbbf24; --bg: #050a15; --card: #111827; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; color: white; }
        
        header { 
            background: #000; padding: 10px 20px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 3px solid var(--red); position: sticky; top: 0; z-index: 1000;
        }
        .t-name { text-align: center; flex: 2; }
        .t-name h1 { margin: 0; font-size: 1.6em; text-transform: uppercase; color: #fff; letter-spacing: 1px; }

        .container { padding: 20px; max-width: 1600px; margin: 0 auto; }
        .courts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 25px; }
        
        .court-card { background: var(--card); border-radius: 15px; padding: 20px; border: 1px solid #1f2937; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .court-card h3 { text-align: center; color: var(--gold); margin-top: 0; border-bottom: 2px solid #374151; padding-bottom: 10px; }
        
        .match-item { background: #1f2937; padding: 15px; border-radius: 10px; margin-bottom: 12px; border-left: 5px solid #4b5563; position: relative; transition: 0.3s; }
        .match-waiting { opacity: 0.9; border-left-color: #6b7280; }
        .match-live { border-left-color: #10b981; background: #064e3b; transform: scale(1.02); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }
        .match-finished { opacity: 0.4; border-left-color: #111827; background: #0b0f19; filter: grayscale(0.8); }
        
        .status-tag { font-size: 0.7em; padding: 3px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .tag-waiting { background: #4b5563; }
        .tag-live { background: #10b981; color: #000; animation: blink 1.5s infinite; }
        .tag-finished { background: #000; color: #6b7280; border: 1px solid #374151; }

        .admin-box { background: #000; border-radius: 12px; padding: 20px; margin-bottom: 30px; border: 1px solid var(--red); display: none; }
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: #374151; color: white; border-radius: 8px; white-space: nowrap; font-weight: bold; }
        .tab-btn.active { background: var(--red); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        input, select { padding: 10px; background: #111827; color: white; border: 1px solid #374151; border-radius: 6px; }
        
        .team-badge { background: #374151; padding: 5px 10px; border-radius: 5px; margin: 3px; display: inline-flex; align-items: center; font-size: 0.85em; }
        .btn-del { color: #f87171; margin-left: 8px; cursor: pointer; font-weight: bold; }

        @keyframes blink { 50% { opacity: 0.6; } }
        .btn-sm { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white; }
    </style>
</head>
<body>

<header>
    <div style="flex:1">
        <h2 style="margin:0; font-size: 1.1em; color: var(--gold);">HỆ THỐNG GIẢI THI ĐẤU TAEKWONDO</h2>
        <small style="color: #10b981;">● Online System</small>
    </div>
    <div class="t-name">
        <h1 id="display-tournament-name">HỆ THỐNG ĐIỀU HÀNH GIẢI ĐẤU</h1>
    </div>
    <div id="auth-area" style="flex:1; text-align:right;">
        <input type="text" id="admin-user" placeholder="User" style="width:60px;">
        <input type="password" id="admin-pass" placeholder="Pass" style="width:60px;">
        <button class="btn-sm" style="background:var(--red)" onclick="checkAdmin()">LOGIN</button>
    </div>
    <div id="admin-info" class="hidden" style="flex:1; text-align:right;">
        <button class="btn-sm" style="background:var(--red)" onclick="logout()">THOÁT ADMIN</button>
    </div>
</header>

<div class="container">
    <div id="admin-panel" class="admin-box">
        <div class="tab-menu">
            <button class="tab-btn active" onclick="openTab(event, 'tab-setup')">1. THIẾT LẬP GIẢI</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-refs')">2. TRỌNG TÀI</button>
            <button class="tab-btn" onclick="openTab(event, 'tab-matches')">3. TRẬN ĐẤU</button>
            <button class="tab-btn" style="background:#059669" onclick="openTab(event, 'tab-assign')">4. PHÂN CÔNG TT</button>
        </div>

        <div id="tab-setup" class="tab-content active">
            <div class="form-group" style="background:#1e1b4b; padding:15px; border-radius:10px;">
                <input type="text" id="input-tournament-name" placeholder="Tên giải đấu chuyên nghiệp..." style="flex:1">
                <button class="btn-sm" style="background:#10b981" onclick="updateTournamentName()">CẬP NHẬT TÊN GIẢI</button>
            </div>
            <div class="form-group">
                <input type="text" id="team-name" placeholder="Tên CLB/Đơn vị mới">
                <button class="btn-sm" style="background:var(--blue)" onclick="addTeam()">+ THÊM ĐƠN VỊ</button>
            </div>
            <div id="list-teams"></div>
        </div>

        <div id="tab-refs" class="tab-content">
            <div class="form-group">
                <input type="text" id="ref-name" placeholder="Họ tên Trọng tài">
                <select id="ref-team-select"></select>
                <select id="ref-type">
                    <option value="Đối kháng">Đối kháng (CR/Judge)</option>
                    <option value="Quyền">Quyền (3-5 TT)</option>
                </select>
                <button class="btn-sm" style="background:var(--blue)" onclick="addRef()">+ THÊM</button>
            </div>
            <div style="max-height: 300px; overflow-y: auto;">
                <table width="100%" border="1" style="border-collapse:collapse; border-color:#374151">
                    <thead><tr><th>Tên</th><th>Đơn vị</th><th>Loại</th><th>Trận</th><th>Xóa</th></tr></thead>
                    <tbody id="ref-table-body" style="text-align:center"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-matches" class="tab-content">
            <div class="form-group">
                <select id="m-court"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select>
                <input type="text" id="m-code" placeholder="Trận số" style="width:70px;">
                <select id="m-type" style="background: #1e1b4b; font-weight:bold;">
                    <option value="Đối kháng">ĐỐI KHÁNG</option>
                    <option value="Quyền">QUYỀN</option>
                </select>
                <input type="text" id="m-title" placeholder="Hạng cân / Nội dung">
                <select id="m-teamA"></select> <b>VS</b> <select id="m-teamB"></select>
                <button class="btn-sm" style="background:var(--red)" onclick="addMatch()">TẠO TRẬN ĐẤU</button>
            </div>
        </div>

        <div id="tab-assign" class="tab-content">
            <div class="form-group">
                <select id="assign-match-select" style="min-width: 300px;"></select>
                <button class="btn-sm" style="background:#10b981" onclick="handleAssign()">PHÂN CÔNG TỰ ĐỘNG</button>
            </div>
            <p style="font-size:0.85em; color:var(--gold)">* Hệ thống tự động chọn 3 TT (Đối kháng) hoặc 5 TT (Quyền) dựa trên thiết lập lúc tạo Trận đấu.</p>
        </div>
    </div>

    <div class="courts-grid" id="courts-display"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", 
        authDomain: "tkdreferee-4fbcc.firebaseapp.com",
        databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tkdreferee-4fbcc",
        appId: "1:17831183248:web:b3400d10be9ff017236915"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let localTeams = {}; let localRefs = {}; let localMatches = {};
    if(localStorage.getItem('tkd_admin_login')) showAdmin();

    db.ref('tkd_online_data').on('value', snap => {
        const data = snap.val() || {};
        localTeams = data.teams || {};
        localRefs = data.referees || {};
        localMatches = data.matches || {};
        
        document.getElementById('display-tournament-name').innerText = data.tournamentName || "HỆ THỐNG ĐIỀU HÀNH GIẢI ĐẤU";
        document.getElementById('input-tournament-name').value = data.tournamentName || "";
        
        renderAll();
    });

    function updateTournamentName() {
        const name = document.getElementById('input-tournament-name').value.trim();
        if(name) db.ref('tkd_online_data/tournamentName').set(name);
    }

    function addTeam() {
        const name = document.getElementById('team-name').value.trim();
        if(name) db.ref('tkd_online_data/teams').push(name).then(() => document.getElementById('team-name').value = '');
    }

    function deleteTeam(key) { if(confirm("Xóa CLB này?")) db.ref(`tkd_online_data/teams/${key}`).remove(); }

    function addRef() {
        const name = document.getElementById('ref-name').value.trim();
        const team = document.getElementById('ref-team-select').value;
        const type = document.getElementById('ref-type').value;
        if(name && team) db.ref('tkd_online_data/referees').push({ name, team, type, total: 0 });
    }

    function deleteRef(key) { if(confirm("Xóa trọng tài này?")) db.ref(`tkd_online_data/referees/${key}`).remove(); }

    function addMatch() {
        const m = {
            court: document.getElementById('m-court').value,
            code: document.getElementById('m-code').value || "00",
            type: document.getElementById('m-type').value, // Quyền hoặc Đối kháng
            title: document.getElementById('m-title').value,
            teamA: document.getElementById('m-teamA').value,
            teamB: document.getElementById('m-teamB').value,
            score1: 0, score2: 0, status: 'WAITING', assigned: ""
        };
        db.ref('tkd_online_data/matches').push(m);
    }

    function updateMatchStatus(key, status) {
        // KIỂM TRA CHỐNG TRÙNG SÂN KHI BẤM BẮT ĐẦU
        if(status === 'LIVE') {
            const court = localMatches[key].court;
            const hasLiveMatch = Object.values(localMatches).some(m => String(m.court) === String(court) && m.status === 'LIVE');
            
            if(hasLiveMatch) {
                alert(`⛔ LỖI HỆ THỐNG:\nSân ${court} đang có trận thi đấu chưa kết thúc.\nVui lòng kết thúc trận hiện tại trước khi gọi VĐV trận mới vào thảm!`);
                return;
            }
        }
        db.ref(`tkd_online_data/matches/${key}/status`).set(status);
    }

    function handleAssign() {
        const key = document.getElementById('assign-match-select').value;
        if(!key) return alert("Hãy chọn trận đấu!");
        
        const m = localMatches[key];
        
        // Nhận diện số lượng TT dựa vào loại hình đã chọn lúc tạo trận
        const isQuyen = (m.type === "Quyền") || (m.title && m.title.toUpperCase().includes("QUYỀN"));
        const required = isQuyen ? 5 : 3;

        let eligible = Object.entries(localRefs)
            .filter(([id, r]) => r.team !== m.teamA && r.team !== m.teamB)
            .map(([id, r]) => ({id, ...r}))
            .sort((a,b) => (a.total || 0) - (b.total || 0));

        if(eligible.length < required) return alert(`Không đủ TT trung lập (Cần ${required} người cho nội dung ${isQuyen ? 'Quyền' : 'Đối kháng'})!`);

        const selected = eligible.slice(0, required);
        const refString = isQuyen ? `TT Quyền: ${selected.map(s => s.name).join(', ')}` : `TTC: ${selected[0].name} | Giám định: ${selected[1].name}, ${selected[2].name}`;

        let updates = {};
        updates[`tkd_online_data/matches/${key}/assigned`] = refString;
        selected.forEach(s => {
            updates[`tkd_online_data/referees/${s.id}/total`] = (s.total || 0) + 1;
        });
        db.ref().update(updates).then(() => alert("Đã phân công thành công!"));
    }

    function renderAll() {
        document.getElementById('list-teams').innerHTML = Object.entries(localTeams).map(([k, v]) => 
            `<span class="team-badge">${v} <b class="btn-del" onclick="deleteTeam('${k}')">×</b></span>`
        ).join('');

        const teamOpts = `<option value="">-- Chọn đơn vị --</option>` + Object.values(localTeams).map(t => `<option value="${t}">${t}</option>`).join('');
        document.getElementById('ref-team-select').innerHTML = teamOpts;
        document.getElementById('m-teamA').innerHTML = teamOpts;
        document.getElementById('m-teamB').innerHTML = teamOpts;

        document.getElementById('ref-table-body').innerHTML = Object.entries(localRefs).map(([k, r]) => 
            `<tr><td>${r.name}</td><td>${r.team}</td><td>${r.type}</td><td>${r.total || 0}</td><td><button onclick="deleteRef('${k}')">X</button></td></tr>`
        ).join('');

        document.getElementById('assign-match-select').innerHTML = `<option value="">-- Chọn trận chưa đấu --</option>` + 
            Object.entries(localMatches).filter(([k,m]) => m.status !== 'FINISHED').map(([k,m]) => `<option value="${k}">[Sân ${m.court}] #${m.code} - ${m.teamA} vs ${m.teamB}</option>`).join('');

        const grid = document.getElementById('courts-display');
        grid.innerHTML = '';
        
        // SẮP XẾP TRẬN ĐẤU: LIVE lên đầu (1) -> WAITING (2) -> FINISHED xuống cuối (3)
        const statusWeight = { 'LIVE': 1, 'WAITING': 2, 'FINISHED': 3 };

        ["1", "2", "3"].forEach(cNum => {
            const matches = Object.entries(localMatches)
                .filter(([k,m]) => m.court == cNum)
                .sort((a,b) => {
                    const weightA = statusWeight[a[1].status] || 2;
                    const weightB = statusWeight[b[1].status] || 2;
                    
                    if(weightA !== weightB) return weightA - weightB;
                    
                    // Cùng trạng thái thì xếp theo số thứ tự trận
                    return String(a[1].code).localeCompare(String(b[1].code), undefined, {numeric: true});
                });
            
            let courtHtml = `<div class="court-card"><h3>SÂN ${cNum}</h3>`;
            courtHtml += matches.map(([key, m]) => {
                const sClass = m.status === 'LIVE' ? 'match-live' : (m.status === 'FINISHED' ? 'match-finished' : 'match-waiting');
                const sTag = m.status === 'LIVE' ? 'tag-live' : (m.status === 'FINISHED' ? 'tag-finished' : 'tag-waiting');
                const sText = m.status === 'LIVE' ? 'Đang thi đấu' : (m.status === 'FINISHED' ? 'Đã kết thúc' : 'Sắp diễn ra');
                const mType = m.type || (m.title && m.title.toUpperCase().includes("QUYỀN") ? "Quyền" : "Đối kháng");

                return `
                <div class="match-item ${sClass}">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="status-tag ${sTag}">${sText}</span>
                        <span style="background:#000; color:var(--gold); padding:2px 8px; border-radius:4px; font-weight:bold;">Trận #${m.code}</span>
                    </div>
                    
                    <div style="font-size:0.85em; color:var(--gold); margin: 8px 0;">
                        <span style="background:#374151; padding:2px 6px; border-radius:4px; margin-right:5px;">${mType}</span>
                        ${m.title}
                    </div>
                    
                    <div style="display:flex; justify-content:space-between; align-items:center; font-weight:bold; font-size:1.15em;">
                        <span style="color:var(--red); width:40%;">${m.teamA}</span>
                        <span style="background:#000; padding:2px 10px; border-radius:4px;">${m.score1} - ${m.score2}</span>
                        <span style="color:var(--blue); width:40%; text-align:right;">${m.teamB}</span>
                    </div>
                    
                    <div style="font-size:0.75em; color:#9ca3af; margin-top:10px; border-top:1px solid #374151; padding-top:6px;">
                        ${m.assigned ? '👤 ' + m.assigned : '<b style="color:var(--gold)">⚠️ Chưa phân công TT</b>'}
                    </div>
                    
                    ${localStorage.getItem('tkd_admin_login') && m.status !== 'FINISHED' ? `
                    <div style="margin-top:12px; display:flex; gap:8px;">
                        ${m.status === 'WAITING' ? `<button class="btn-sm" style="background:#10b981; font-size:0.75em; flex:1;" onclick="updateMatchStatus('${key}','LIVE')">▶ BẮT ĐẦU</button>` : ''}
                        ${m.status === 'LIVE' ? `<button class="btn-sm" style="background:#4b5563; font-size:0.75em; flex:1;" onclick="updateMatchStatus('${key}','FINISHED')">⏹ KẾT THÚC</button>` : ''}
                    </div>` : ''}
                </div>`;
            }).join('') || '<p style="color:#4b5563; text-align:center; font-style:italic;">Sân đang trống</p>';
            grid.innerHTML += courtHtml + '</div>';
        });
    }

    function checkAdmin() {
        const u = document.getElementById('admin-user').value;
        const p = document.getElementById('admin-pass').value;
        db.ref(`tkd_online_data/accounts/${u}`).once('value', snap => {
            const acc = snap.val();
            if(acc && String(acc.password) === p) {
                localStorage.setItem('tkd_admin_login', 'true');
                showAdmin();
            } else alert("Sai thông tin quản trị!");
        });
    }
    function showAdmin() {
        document.getElementById('auth-area').classList.add('hidden');
        document.getElementById('admin-info').classList.remove('hidden');
        document.getElementById('admin-panel').style.display = 'block';
    }
    function logout() { localStorage.removeItem('tkd_admin_login'); location.reload(); }
    function openTab(evt, name) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        evt.currentTarget.classList.add('active');
    }
</script>
</body>
</html>
