<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEAMY TKD V29 - PRO MANAGEMENT</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #e11d48; --blue: #2563eb; --gold: #f59e0b; --bg: #020617; --card: #1e293b; --text: #f8fafc; --border: #334155; --success: #10b981; }
        * { box-sizing: border-box; font-family: 'Roboto', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); margin: 0; color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 380px; background: #0f172a; border-right: 1px solid var(--border); padding: 15px; overflow-y: auto; transition: left 0.3s ease; z-index: 1000; }
        .main { flex: 1; padding: 15px; overflow-y: auto; background: radial-gradient(circle at top right, #1e293b, #020617); position: relative; }
        .menu-toggle { display: none; position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; background: var(--blue); color: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 1100; font-size: 24px; cursor: pointer; }

        @media (max-width: 850px) {
            .sidebar { position: fixed; left: -100%; height: 100%; width: 90%; max-width: 400px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
            .sidebar.active { left: 0; }
            .menu-toggle { display: block; }
            .main { padding: 10px; padding-bottom: 90px; }
        }

        .header-center { text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
        .header-center h2 { font-family: 'Oswald', sans-serif; font-size: 28px; color: var(--gold); margin: 0; text-transform: uppercase; }
        .header-center p { font-size: 14px; color: #cbd5e1; margin: 5px 0 0; letter-spacing: 2px; }

        .panel { display: none; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-top: 10px; }
        .panel.active { display: block; }
        .tab-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 10px; }
        .tab-btn { padding: 12px 0; font-size: 11px; cursor: pointer; background: var(--card); color: white; border: 1px solid var(--border); border-radius: 4px; font-weight: bold; text-transform: uppercase; }
        .tab-btn.active { background: var(--blue); border-color: var(--blue); }
        
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 8px; background: #000; color: white; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        .btn { padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; width: 100%; color: white; margin-bottom: 5px; }

        .court-card { background: rgba(15, 23, 42, 0.8); border-radius: 12px; padding: 12px; border: 1px solid var(--border); margin-bottom: 25px; }
        .match-box { border-radius: 10px; padding: 10px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .match-live { border: 2px solid var(--success); background: linear-gradient(145deg, #064e3b, #022c22); }
        .match-wait { border-left: 6px solid var(--gold); background: #1e293b; }
        .match-done { border-left: 6px solid #475569; background: #0f172a; opacity: 0.8; }
        
        .live-grid { display: grid; grid-template-columns: 100px 1fr 100px; gap: 10px; align-items: center; text-align: center; }
        .btn-point { padding: 15px 0; font-size: 18px; border-radius: 8px; font-weight: 900; }
        
        .match-grid { display: grid; grid-template-columns: 1fr 60px 1fr; align-items: center; text-align: center; }
        .team-name { font-size: 15px; font-weight: 900; text-transform: uppercase; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;}
        .score-box { font-size: 32px; font-weight: 900; color: var(--gold); background: rgba(0,0,0,0.4); border-radius: 6px; padding: 5px 0; }
        
        .ref-display-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 10px; border-top: 1px dashed #444; padding-top: 10px; }
        .ref-tag { font-size: 10px; color: #cbd5e1; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 4px; line-height: 1.3; }
        .ref-unit { color: #a78bfa; font-size: 9px; font-weight: bold; }
        
        .badge { position: absolute; top: 5px; left: 10px; font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .data-list { max-height: 350px; overflow-y: auto; background: #000; padding: 5px; border-radius: 6px;}
        .data-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #334155; font-size: 12px; gap: 10px;}
        .data-info { flex: 1; }
        .data-actions { display: flex; gap: 5px; }
        .btn-edit { background: var(--gold); color: black; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; }
        .btn-del { background: var(--red); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; }
    </style>
</head>
<body>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<aside class="sidebar" id="sidebar">
    <div style="display:flex; justify-content:space-between; align-items:center">
        <h3 style="color:var(--gold); margin:0">ĐIỀU HÀNH TKD V29</h3>
        <button id="btn-logout" style="display:none; background:transparent; border:1px solid var(--red); color:var(--red); padding:4px 8px; border-radius:4px; cursor:pointer" onclick="logout()">Thoát</button>
    </div>
    
    <div id="auth-box" style="margin-top:20px"><input type="password" id="pass" placeholder="Mã PIN"><button class="btn" style="background:var(--red)" onclick="login()">VÀO HỆ THỐNG</button></div>
    
    <div id="admin-ui" style="display:none">
        <div class="tab-grid">
            <button class="tab-btn active" onclick="showTab(0)">NHẬP</button>
            <button class="tab-btn" onclick="showTab(1)">TRẬN</button>
            <button class="tab-btn" onclick="showTab(2)">TTÀI</button>
            <button class="tab-btn" onclick="showTab(3)">DATA</button>
        </div>

        <div class="panel active">
            <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #444">
                <input type="text" id="info-name" placeholder="Tên giải đấu">
                <input type="text" id="info-date" placeholder="Thời gian">
                <button class="btn" style="background:#475569" onclick="saveInfo()">CẬP NHẬT TIÊU ĐỀ GIẢI</button>
            </div>
            <textarea id="bulk-vdv" rows="4" placeholder="Đơn vị [Tab] Tên [Tab] Nội dung [Tab] Tuổi"></textarea>
            <button class="btn" style="background:var(--success)" onclick="processBulk('vdv')">LƯU VĐV & CLB</button>
            <textarea id="bulk-ref" rows="3" style="margin-top:10px" placeholder="Đơn vị [Tab] Tên"></textarea>
            <button class="btn" style="background:var(--blue)" onclick="processBulk('ref')">LƯU TRỌNG TÀI</button>
        </div>

        <div class="panel">
            <h4 style="color:white; margin:0 0 10px 0; border-bottom:1px solid #444; padding-bottom:5px">TẠO TRẬN THỦ CÔNG</h4>
            <div style="display:flex; gap:5px">
                <select id="m-court" style="flex:1"><option value="1">Sân 1</option><option value="2">Sân 2</option><option value="3">Sân 3</option></select>
                <input type="number" id="m-code" placeholder="Mã trận" style="flex:1">
            </div>
            <select id="m-type" onchange="updateCategoryFilter('manual')">
                <option value="Đối kháng">Nội dung: ĐỐI KHÁNG</option>
                <option value="Quyền">Nội dung: QUYỀN (Poomsae)</option>
            </select>
            <select id="m-title-select" onchange="syncPlayers(1); syncPlayers(2);"></select>
            <select id="m-age-select" onchange="syncPlayers(1); syncPlayers(2);"></select>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
                <div style="border: 1px solid var(--red); padding: 5px; border-radius: 5px">
                    <label style="font-size:10px; color:var(--red); font-weight:bold">BÊN ĐỎ (CLB):</label>
                    <select id="m-teamA" onchange="syncPlayers(1)"></select>
                    <select id="m-vA"></select>
                </div>
                <div style="border: 1px solid var(--blue); padding: 5px; border-radius: 5px">
                    <label style="font-size:10px; color:var(--blue); font-weight:bold">BÊN XANH (CLB):</label>
                    <select id="m-teamB" onchange="syncPlayers(2)"></select>
                    <select id="m-vB"></select>
                </div>
            </div>
            <button class="btn" style="background:var(--red); margin-top:10px" onclick="saveMatch()">TẠO TRẬN ĐẤU MỚI</button>

            <div style="margin-top: 20px; background: rgba(245, 158, 11, 0.1); padding: 10px; border-radius: 8px; border: 1px dashed var(--gold);">
                <h4 style="color:var(--gold); margin:0 0 10px 0;">🎲 TỰ ĐỘNG BỐC THĂM</h4>
                <select id="draw-type" onchange="updateCategoryFilter('draw')">
                    <option value="Đối kháng">ĐỐI KHÁNG</option>
                    <option value="Quyền">QUYỀN</option>
                </select>
                <select id="draw-cat"><option value="">-- Chọn Nội dung --</option></select>
                <select id="draw-age"><option value="">-- Chọn Lứa tuổi --</option></select>
                <select id="draw-court"><option value="1">Đẩy vào Sân 1</option><option value="2">Đẩy vào Sân 2</option><option value="3">Đẩy vào Sân 3</option></select>
                <button class="btn" style="background:var(--gold); color:black; margin-bottom:0" onclick="generateBracket()">TẠO SƠ ĐỒ THI ĐẤU</button>
            </div>
            
            <button class="btn" style="background:var(--success); margin-top:15px; border: 2px solid white;" onclick="printBracket()">🖨️ XUẤT LỊCH THI ĐẤU (IN ẤN)</button>
        </div>

        <div class="panel">
            <button class="btn" style="background:var(--red)" onclick="autoAssignAll()">⚡ BỐC THĂM TỰ ĐỘNG TẤT CẢ</button>
            <hr style="border-color:#444">
            <label style="font-size:11px">CHỌN TRẬN ĐỂ PHÂN CÔNG TAY:</label>
            <select id="assign-m" onchange="prepAssign()"></select>
            <div id="ref-slots" style="max-height: 250px; overflow-y: auto;"></div>
            <button id="btn-save-ref" class="btn" style="background:var(--success); display:none; margin-top:10px" onclick="saveAssign()">LƯU PHÂN CÔNG</button>
        </div>

        <div class="panel">
            <select id="data-type-select" onchange="renderDataList()">
                <option value="athletes">Vận Động Viên</option>
                <option value="refs">Trọng Tài</option>
            </select>
            <select id="filter-data" onchange="renderDataList()"></select>
            <div id="data-list-container" class="data-list"></div>
            <button class="btn" style="background:#b91c1c; margin-top:20px" onclick="factoryReset()">⚠️ XÓA TRẮNG DỮ LIỆU GIẢI</button>
        </div>
    </div>
</aside>

<main class="main">
    <div class="header-center">
        <h2 id="display-t-name">ĐANG TẢI...</h2>
        <p id="display-t-date">--/--/2026</p>
    </div>
    <div id="grid-system" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap:20px;"></div>
</main>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDZvdUTZ_qskHjTBwEvRF3bfw_FiTDUrog", 
    authDomain: "tkdreferee-4fbcc.firebaseapp.com",
    databaseURL: "https://tkdreferee-4fbcc-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "tkdreferee-4fbcc",
    appId: "1:17831183248:web:b3400d10be9ff017236915"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let st = { athletes: {}, refs: {}, matches: {}, info: {} };
const isLogged = localStorage.getItem('tkd_admin') === 'true';

if(isLogged) {
    document.getElementById('auth-box').style.display = 'none';
    document.getElementById('admin-ui').style.display = 'block';
    document.getElementById('btn-logout').style.display = 'block';
}

db.ref('tkd_online_data').on('value', snap => {
    const v = snap.val() || {};
    st.athletes = v.athletes || {}; st.refs = v.refs || {}; st.matches = v.matches || {}; 
    st.info = v.info || { name: "GIẢI VÔ ĐỊCH TAEKWONDO", date: "2026" };
    document.getElementById('display-t-name').innerText = st.info.name;
    document.getElementById('display-t-date').innerText = st.info.date;
    renderBoard();
    if(isLogged) { updateUI(); renderDataList(); }
});

function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
function logout() { localStorage.removeItem('tkd_admin'); location.reload(); }
function saveInfo() { db.ref('tkd_online_data/info').set({ name: document.getElementById('info-name').value, date: document.getElementById('info-date').value }); alert("Đã cập nhật!"); }

function updateUI() {
    const athleteTeams = new Set();
    Object.values(st.athletes).forEach(a => athleteTeams.add(a.team));
    const teamOpts = `<option value="">-- Lọc Đơn vị --</option>` + Array.from(athleteTeams).sort().map(t=>`<option value="${t}">${t}</option>`).join('');
    if(!document.getElementById('m-teamA').value) document.getElementById('m-teamA').innerHTML = teamOpts;
    if(!document.getElementById('m-teamB').value) document.getElementById('m-teamB').innerHTML = teamOpts;
    if(!document.getElementById('filter-data').value) document.getElementById('filter-data').innerHTML = teamOpts;

    updateCategoryFilter('manual'); 
    updateCategoryFilter('draw');

    const unassigned = Object.entries(st.matches).filter(([k,m]) => m.status !== 'DONE');
    document.getElementById('assign-m').innerHTML = `<option value="">-- Mã trận --</option>` + 
        unassigned.sort((a,b)=>a[1].code - b[1].code).map(([k,m]) => `<option value="${k}">SÂN ${m.court} - TRẬN ${m.code}</option>`).join('');
}

function updateCategoryFilter(mode) {
    const prefix = mode === 'manual' ? 'm' : 'draw';
    const typeId = mode === 'manual' ? 'm-type' : 'draw-type';
    const type = document.getElementById(typeId).value;
    const cats = new Set(), ages = new Set();
    
    Object.values(st.athletes).forEach(a => {
        const isPoomsae = a.cat.toLowerCase().includes("quyền") || a.cat.toLowerCase().includes("poomsae");
        if(type === "Quyền" && isPoomsae) cats.add(a.cat);
        if(type === "Đối kháng" && !isPoomsae) cats.add(a.cat);
        ages.add(a.age);
    });

    document.getElementById(prefix + (mode==='manual'?'-title-select':'-cat')).innerHTML = `<option value="">-- Nội dung --</option>` + Array.from(cats).sort().map(c => `<option value="${c}">${c}</option>`).join('');
    document.getElementById(prefix + '-age' + (mode==='manual'?'-select':'')).innerHTML = `<option value="">-- Lứa tuổi --</option>` + Array.from(ages).sort().map(a => `<option value="${a}">${a}</option>`).join('');
}

function syncPlayers(side) {
    const team = document.getElementById(side===1?'m-teamA':'m-teamB').value;
    if(!team) return;
    const cat = document.getElementById('m-title-select').value;
    const age = document.getElementById('m-age-select').value;
    let list = Object.values(st.athletes).filter(a => a.team === team && (!cat || a.cat === cat) && (!age || a.age === age));
    document.getElementById(side===1?'m-vA':'m-vB').innerHTML = list.map(a=>`<option value="${a.name}">${a.name}</option>`).join('');
}

async function generateBracket() {
    const cat = document.getElementById('draw-cat').value;
    const age = document.getElementById('draw-age').value;
    const court = document.getElementById('draw-court').value;
    const type = document.getElementById('draw-type').value;
    
    if(!cat || !age) return alert("Vui lòng chọn Nội dung và Lứa tuổi để bốc thăm!");

    let athletes = Object.values(st.athletes).filter(a => a.cat === cat && a.age === age);
    if(athletes.length < 2) return alert("Không đủ VĐV ở nội dung này để tạo sơ đồ (cần ít nhất 2 người)!");

    for (let i = athletes.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [athletes[i], athletes[j]] = [athletes[j], athletes[i]];
    }

    let matchCodeStart = prompt("Nhập mã trận bắt đầu cho sơ đồ này (VD: 10):", "1");
    if(!matchCodeStart) return;
    let code = parseInt(matchCodeStart);

    let matchesCreated = 0;
    for(let i = 0; i < athletes.length; i+=2) {
        if(i + 1 < athletes.length) {
            const m = { 
                court: court, code: code++, type: type, title: cat, age: age, 
                teamA: athletes[i].team, athleteA: athletes[i].name, 
                teamB: athletes[i+1].team, athleteB: athletes[i+1].name, 
                score1:0, score2:0, status:'WAIT' 
            };
            await db.ref('tkd_online_data/matches').push(m);
            matchesCreated++;
        } else {
            alert(`LƯU Ý: VĐV ${athletes[i].name} (${athletes[i].team}) bị dôi ra (Bye), sẽ được đặc cách vào thẳng vòng trong.`);
        }
    }
    alert(`Hoàn tất! Đã bốc thăm và tạo ${matchesCreated} trận đấu vòng loại trực tiếp vào Sân ${court}.`);
}

// === TÍNH NĂNG MỚI: XUẤT LỊCH THI ĐẤU (HTML/PRINT) ===
function printBracket() {
    if(Object.keys(st.matches).length === 0) return alert("Chưa có trận đấu nào được tạo!");

    let grouped = {};
    Object.values(st.matches).forEach(m => {
        let key = `${m.type} | NỘI DUNG: ${m.title} | LỨA TUỔI: ${m.age}`;
        if(!grouped[key]) grouped[key] = [];
        grouped[key].push(m);
    });

    let html = `
    <html>
    <head>
        <title>Sơ đồ / Lịch thi đấu - ${st.info.name}</title>
        <style>
            body { font-family: 'Arial', sans-serif; padding: 20px; max-width: 900px; margin: auto; }
            .header-print { text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
            h1 { color: #b91c1c; text-transform: uppercase; margin: 0; font-size: 24px;}
            h2 { background: #f1f5f9; padding: 10px; border-left: 6px solid #2563eb; margin-top: 30px; font-size: 16px; text-transform: uppercase;}
            .match-row { display: flex; justify-content: space-between; padding: 10px 5px; border-bottom: 1px dashed #ccc; align-items: center; font-size: 14px;}
            .team { font-weight: bold; font-size: 16px; display: block;}
            .athlete { font-size: 13px; color: #555; }
            .red-side { color: #e11d48; text-align: right; flex: 1; padding-right: 20px;}
            .blue-side { color: #2563eb; text-align: left; flex: 1; padding-left: 20px;}
            .vs { width: 40px; text-align: center; font-weight: bold; background: #eee; border-radius: 4px; padding: 5px; font-size: 12px;}
            .match-info { width: 120px; font-weight: bold; color: #333;}
            .btn-print { padding: 12px 25px; background: #10b981; color: white; border: none; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 5px; margin-bottom: 20px; display: block; width: 100%; text-align: center;}
            @media print { .btn-print { display: none; } body { padding: 0; } }
        </style>
    </head>
    <body>
        <button class="btn-print" onclick="window.print()">🖨️ BẤM VÀO ĐÂY ĐỂ IN HOẶC LƯU FILE PDF</button>
        <div class="header-print">
            <h1>${st.info.name}</h1>
            <p>LỊCH THI ĐẤU DỰ KIẾN - CẬP NHẬT NGÀY: ${new Date().toLocaleDateString('vi-VN')}</p>
        </div>
    `;

    Object.keys(grouped).sort().forEach(key => {
        html += `<h2>${key}</h2>`;
        grouped[key].sort((a,b) => a.code - b.code).forEach(m => {
            html += `<div class="match-row">
                <div class="match-info">Trận ${m.code} <br><span style="font-weight:normal; font-size:12px">(Sân ${m.court})</span></div>
                <div class="red-side">
                    <span class="team">${m.teamA}</span>
                    <span class="athlete">${m.athleteA}</span>
                </div>
                <div class="vs">VS</div>
                <div class="blue-side">
                    <span class="team">${m.teamB}</span>
                    <span class="athlete">${m.athleteB}</span>
                </div>
            </div>`;
        });
    });

    html += `</body></html>`;
    
    let win = window.open('', '_blank');
    win.document.write(html);
    win.document.close();
}

function prepAssign() {
    const mid = document.getElementById('assign-m').value; if(!mid) return;
    const m = st.matches[mid];
    const nr = Object.entries(st.refs).filter(([k,r]) => r.team !== m.teamA && r.team !== m.teamB);
    const opts = `<option value="">-- Chọn Trọng Tài --</option>` + nr.map(([k,r]) => `<option value="${r.name}">${r.name} (${r.team})</option>`).join('');
    
    let html = '';
    const labels = m.type === "Quyền" ? ["GĐ1", "GĐ2", "GĐ3", "GĐ4", "GĐ5"] : ["TTC", "GĐ1", "GĐ2", "GĐ3"];
    
    labels.forEach((lb, i) => {
        html += `<label style="font-size:10px;color:var(--gold);margin-top:5px;display:block">${lb}</label>
                 <select id="s-ref-${i}" class="ref-sel-box">${opts}</select>`;
    });
    document.getElementById('ref-slots').innerHTML = html;
    document.getElementById('btn-save-ref').style.display = 'block';
}

function saveAssign() {
    const mid = document.getElementById('assign-m').value;
    const m = st.matches[mid];
    const labels = m.type === "Quyền" ? ["GĐ1", "GĐ2", "GĐ3", "GĐ4", "GĐ5"] : ["TTC", "GĐ1", "GĐ2", "GĐ3"];
    const ass = [];
    labels.forEach((lb, i) => {
        const val = document.getElementById(`s-ref-${i}`).value;
        if(val) ass.push(`${lb}: ${val}`);
    });
    db.ref(`tkd_online_data/matches/${mid}/assigned`).set(ass.join(" | "));
    alert("Đã lưu phân công!");
}

function renderBoard() {
    const grid = document.getElementById('grid-system'); grid.innerHTML = '';
    ["1","2","3"].forEach(sn => {
        const ms = Object.entries(st.matches).filter(([k,m]) => m.court == sn);
        let html = `<div class="court-card"><div style="background:var(--card);text-align:center;padding:8px;border-radius:6px;margin-bottom:12px;font-weight:bold;font-size:18px;border:1px solid var(--border)">SÂN ${sn}</div>`;
        
        const live = ms.find(([k,m]) => m.status === 'LIVE');
        if(live) {
            const [k,m] = live;
            html += `<div class="match-box match-live">
                <span class="badge" style="background:var(--red)">TRẬN ${m.code} - LIVE</span>
                <div style="font-size:10px; text-align:center; color:#cbd5e1; margin-top:12px">${m.type || 'Đ.Kháng'} | ${m.title}</div>
                <div class="live-grid" style="margin-top:10px">
                    <div>
                        ${isLogged ? `<button class="btn btn-point" style="background:var(--red); width:100%" onclick="upS('${k}',1,1)">+1</button>` : ''}
                        <div class="team-name" style="color:#ff4d4d; margin-top:5px">${m.teamA}</div>
                        <div style="font-size:11px">${m.athleteA}</div>
                    </div>
                    <div class="score-box">${m.score1}-${m.score2}</div>
                    <div>
                        ${isLogged ? `<button class="btn btn-point" style="background:var(--blue); width:100%" onclick="upS('${k}',2,1)">+1</button>` : ''}
                        <div class="team-name" style="color:#4d94ff; margin-top:5px">${m.teamB}</div>
                        <div style="font-size:11px">${m.athleteB}</div>
                    </div>
                </div>
                <div class="ref-display-grid">${formatRef(m.assigned)}</div>
                ${isLogged ? `<button class="btn" style="background:#334155; margin-top:10px" onclick="setS('${k}','DONE')">KẾT THÚC TRẬN ĐẤU</button>` : ''}
            </div>`;
        }

        ms.filter(([k,m]) => m.status === 'WAIT').sort((a,b)=>a[1].code - b[1].code).slice(0,2).forEach(([k,m]) => {
            html += `<div class="match-box match-wait">
                <span class="badge" style="background:var(--gold); color:black">TRẬN ${m.code} - TIẾP THEO</span>
                <div style="font-size:10px; text-align:center; color:#aaa; margin-top:12px">${m.type || 'Đ.Kháng'} | ${m.title}</div>
                <div class="match-grid" style="margin:8px 0">
                    <span class="team-name" style="color:#ff4d4d">${m.teamA}</span><span style="font-weight:900; font-size:14px">VS</span><span class="team-name" style="color:#4d94ff">${m.teamB}</span>
                </div>
                <div class="ref-display-grid">${formatRef(m.assigned)}</div>
                ${isLogged && !live ? `<button class="btn" style="background:var(--success);margin-top:8px" onclick="setS('${k}','LIVE')">BẮT ĐẦU THI ĐẤU</button>` : ''}
            </div>`;
        });

        ms.filter(([k,m]) => m.status === 'DONE').sort((a,b)=>b[1].code - a[1].code).slice(0,2).forEach(([k,m]) => {
            html += `<div class="match-box match-done"><span class="badge" style="background:#475569">TRẬN ${m.code} - KẾT THÚC</span>
                <div class="match-grid" style="margin-top:12px">
                    <span class="team-name">${m.teamA}</span><span style="color:var(--gold)">${m.score1}-${m.score2}</span><span class="team-name">${m.teamB}</span>
                </div></div>`;
        });

        grid.innerHTML += html + `</div>`;
    });
}

function formatRef(str) {
    if(!str) return `<div class="ref-tag" style="grid-column:span 2;text-align:center;color:var(--gold)">CHỜ BỐC THĂM...</div>`;
    return str.split(' | ').map(p => {
        const [r, n] = p.split(': ');
        const refObj = Object.values(st.refs).find(x => x.name === n);
        const unit = refObj ? `<br><span class="ref-unit">(${refObj.team})</span>` : '';
        return `<div class="ref-tag"><b>${r}:</b> ${n}${unit}</div>`;
    }).join('');
}

function saveMatch() {
    const m = { 
        court: document.getElementById('m-court').value, code: document.getElementById('m-code').value, 
        type: document.getElementById('m-type').value, title: document.getElementById('m-title-select').value, 
        age: document.getElementById('m-age-select').value, teamA: document.getElementById('m-teamA').value, 
        teamB: document.getElementById('m-teamB').value, athleteA: document.getElementById('m-vA').value, 
        athleteB: document.getElementById('m-vB').value, score1:0, score2:0, status:'WAIT' 
    };
    if(!m.code || !m.athleteA) return alert("Vui lòng nhập đủ thông tin!");
    db.ref('tkd_online_data/matches').push(m).then(()=> { document.getElementById('m-code').value++; alert("Đã tạo trận!"); });
}

async function autoAssignAll() {
    const un = Object.entries(st.matches).filter(([k,m]) => m.status === 'WAIT' && !m.assigned);
    for (const [mid, m] of un) {
        let nr = Object.entries(st.refs).filter(([k,r]) => r.team !== m.teamA && r.team !== m.teamB).sort(()=>Math.random()-0.5);
        const isQ = m.type === "Quyền";
        const lb = isQ ? ["GĐ1", "GĐ2", "GĐ3", "GĐ4", "GĐ5"] : ["TTC", "GĐ1", "GĐ2", "GĐ3"];
        if(nr.length >= lb.length) {
            const ass = nr.slice(0, lb.length).map((r,i) => `${lb[i]}: ${r[1].name}`).join(" | ");
            await db.ref(`tkd_online_data/matches/${mid}/assigned`).set(ass);
        }
    }
}

function login() { if(document.getElementById('pass').value==='123') { localStorage.setItem('tkd_admin','true'); location.reload(); } }
function showTab(i) { document.querySelectorAll('.tab-btn, .panel').forEach((el, idx) => el.classList.toggle('active', i === idx % 4)); }
function upS(k,t,v) { const f = t===1?'score1':'score2'; db.ref(`tkd_online_data/matches/${k}/${f}`).set((st.matches[k][f]||0)+v); }
function setS(k,s) { db.ref(`tkd_online_data/matches/${k}/status`).set(s); }
function factoryReset() { if(confirm("Xác nhận xóa trắng toàn bộ dữ liệu?")) db.ref('tkd_online_data').set({ athletes:{}, refs:{}, matches:{}, info:{name:"GIẢI TAEKWONDO MỚI", date:"2026"} }); }
function processBulk(t) { 
    const lines = document.getElementById(t==='vdv'?'bulk-vdv':'bulk-ref').value.split('\n');
    lines.forEach(l => { const p = l.split('\t'); if(p.length>=2) db.ref(`tkd_online_data/${t==='vdv'?'athletes':'refs'}`).push({team:p[0].trim(), name:p[1].trim(), cat:p[2]||'', age:p[3]||''}); });
    alert("Đã lưu!");
}

function editData(type, id) {
    const item = st[type][id];
    const newName = prompt("Sửa Tên:", item.name);
    if(newName === null) return;
    const newTeam = prompt("Sửa Đơn vị:", item.team);
    let updateObj = { name: newName, team: newTeam };
    if(type === 'athletes') {
        updateObj.cat = prompt("Sửa Nội dung/Hạng cân:", item.cat);
        updateObj.age = prompt("Sửa Lứa tuổi:", item.age);
    }
    db.ref(`tkd_online_data/${type}/${id}`).update(updateObj);
}

function renderDataList() {
    const type = document.getElementById('data-type-select').value;
    const filter = document.getElementById('filter-data').value;
    let html = '';
    Object.entries(st[type] || {}).forEach(([k,v]) => {
        if(!filter || v.team === filter) {
            html += `<div class="data-item">
                <div class="data-info"><b>${v.name}</b> (${v.team}) <br><span style="color:#aaa; font-size:10px">${v.cat ? v.cat + ' | ' + v.age : ''}</span></div>
                <div class="data-actions">
                    <button class="btn-edit" onclick="editData('${type}', '${k}')">Sửa</button>
                    <button class="btn-del" onclick="if(confirm('Xóa?')) db.ref('tkd_online_data/${type}/${k}').remove()">Xóa</button>
                </div>
            </div>`;
        }
    });
    document.getElementById('data-list-container').innerHTML = html;
}
</script>
