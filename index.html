<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý CLUB TAEKWONDO TST</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #0033A0;
            --danger-color: #C8102E;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Logo */
        .logo-container { text-align: center; margin-bottom: 25px; }
        .logo-container img { max-width: 400px; height: auto; }
        
        h1 { text-align: center; color: var(--primary-color); border-bottom: 3px solid var(--primary-color); padding-bottom: 10px; margin-bottom: 30px; text-transform: uppercase; }
        
        /* Filters */
        .controls { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 25px; background: #eef2f5; padding: 15px; border-radius: 10px; align-items: center; justify-content: space-between; }
        .controls-left { display: flex; gap: 20px; align-items: center; }
        .controls label { font-weight: bold; }
        .controls input, .controls select { padding: 10px; border: 1px solid #ccc; border-radius: 6px; }

        /* Dashboard */
        .dashboard { display: flex; justify-content: space-between; margin-bottom: 25px; gap: 15px; }
        .card { flex: 1; padding: 20px; border-radius: 10px; text-align: center; color: white; font-weight: bold; }
        .card-income { background-color: var(--success-color); }
        .card-expense { background-color: var(--danger-color); }
        .card-balance { background-color: var(--primary-color); }
        .card h3 { margin: 0; font-size: 0.9em; text-transform: uppercase; opacity: 0.9; }
        .card p { margin: 5px 0 0 0; font-size: 1.6em; }

        /* Form */
        .form-container { background-color: #fff; padding: 20px; border-radius: 10px; margin-bottom: 30px; border: 2px solid #eef2f5; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; display: flex; flex-direction: column; min-width: 180px; }
        .form-group label { font-size: 0.85em; margin-bottom: 8px; font-weight: bold; color: #555; }
        .form-group input, .form-group select { padding: 12px; border: 1px solid #ccd1d9; border-radius: 6px; font-size: 1em; }
        
        #newStudentInfo { display: none; background: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 4px solid var(--success-color); margin-bottom: 15px; }

        /* Buttons */
        .button-group { display: flex; gap: 10px; justify-content: center; }
        button { padding: 12px 24px; cursor: pointer; border-radius: 6px; font-weight: bold; font-size: 1.1em; border: none; transition: 0.2s; }
        button.btn-add { background-color: var(--primary-color); color: white; flex: 2; }
        button.btn-add:hover { background-color: #002277; }
        button.btn-excel { background-color: #2e7d32; color: white; flex: 1; }
        button.btn-excel:hover { background-color: #1b5e20; }
        button.btn-reset { background-color: #aaa; color: white; flex: 1; }
        
        button.btn-zalo { background-color: #0068ff; color: white; padding: 6px 12px; font-size: 0.85em; text-decoration: none; border-radius: 4px; display: inline-block; }
        button.btn-zalo:hover { background-color: #0056d2; }

        /* Table */
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .search-bar { width: 350px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.95em; }
        th { background-color: var(--primary-color); color: white; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75em; font-weight: bold; }
        .badge-info { background: #e8f5e9; color: #2e7d32; }
        .badge-warning { background-color: var(--warning-color); color: #856404; }
        
        .text-income { color: var(--success-color); font-weight: bold; }
        .text-expense { color: var(--danger-color); font-weight: bold; }
        .contact-info { font-size: 0.8em; color: #666; display: block; margin-top: 4px; }
        
        .delete-btn { color: #ff4c4c; cursor: pointer; border: 1px solid #ff4c4c; background: transparent; padding: 4px 8px; border-radius: 4px; }
        
        /* Loading Overlay */
        #loading { display: none; text-align: center; padding: 20px; font-weight: bold; color: var(--primary-color); }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="Logo CLB mới xóa nên.png" alt="TST Taekwondo Logo">
    </div>
    <h1>CLUB TAEKWONDO TST - QUẢN LÝ ONLINE</h1>
    
    <div class="controls">
        <div class="controls-left">
            <div>
                <label>Tháng báo cáo: </label>
                <input type="month" id="filterMonth">
            </div>
            <div>
                <label>Cơ sở: </label>
                <select id="filterBranch">
                    <option value="all">Tất cả cơ sở</option>
                    <option value="CS1">CS1: Huỳnh Tấn Phát</option>
                    <option value="CS2">CS2: Sân vận động</option>
                </select>
            </div>
        </div>
        <div>
            <button id="showDebtBtn" style="background-color: var(--warning-color); color: #856404; font-weight: bold; padding: 12px 20px;">LỌC VÕ SINH NỢ PHÍ</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="card card-income"><h3>Tổng Thu (Tháng này)</h3><p id="totalIncome">0 ₫</p></div>
        <div class="card card-expense"><h3>Tổng Chi (Tháng này)</h3><p id="totalExpense">0 ₫</p></div>
        <div class="card card-balance"><h3>Quỹ Hiện Tại</h3><p id="balance">0 ₫</p></div>
    </div>

    <div class="form-container">
        <h3 style="margin-top:0; color: var(--primary-color)">Nhập Giao Dịch Mới</h3>
        <form id="transactionForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Cơ sở</label>
                    <select id="branch" required>
                        <option value="CS1">CS1: Huỳnh Tấn Phát</option>
                        <option value="CS2">CS2: Sân vận động</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Loại giao dịch</label>
                    <select id="type" required>
                        <option value="Học phí">Học phí</option>
                        <option value="Võ phục">Võ phục</option>
                        <option value="Học phí và Võ phục">Học phí & Võ phục</option>
                        <option value="Chi phí vận hành">Chi (Điện, nước, thảm...)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Trạng thái</label>
                    <select id="studentStatus">
                        <option value="old">Võ sinh Cũ (Đang tập)</option>
                        <option value="new">Võ sinh Mới (Gia nhập)</option>
                        <option value="quit">Khác (Nghỉ tập...)</option>
                    </select>
                </div>
            </div>

            <div id="newStudentInfo">
                <div class="form-row">
                    <div class="form-group">
                        <label>Ngày sinh</label>
                        <input type="date" id="studentDob">
                    </div>
                    <div class="form-group">
                        <label>SĐT Võ sinh</label>
                        <input type="tel" id="studentPhone" placeholder="090...">
                    </div>
                    <div class="form-group">
                        <label>SĐT Phụ huynh (Dùng để nhắc Zalo)</label>
                        <input type="tel" id="parentPhone" placeholder="091...">
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" style="flex: 2;">
                    <label>Tên Võ Sinh / Nội dung chi</label>
                    <input type="text" id="description" list="allStudentList" placeholder="Gõ tên để nhận diện..." required autocomplete="off">
                    <datalist id="allStudentList"></datalist>
                </div>
                <div class="form-group">
                    <label>Số tiền (VNĐ)</label>
                    <input type="text" id="amountDisplay" placeholder="500.000" required>
                    <input type="hidden" id="amountActual">
                </div>
                <div class="form-group">
                    <label>Ngày ghi nhận</label>
                    <input type="date" id="date" required>
                </div>
            </div>
            <div class="button-group">
                <button type="submit" class="btn btn-primary btn-add" id="submitBtn">LƯU HỆ THỐNG</button>
                <button type="button" class="btn btn-excel" id="exportBtn">📋 XUẤT EXCEL</button>
                <button type="button" class="btn btn-reset" id="resetBtn">🔄 LÀM MỚI</button>
            </div>
        </form>
    </div>

    <div class="table-header">
        <h3 style="margin:0">Lịch Sử Giao Dịch</h3>
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Tìm tên hoặc nội dung...">
    </div>

    <div id="loading">⏳ Đang tải dữ liệu từ Firebase...</div>
    <table>
        <thead>
            <tr>
                <th>Ngày</th>
                <th>Cơ Sở</th>
                <th>Võ Sinh / Thông Tin</th>
                <th>Loại</th>
                <th>Số Tiền</th>
                <th>Thao Tác</th>
            </tr>
        </thead>
        <tbody id="transactionList"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBfxbFrMabJHbARXpAqStIrSFlSAcCxgGY",
  authDomain: "quanly-tst.firebaseapp.com",
  projectId: "quanly-tst",
  storageBucket: "quanly-tst.firebasestorage.app",
  messagingSenderId: "981970279440",
  appId: "1:981970279440:web:8ac137ec4f72a39faa7e95",
  measurementId: "G-Z1M9YYDZL1"
};:
    // Khởi tạo Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Biến lưu trữ dữ liệu cục bộ để render
    let studentProfiles = {};
    let transactions = [];
    let isDebtMode = false;

    // --- Lắng nghe dữ liệu thời gian thực từ Firebase ---
    document.getElementById('loading').style.display = 'block';
    
    // Lắng nghe Hồ sơ võ sinh
    onSnapshot(collection(db, "students"), (snapshot) => {
        studentProfiles = {};
        snapshot.forEach((docSnap) => {
            studentProfiles[docSnap.id] = docSnap.data();
        });
        updateDatalist();
        render();
    });

    // Lắng nghe Giao dịch
    onSnapshot(collection(db, "transactions"), (snapshot) => {
        transactions = [];
        snapshot.forEach((docSnap) => {
            transactions.push({ id: docSnap.id, ...docSnap.data() });
        });
        document.getElementById('loading').style.display = 'none';
        render();
    });

    // --- CÁC HÀM TIỆN ÍCH ---
    function formatName(str) {
        return str.trim().toLowerCase().replace(/\s+/g, ' ').split(' ')
                  .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }
    const formatCurrency = (val) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(val);

    // Xử lý hiển thị tiền tệ input
    const amountDisplay = document.getElementById('amountDisplay');
    const amountActual = document.getElementById('amountActual');
    amountDisplay.addEventListener('input', function(e) {
        let value = this.value.replace(/\D/g, '');
        if (value) {
            amountActual.value = value;
            this.value = parseInt(value).toLocaleString('vi-VN');
        } else {
            amountActual.value = ''; this.value = '';
        }
    });

    // Xử lý hiện Form thông tin võ sinh mới
    const statusSelect = document.getElementById('studentStatus');
    const newInfoBox = document.getElementById('newStudentInfo');
    const descInput = document.getElementById('description');

    function toggleNewInfo() {
        newInfoBox.style.display = (statusSelect.value === 'new') ? 'block' : 'none';
    }
    statusSelect.addEventListener('change', toggleNewInfo);

    descInput.addEventListener('input', function() {
        const val = this.value.trim().toLowerCase();
        const isExisting = Object.keys(studentProfiles).some(p => p.toLowerCase() === val);
        if (isExisting) {
            statusSelect.value = 'old';
        } else if (val.length > 3) {
            statusSelect.value = 'new';
        }
        toggleNewInfo();
    });

    function updateDatalist() {
        const dl = document.getElementById('allStudentList');
        dl.innerHTML = '';
        Object.values(studentProfiles).filter(p => p.status === 'active').forEach(p => {
            const o = document.createElement('option');
            o.value = p.name;
            dl.appendChild(o);
        });
    }

    // --- HÀM RENDER (VẼ GIAO DIỆN) ---
    function render() {
        const list = document.getElementById('transactionList');
        const selMonth = document.getElementById('filterMonth').value;
        const selBranch = document.getElementById('filterBranch').value;
        const search = document.getElementById('searchInput').value.toLowerCase();
        
        list.innerHTML = '';
        let inc = 0, exp = 0;
        const monthText = selMonth ? selMonth.split('-')[1] : (new Date().getMonth() + 1);

        // 1. CHẾ ĐỘ LỌC NỢ
        if(isDebtMode) {
            const activeStudents = Object.values(studentProfiles).filter(p => {
                if(p.status !== 'active') return false;
                if(selBranch !== 'all' && p.branch !== selBranch) return false;
                if(p.createdAt && selMonth && p.createdAt.substring(0,7) > selMonth) return false;
                return true;
            });

            const paidThisMonth = transactions.filter(t => {
                return t.type === 'Học phí' && t.date.substring(0, 7) === selMonth;
            }).map(t => t.studentName);

            const debtStudents = activeStudents.filter(p => !paidThisMonth.includes(p.name));

            debtStudents.forEach(p => {
                const msg = `Xin chào phụ huynh võ sinh ${p.name}, CLUB TAEKWONDO TST gửi thông báo học phí tháng ${monthText} của bé vẫn chưa được hoàn thành. Nhờ anh/chị kiểm tra và đóng học phí cho bé ạ. Trân trọng!`;
                const zaloLink = p.pPhone ? `https://zalo.me/${p.pPhone}` : `https://zalo.me/s/search/?q=${encodeURIComponent(p.pPhone || p.sPhone || p.name)}`;

                const row = `<tr>
                    <td>---</td>
                    <td><span class="badge" style="background:#eee; color:#333">${p.branch}</span></td>
                    <td>
                        <span class="badge badge-warning">Nợ học phí</span> <strong>${p.name}</strong>
                        <span class="contact-info">👨‍👩‍👧 PH: ${p.pPhone || 'Chưa cập nhật'}</span>
                    </td>
                    <td><span class="badge badge-warning">Tháng ${monthText}</span></td>
                    <td style="color:red; font-weight: bold">Chưa đóng</td>
                    <td><a href="${zaloLink}" target="_blank" class="btn-zalo" onclick="copyToClipboard('${msg}')">💬 Nhắc Zalo</a></td>
                </tr>`;
                list.innerHTML += row;
            });

            document.querySelector('.dashboard').style.display = 'none';
            return;
        }

        // 2. CHẾ ĐỘ HIỂN THỊ BÌNH THƯỜNG
        document.querySelector('.dashboard').style.display = 'flex';
        
        const filteredTx = transactions.filter(t => {
            const m = t.date.substring(0, 7);
            const matchM = !selMonth || m === selMonth;
            const matchB = selBranch === 'all' || t.branch === selBranch;
            const matchS = t.description.toLowerCase().includes(search) || t.studentName.toLowerCase().includes(search);
            return matchM && matchB && matchS;
        });

        filteredTx.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(t => {
            const isInc = t.type !== 'Chi phí vận hành';
            if(isInc) inc += t.amount; else exp += t.amount;

            const p = studentProfiles[t.studentName];
            let extra = '';
            if (p && t.type !== 'Chi phí vận hành') {
                extra = `<span class="contact-info">📱 VS: ${p.sPhone || '-'} | 👨‍👩‍👧 PH: ${p.pPhone || '-'}</span>`;
            }

            let isNewBadge = (p && p.createdAt && p.createdAt.substring(0,7) === selMonth) ? `<span class="badge badge-info">Mới</span> ` : '';

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${new Date(t.date).toLocaleDateString('vi-VN')}</td>
                <td><span class="badge" style="background:#eee; color:#333">${t.branch}</span></td>
                <td>${isNewBadge}<strong>${t.description}</strong>${extra}</td>
                <td>${t.type}</td>
                <td class="${isInc ? 'text-income' : 'text-expense'}">${isInc ? '+' : '-'}${formatCurrency(t.amount)}</td>
                <td><button class="delete-btn" onclick="removeTx('${t.id}')">Xóa</button></td>
            `;
            list.appendChild(row);
        });

        document.getElementById('totalIncome').innerText = formatCurrency(inc);
        document.getElementById('totalExpense').innerText = formatCurrency(exp);
        document.getElementById('balance').innerText = formatCurrency(inc - exp);
    }

    // --- LƯU LÊN FIREBASE ---
    document.getElementById('transactionForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = "ĐANG LƯU..."; btn.disabled = true;

        const type = document.getElementById('type').value;
        let rawName = document.getElementById('description').value;
        let formattedName = formatName(rawName);
        const descriptionValue = type === 'Chi phí vận hành' ? rawName.trim() : formattedName;
        const entryDate = document.getElementById('date').value;
        const entryBranch = document.getElementById('branch').value;

        try {
            // Lưu profile nếu là võ sinh
            if (type !== 'Chi phí vận hành') {
                await setDoc(doc(db, "students", formattedName), {
                    name: formattedName,
                    dob: document.getElementById('studentDob').value || '',
                    sPhone: document.getElementById('studentPhone').value || '',
                    pPhone: document.getElementById('parentPhone').value || '',
                    branch: entryBranch,
                    status: statusSelect.value === 'quit' ? 'quit' : 'active',
                    createdAt: studentProfiles[formattedName]?.createdAt || entryDate
                }, { merge: true });
            }

            // Lưu giao dịch
            await addDoc(collection(db, "transactions"), {
                branch: entryBranch,
                type: type,
                status: statusSelect.value,
                description: descriptionValue,
                studentName: formattedName,
                amount: parseFloat(amountActual.value),
                date: entryDate
            });

            e.target.reset();
            document.getElementById('date').valueAsDate = new Date();
            toggleNewInfo();
            
            // Thoát chế độ lọc nợ nếu đang bật
            isDebtMode = false;
            document.getElementById('showDebtBtn').innerText = "LỌC VÕ SINH NỢ PHÍ";
            
        } catch (error) {
            alert("Lỗi khi lưu: " + error.message);
        } finally {
            btn.innerText = "LƯU HỆ THỐNG"; btn.disabled = false;
        }
    };

    // --- HÀM GẮN CHO GIAO DIỆN HTML (Window Bindings) ---
    window.removeTx = async (id) => { 
        if(confirm('Xóa giao dịch này trên hệ thống?')) { 
            await deleteDoc(doc(db, "transactions", id));
        } 
    };

    window.copyToClipboard = (text) => {
        navigator.clipboard.writeText(text).then(() => {
            alert("Đã copy tin nhắn nhắc nợ! Bạn hãy dán (Ctrl+V) vào ô chat Zalo nhé.");
        });
    };

    // --- CÁC NÚT ĐIỀU KHIỂN ---
    document.getElementById('showDebtBtn').onclick = function() {
        const selMonth = document.getElementById('filterMonth').value;
        if(!selMonth) { alert("Vui lòng chọn 'Tháng báo cáo' để lọc nợ."); return; }
        
        isDebtMode = !isDebtMode;
        this.innerText = isDebtMode ? "HIỆN TẤT CẢ GIAO DỊCH" : "LỌC VÕ SINH NỢ PHÍ";
        render();
    };
    
    document.getElementById('resetBtn').onclick = function() {
        document.getElementById('filterMonth').value = new Date().toISOString().substring(0, 7);
        document.getElementById('filterBranch').value = 'all';
        document.getElementById('searchInput').value = '';
        isDebtMode = false;
        document.getElementById('showDebtBtn').innerText = "LỌC VÕ SINH NỢ PHÍ";
        render();
    };

    document.getElementById('exportBtn').onclick = () => {
        const selMonth = document.getElementById('filterMonth').value;
        const selBranch = document.getElementById('filterBranch').value;
        
        const filteredTx = transactions.filter(t => {
            return (!selMonth || t.date.substring(0, 7) === selMonth) && 
                   (selBranch === 'all' || t.branch === selBranch);
        });

        if (filteredTx.length === 0) { alert("Không có dữ liệu để xuất!"); return; }

        const dataExcel = filteredTx.map(t => {
            const p = studentProfiles[t.studentName];
            return {
                "Ngày": new Date(t.date).toLocaleDateString('vi-VN'),
                "Cơ sở": t.branch,
                "Nội dung": t.description,
                "Loại": t.type,
                "Số tiền": t.amount,
                "SĐT Phụ huynh": p ? p.pPhone : '-'
            }
        });

        const worksheet = XLSX.utils.json_to_sheet(dataExcel);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "SaoKeTST");
        XLSX.writeFile(workbook, `SaoKe_TST_${selBranch}_${selMonth}.xlsx`);
    };

    // Khởi tạo bộ lọc ban đầu
    document.getElementById('filterMonth').value = new Date().toISOString().substring(0, 7);
    document.getElementById('date').valueAsDate = new Date();
    document.getElementById('filterMonth').onchange = render;
    document.getElementById('filterBranch').onchange = render;
    document.getElementById('searchInput').oninput = render;

</script>
</body>
</html>
